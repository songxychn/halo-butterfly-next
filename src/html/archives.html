<th:block th:with="archivePath=${#ctx.getExchange().getRequest().getRequestPath()}, archiveSegments=${#strings.arraySplit(archivePath, '/')}, archiveDated=${(archivePath matches '/archives/[0-9]{4}(/.*)?')}, archiveMonth=${archiveDated and #arrays.length(archiveSegments) > 2 and (archiveSegments[2] matches '[0-9]{1,2}')}, archiveTitle=${archiveDated ? (archiveSegments[1] + (archiveMonth ? '-' + archiveSegments[2] : '')) : (#strings.isEmpty(#strings.trim(theme.config.archives?.title)) ? #messages.msg('ui.archives') : theme.config.archives.title)}">
<layout
  th:replace="~{views/layout :: layout (
  page = 'archives',
  title = ${site.title} + ' - ' + ${archiveTitle},
  pin = ~{::pin},
  header = ~{::header},
  main = ~{::main}
  )}"
>
  <!--/* pin */-->
  <th:block th:fragment="pin">
    <script data-theme-script="page-config" id="pageScript" th:inline="javascript">
      window.MainApp.data =  /*[[${postFinder.archives(1,archives.total).items}]]*/ [];

      Object.assign(window.MainApp.conf, {
        //第一屏
        enable_above: /*[[${aboveEnabled}]]*/ '',
        above_background: /*[[${aboveBackground}]]*/ '',
        archive_title: /*[[${theme.config.archives?.title ?: ''}]]*/ '',
        archive_dated: /*[[${archiveDated}]]*/ false,
        // 分页
        nextUrl: /*[[${archives.nextUrl}]]*/ {},
        prevUrl: /*[[${archives.prevUrl}]]*/ {},
        page: /*[[${archives.page}]]*/ {},
        size: /*[[${archives.size}]]*/ {},
        total: /*[[${archives.total}]]*/ {},
        totalPages: /*[[${archives.totalPages}]]*/ {},
        hasPrevious: /*[[${archives.hasPrevious()}]]*/ {},
        hasNext: /*[[${archives.hasNext()}]]*/ {},
      });
    </script>
  </th:block>

  <!--/* header */-->
  <th:block th:fragment="header">
    <header th:class="${not aboveEnabled ? 'header dp' : 'header'}">
      <!--/* 导航栏 */-->
      <th:block th:replace="~{views/nav}"/>

      <!--第一屏内容-->
      <section class="above" th:if="${aboveEnabled}">
        <div class="above-info">
          <h1 class="above-title" data-archive-title th:text="${archiveTitle}">归档</h1>
        </div>
      </section>
    </header>
  </th:block>


  <!--/* 內容 */-->
  <th:block th:fragment="main">
    <section class="content card" th:with="noData = ${not #lists.isEmpty(archives.items)}">
      <h1 class="page-title" th:if="${not aboveEnabled}" data-archive-title th:text="${archiveTitle}"></h1>

      <th:block th:if="${noData}">
        <div class="chart"></div>

        <div class="axis-title" th:text="#{ui.archiveTotal(${archives.total})}"></div>

        <ul class="axis-list">
          <th:block th:each="archive : ${archives.items}">
            <li class="axis-list--item year" th:if="${theme.config.archives?.year != false}">
              <span class="name" th:text="${archive.year}"></span>
            </li>

            <th:block th:each="months : ${archive.months}">
              <li class="axis-list--item month" th:if="${theme.config.archives?.month == true}"><span class="name" th:text="|${archive.year}-${months.month}|"></span></li>
              <li class="axis-list--item "
                  th:each="post : ${months.posts}"
                  th:with="
                    coverSrc = ${not #strings.isEmpty(post.spec.cover) ? post.spec.cover : (not #lists.isEmpty(coverCandidates) ? coverCandidates[(post.metadata.name.hashCode() % #lists.size(coverCandidates) + #lists.size(coverCandidates)) % #lists.size(coverCandidates)].url : theme.config.cover.default_cover)},
                    showCover = ${theme.config.cover.archives_enable != false and (not #strings.isEmpty(coverSrc) or theme.config.loading.img.random_enable)}
                  "
                  th:classappend="${showCover ? '' : ' no-cover'}">

                <a th:if="${showCover}" class="cover" th:href="${post.status.permalink}">
                  <img th:replace="~{views/components:: lazyLoadImg(${coverSrc},${post.spec.title},'img',true,${param_prefix +'v=' + #dates.format(post.spec.publishTime, 'yyyyMMddhhmmss')})}"/>
                </a>

                <div class="info">
                  <time th:text="#{ui.published}+${#dates.format(post.spec.publishTime, datePattern ?: 'yyyy-MM-dd HH:mm')}"></time>

                  <a class="title" th:href="${post.status.permalink}" th:text="${post.spec.title}"></a>
                </div>

              </li>

            </th:block>
          </th:block>
        </ul>

      </th:block>

      <th:block th:unless="${noData}" th:insert="~{views/components:: emptyData(false)}"></th:block>
    </section>
    <th:block th:replace="~{views/aside::common}"/>
  </th:block>

</layout>
</th:block>
