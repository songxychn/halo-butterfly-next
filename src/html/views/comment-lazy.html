<!-- Lazy mode uses the official plugin's public Web Component API. -->
<div th:fragment="widget(kind, name)" class="comment-lazy" data-comment-lazy
     data-group="content.halo.run" th:attr="data-kind=${kind},data-name=${name}">
  <p class="comment-lazy-status" data-comment-status role="status" aria-live="polite">接近评论区时自动加载评论。</p>
  <button class="comment-lazy-retry" data-comment-retry type="button" hidden>重试加载评论</button>
  <div data-comment-host></div>
  <noscript><p>请启用 JavaScript 以加载评论。</p></noscript>
</div>
