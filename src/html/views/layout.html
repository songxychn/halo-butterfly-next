<th:block
  xmlns:th="https://www.thymeleaf.org"
  th:with="
     coverCandidates = ${theme.config.cover?.default_cover_list == null ? {} : theme.config.cover.default_cover_list.?[#this != null and not #strings.isEmpty(#strings.trim(url))]},
     topImgConfig = ${theme.config[(page == 'category' or page == 'categories') ? 'categories' : ((page == 'tag' or page == 'tags') ? 'tags' : (page == 'archives' ? 'archives' : (page == 'post' ? 'post' : (page == 'single' ? 'single' : (page == 'index' ? 'index' : 'image')))))]},
     topImgOverride = ${page == 'post' ? #annotations.getOrDefault(post, 'top_img_enable', 'inherit') : (page == 'single' ? #annotations.getOrDefault(singlePage, 'top_img_enable', 'inherit') : 'inherit')},
     aboveEnabled = ${theme.config.image?.disable_top_img != true and theme.config.image?.disable_top_img != 'true' and (topImgOverride == 'true' or (topImgOverride != 'false' and ((page == 'links' or page == 'photos' or page == 'moments') ? (theme.config.image?.other_pages_above != false and theme.config.image?.other_pages_above != 'false') : (topImgConfig?.enable_above != false and topImgConfig?.enable_above != 'false'))))},
     defaultTopImg = ${theme.config.image?.default_top_img ?: ''},
     nativeTopImg = ${page == 'post' ? post.spec.cover : (page == 'single' ? singlePage.spec.cover : (page == 'category' ? category.spec.cover : (page == 'tag' ? tag.spec.cover : '')))},
     pageTopImg = ${(page == 'post' or page == 'single' or (page != 'index' and page != 'archives' and page != 'category' and page != 'categories' and page != 'tag' and page != 'tags')) ? '' : (topImgConfig?.above_background ?: '')},
     aboveBackground = ${not #strings.isEmpty(nativeTopImg) ? nativeTopImg : (not #strings.isEmpty(pageTopImg) ? pageTopImg : defaultTopImg)},
     asideDisplay = ${theme.config.aside.display},
     asidePageVisible = ${(page != 'archives' or asideDisplay?.archive != false) and ((page != 'tag' and page != 'tags') or asideDisplay?.tag != false) and ((page != 'category' and page != 'categories') or asideDisplay?.category != false)},
     asideEnabled = ${theme.config.aside.enable != false and theme.config.aside.enable != 'false' and asidePageVisible},
     canonicalBase = ${#strings.endsWith(site.url, '/') ? #strings.substring(site.url, 0, #strings.length(site.url) - 1) : #strings.toString(site.url)},
     canonicalOrigin = ${#strings.substringBefore(canonicalBase, '://') + '://' + #strings.substringBefore(#strings.substringAfter(canonicalBase + '/', '://'), '/')},
     canonicalPath = ${page == 'post' ? post.status.permalink : (page == 'single' ? singlePage.status.permalink : #ctx.getExchange().getRequest().getRequestPath())},
     canonical = ${#strings.startsWith(canonicalPath, 'http://') or #strings.startsWith(canonicalPath, 'https://') ? canonicalPath : canonicalOrigin + canonicalPath},
     assets_link = ${#theme.assets('/') + '/'},
     param_prefix = ${#strings.containsIgnoreCase(theme.config.loading.img.random_link,'?') ? '&' : '?'}
  "
  th:fragment="layout (page,title,pin,header,main)"
>
  <!DOCTYPE html>
  <html
    th:lang="${#locale.toLanguageTag()}"
    data-theme-navigation="1"
    data-color-scheme="light"
    th:classappend="${(theme.config.aside.enable and (theme.config.aside.hide == true or theme.config.aside.hide == 'true') ? 'hide-aside' : '') + (theme.config.aside.enable and (theme.config.aside.mobile == false or theme.config.aside.mobile == 'false') ? ' aside-mobile-off' : '')}"
    th:with="isDev = ${true ? #dates.createNow().time : ''} "
  >
  <head>
    <title th:text="${title}"></title>
    <meta charset="UTF-8"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no, viewport-fit=cover">
    <meta name="author" th:content="${site.title}">
    <meta name="site" th:content="${site.url}">
    <th:block th:replace="~{views/seo :: metadata(${page},${title})}"/>
    <th:block th:replace="~{views/config}"/>
    <th:block th:replace="${pin}"/>
    <script data-theme-script="above" id="aboveScript">/* @theme-above-background */</script>
    <link rel="preload stylesheet" as="style" th:href="${assets_link + 'css/' + page + '.min.css?v=' + theme.spec.version}">
    <noscript><style>.loading #Butterfly { display: block; } img[data-lazy-src] { display: none; }</style></noscript>
    <th:block th:replace="~{views/inject :: head}"/>
  </head>

  <body th:classappend="${theme.config.loading?.enable != false and theme.config.loading?.enable != 'false' and theme.config.loading?.mode == 'animation' ? 'loading' : ''}" th:with="stats = ${siteStatsFinder.getStats()},contributor = ${#strings.isEmpty(theme.config.base.metadata_name) ? null : contributorFinder.getContributor(theme.config.base.metadata_name)}">
  <th:block th:if="${theme.config.loading?.enable != false and theme.config.loading?.enable != 'false' and theme.config.loading?.mode == 'animation'}" th:switch="${theme.config.loading?.type}">
    <script data-theme-script="loading" th:case="'circle'">/* @theme-loading-circle */</script>
    <script data-theme-script="loading" th:case="'cross_line'">/* @theme-loading-cross_line */</script>
    <script data-theme-script="loading" th:case="'dot'">/* @theme-loading-dot */</script>
    <script data-theme-script="loading" th:case="'hourglass'">/* @theme-loading-hourglass */</script>
    <script data-theme-script="loading" th:case="*">/* @theme-loading-fallback */</script>
  </th:block>

  <div
    id="Butterfly"
    th:class="${page}"
    th:classappend="${theme.config.mask?.header != false and theme.config.mask?.header != 'false'} ? ' mask-header'"
  >
    <th:block th:replace="${header}"></th:block>

    <main class="main" th:classappend="${asideEnabled ? theme.config.aside.position : 'off-aside'}" th:insert="${main}"></main>

    <th:block th:replace="~{views/footer}"/>

    <th:block th:replace="~{views/components::side}"/>
  </div>

  <!-- The rendered body is complete; deferred enhancements can initialize afterwards. -->
  <script data-theme-script="ready" id="theme-content-ready">document.dispatchEvent(new Event('halo-butterfly-next:content-ready'));</script>

  <script data-theme-script="entry" defer type="text/javascript" th:src="${assets_link + 'js/' + page + '.min.js?v=' + theme.spec.version }"></script>
  <th:block th:replace="~{views/integrations::scripts}"/>
  <th:block th:replace="~{views/inject :: bottom}"/>
  </body>

  </html>
</th:block>
