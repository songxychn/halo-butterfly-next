<!--/* DEC-01: public Halo Post/SinglePage/Moment comments only. No comment payload in the inventory. */-->
<section xmlns:th="https://www.thymeleaf.org" th:fragment="card"
  th:if="${theme.config.aside.card_newest_comments?.enable == true and pluginFinder.available('PluginCommentWidget', '>=3.3.2') and haloCommentEnabled}"
  id="card-newest-comments" class="aside-newest-comments card" data-newest-comments
  th:attr="data-card-order=${theme.config.aside.card_newest_comments?.sort_order ?: 25},data-limit=${theme.config.aside.card_newest_comments?.limit ?: 6},data-storage=${theme.config.aside.card_newest_comments?.storage},data-avatar=${theme.config.aside.card_newest_comments?.avatar}"
>
  <h1 class="title"><i class="fas fa-comments" aria-hidden="true"></i><span class="name" th:text="#{ui.recentComments}">最新评论</span></h1>
  <ul class="newest-comments-list" data-comments-list></ul>
  <p class="newest-comments-status" data-comments-status role="status" th:text="#{ui.recentPreparing}">正在准备最新评论…</p>
  <button type="button" class="newest-comments-retry" data-comments-retry hidden th:text="#{ui.retry}">重试</button>
  <noscript><p th:text="#{ui.recentJs}">启用 JavaScript 后可查看最新评论。</p></noscript>
  <template data-comment-subjects>
    <th:block th:replace="~{::subjects('Post', 1)}"/>
    <th:block th:replace="~{::subjects('SinglePage', 1)}"/>
    <th:block th:if="${pluginFinder.available('PluginMoments', '>=1.18.0')}"><th:block th:replace="~{::momentSubjects(1)}"/></th:block>
  </template>
</section>

<!--/* Iterate every page, not just recent posts. An older post can have the newest comment. */-->
<th:block xmlns:th="https://www.thymeleaf.org" th:fragment="subjects(kind, pageNumber)"
  th:with="result=${kind == 'Post' ? postFinder.list({page: pageNumber, size: 1000}) : singlePageFinder.list(pageNumber, 1000)}">
  <th:block th:each="subject : ${result.items}">
    <a th:if="${subject.spec.visible != null and subject.spec.visible.toString() == 'PUBLIC' and subject.spec.deleted != true and subject.metadata.deletionTimestamp == null and subject.metadata.labels != null and subject.metadata.labels['content.halo.run/published'] == 'true' and subject.spec.allowComment == true and subject.stats != null and subject.stats.comment > 0}"
      th:href="${subject.status.permalink}"
      th:attr="data-comment-kind=${kind},data-comment-name=${subject.metadata.name},data-comment-revision=${subject.stats.comment + ':' + subject.spec.releaseSnapshot + ':' + subject.spec.allowComment}"></a>
  </th:block>
  <th:block th:if="${result.hasNext}"><th:block th:replace="~{::subjects(${kind}, ${pageNumber + 1})}"/></th:block>
</th:block>

<!-- Explicit public filter is required even for a logged-in owner's Finder. -->
<th:block xmlns:th="https://www.thymeleaf.org" th:fragment="momentSubjects(pageNumber)"
  th:with="result=${momentFinder.list(pageNumber, 1000)}">
  <a th:each="subject : ${result.items}"
    th:if="${subject.spec.visible != null and subject.spec.visible.toString() == 'PUBLIC' and subject.spec.approved == true and subject.metadata.deletionTimestamp == null and subject.stats != null and subject.stats.approvedComment > 0}"
    th:href="@{/moments/{name}(name=${subject.metadata.name})}"
    th:attr="data-comment-kind='Moment',data-comment-name=${subject.metadata.name},data-comment-revision=${subject.stats.approvedComment + ':' + subject.metadata.version}"></a>
  <th:block th:if="${result.hasNext}"><th:block th:replace="~{::momentSubjects(${pageNumber + 1})}"/></th:block>
</th:block>
