<th:block xmlns:th="https://www.thymeleaf.org" th:fragment="scripts" th:with="analytics=${theme.config.analytics},manualGa=${(analytics?.google_analytics_manual_pageviews == true or analytics?.google_analytics_manual_pageviews == 'true') and not #strings.isEmpty(analytics?.google_analytics) and analytics.google_analytics.matches('G-[A-Z0-9]+') and #strings.isEmpty(analytics?.baidu_analytics) and #strings.isEmpty(analytics?.cloudflare_analytics) and #strings.isEmpty(analytics?.microsoft_clarity) and #strings.isEmpty(analytics?.google_tag_manager?.tag_id) and analytics?.umami_analytics?.enable != true and analytics?.umami_analytics?.enable != 'true' and not #lists.contains({'chatra','tidio','crisp','knocket'},theme.config.chat?.use) and theme.config.google_adsense?.enable != true and theme.config.google_adsense?.enable != 'true' and #strings.isEmpty(theme.config.CDN?.option?.google_analytics)}">
  <script data-no-pjax defer th:unless="${manualGa}" th:src="${assets_link + 'js/integrations.min.js?v=' + theme.spec.version}"
          th:if="${not #strings.isEmpty(analytics?.baidu_analytics) or not #strings.isEmpty(analytics?.google_analytics) or not #strings.isEmpty(analytics?.cloudflare_analytics) or not #strings.isEmpty(analytics?.microsoft_clarity) or not #strings.isEmpty(analytics?.google_tag_manager?.tag_id) or analytics?.umami_analytics?.enable == true or analytics?.umami_analytics?.enable == 'true' or #lists.contains({'chatra','tidio','crisp','knocket'},theme.config.chat?.use) or theme.config.google_adsense?.enable == true or theme.config.google_adsense?.enable == 'true'}"></script>
  <script data-theme-script="analytics" defer th:if="${manualGa}" th:data-analytics-id="${analytics.google_analytics}"
          th:src="${assets_link + 'js/integrations.min.js?v=' + theme.spec.version}"></script>
</th:block>
