<th:block xmlns:th="https://www.thymeleaf.org" th:fragment="scripts" th:with="analytics=${theme.config.analytics}">
  <script data-no-pjax defer th:src="${assets_link + 'js/integrations.min.js?v=' + theme.spec.version}"
          th:if="${not #strings.isEmpty(analytics?.baidu_analytics) or not #strings.isEmpty(analytics?.google_analytics) or not #strings.isEmpty(analytics?.cloudflare_analytics) or not #strings.isEmpty(analytics?.microsoft_clarity) or not #strings.isEmpty(analytics?.google_tag_manager?.tag_id) or analytics?.umami_analytics?.enable == true or analytics?.umami_analytics?.enable == 'true' or #lists.contains({'chatra','tidio','crisp','knocket'},theme.config.chat?.use) or theme.config.google_adsense?.enable == true or theme.config.google_adsense?.enable == 'true'}"></script>
</th:block>
