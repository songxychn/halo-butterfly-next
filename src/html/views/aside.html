<!--/* 信息 */-->
<section xmlns:th="https://www.thymeleaf.org" th:fragment="user" th:if="${theme.config.aside.card_author?.enable != false}" th:attr="data-card-order=${theme.config.aside.card_author?.sort_order ?: 0}" class="aside-user card">
  <img
    th:src="${contributor?.avatar ?: #theme.assets('/images/above.svg')}"
    onerror="this.src='data:image/gif;base64,R0lGODdhAQABAPAAAMPDwwAAACwAAAAAAQABAAACAkQBADs='"
    th:alt="${contributor?.displayName ?: site.title}"
    class="avatar"
  >

  <h1 class="name" th:text="${contributor?.displayName ?: site.title}"></h1>

  <div class="desc" th:text="${contributor?.bio ?: site.subtitle}"></div>

  <div class="data w-100">
    <a class="item" title="文章" href="/archives">
      <div class="headline">文章</div>
      <div class="num" th:text="${stats.post}"></div>
    </a>
    <a class="item" href="/tags" title="标签">
      <div class="headline">标签</div>
      <div class="num" th:text="${tagFinder.list(1, 1).total}"></div>
    </a>
    <a class="item" href="/categories" title="分类">
      <div class="headline">分类</div>
      <div class="num" th:text="${stats.category}"></div>
    </a>
  </div>

  <a class="button" target="_blank" th:href="${theme.config.aside.button.link}"
     th:utext="${theme.config.aside.button.name}"></a>

  <div class="social" th:with="social = ${not #lists.isEmpty(theme.config.aside.social)}">
    <a th:each="item : ${theme.config.aside.social}" class="link" target="_blank" th:title="${item.name}" th:href="${item.link}" th:utext="${item.icon}"></a>
  </div>
</section>

<!--/* 公告 */-->
<section xmlns:th="https://www.thymeleaf.org" th:fragment="notice" th:if="${theme.config.aside.card_announcement?.enable != false}" th:attr="data-card-order=${theme.config.aside.card_announcement?.sort_order ?: 10}" class="aside-notice title card">
  <h1 class="title">
    <i class="fa-solid fa-bullhorn fa-shake"></i>
    <span class="name">公告</span>
  </h1>

  <div class="content" th:utext="${theme.config.aside.notice}"></div>
</section>

<!--/* 最近文章。对齐上游 card_recent_post；封面受 cover.aside_enable 控制。 */-->
<section
  xmlns:th="https://www.thymeleaf.org"
  th:fragment="recentPost"
  th:if="${theme.config.aside.card_recent_post.enable != false}"
  class="aside-recent-post card"
  th:attr="data-card-order=${theme.config.aside.card_recent_post?.sort_order ?: 20}"
>
  <h1 class="title">
    <i class="fas fa-history"></i>
    <span class="name">最新文章</span>
  </h1>

  <div
    class="content"
    th:with="
      rawLimit = ${theme.config.aside.card_recent_post.limit},
      recentLimit = ${rawLimit == null ? 5 : ((rawLimit <= 0 or rawLimit > 20) ? 20 : rawLimit)},
      sortUpdated = ${theme.config.aside.card_recent_post.sort == 'updated'},
      recentResult = ${sortUpdated ? postFinder.list({page: 1, size: recentLimit, sort: {'status.lastModifyTime,desc'}}) : postFinder.list({page: 1, size: recentLimit, sort: {'spec.publishTime,desc'}})},
      recentPosts = ${recentResult.items},
      noData = ${not #lists.isEmpty(recentPosts)}
    "
  >
    <th:block th:if="${noData}">
      <a
        class="item"
        th:each="post : ${recentPosts}"
        th:href="${post.status.permalink}"
        th:title="${post.spec.title}"
        th:with="
          coverSrc = ${not #strings.isEmpty(post.spec.cover) ? post.spec.cover : theme.config.cover.default_cover},
          showCover = ${theme.config.cover.aside_enable != false and (not #strings.isEmpty(coverSrc) or theme.config.loading.img.random_enable)}
        "
        th:classappend="${showCover ? '' : ' no-cover'}"
      >
        <span th:if="${showCover}" class="thumbnail">
          <img th:replace="~{views/components:: lazyLoadImg(${coverSrc},${post.spec.title},'img',true,${param_prefix +'v=' + #dates.format(post.spec.publishTime, 'yyyyMMddhhmmss')})}"/>
        </span>
        <span class="info">
          <span class="name" th:text="${post.spec.title}"></span>
          <time th:if="${sortUpdated}" th:datetime="${post.status.lastModifyTime}" th:text="${#dates.format(post.status.lastModifyTime, 'yyyy-MM-dd')}"></time>
          <time th:unless="${sortUpdated}" th:datetime="${post.spec.publishTime}" th:text="${#dates.format(post.spec.publishTime, 'yyyy-MM-dd')}"></time>
        </span>
      </a>
    </th:block>
    <th:block th:unless="${noData}" th:insert="~{views/components:: emptyData(false)}"></th:block>
  </div>
</section>

<!--/* 分类：Halo 树保留后台层级；无脚本时提供有数量限制的平铺链接。 */-->
<section xmlns:th="https://www.thymeleaf.org" th:fragment="category" th:if="${theme.config.aside.enable_category != false}" class="aside-category card"
  th:attr="data-card-order=${theme.config.aside.card_categories?.sort_order ?: 30}">
  <h1 class="title"><i class="fa-solid fa-layer-group"></i><span class="name">分类</span><a class="card-more-btn" href="/categories" aria-label="查看全部分类">›</a></h1>
  <div class="content" data-aside-categories
    th:with="categories = ${categoryFinder.listAsTree()}, flatCategories = ${categoryFinder.listAll().?[status.visiblePostCount > 0]}, categoryLimit = ${theme.config.aside.card_categories?.limit == null ? 5 : theme.config.aside.card_categories.limit}"
    th:attr="data-limit=${theme.config.aside.card_categories?.limit == null ? 5 : categoryLimit},data-expand=${theme.config.aside.card_categories?.expand ?: 'none'}">
    <div data-category-fallback>
      <a class="link" th:each="category, status : ${flatCategories}" th:if="${(categoryLimit == 0 or status.index < categoryLimit) and category.status.visiblePostCount > 0}" th:href="${category.status.permalink}">
        <span class="name" th:text="${category.spec.displayName}"></span><span class="num" th:text="${category.status.visiblePostCount}"></span>
      </a>
      <th:block th:if="${#lists.isEmpty(flatCategories)}" th:insert="~{views/components:: emptyData(false)}"></th:block>
    </div>
    <template data-category-tree><th:block th:replace="~{::categoryTree(${categories})}"/></template>
  </div>
</section>
<th:block xmlns:th="https://www.thymeleaf.org" th:fragment="categoryTree(nodes)">
  <div class="category-entry" th:each="node : ${nodes}" th:attr="data-name=${node.spec.displayName},data-count=${node.postCount}">
    <div class="category-row"><a class="link" th:href="${node.status.permalink}"><span class="name" th:text="${node.spec.displayName}"></span><span class="num" th:text="${node.postCount}"></span></a></div>
    <div class="category-children" th:if="${not #lists.isEmpty(node.children)}"><th:block th:replace="~{::categoryTree(${node.children})}"/></div>
  </div>
</th:block>

<!--/* 标签：完整候选在惰性 template 中，数量限制不影响全局排序。 */-->
<section xmlns:th="https://www.thymeleaf.org" th:fragment="tags" th:if="${theme.config.aside.enable_tags != false}" class="aside-tags card"
  th:attr="data-card-order=${theme.config.aside.card_tags?.sort_order ?: 40}">
  <h1 class="title"><i class="fa-solid fa-tags"></i><span class="name">标签</span><a class="card-more-btn" href="/tags" aria-label="查看全部标签">›</a></h1>
  <div class="content" data-aside-tags
    th:with="tags = ${tagFinder.listAll().?[status.visiblePostCount > 0]}, tagLimit = ${theme.config.aside.card_tags?.limit == null ? 25 : theme.config.aside.card_tags.limit}"
    th:attr="data-limit=${tagLimit},data-orderby=${theme.config.aside.card_tags?.orderby ?: 'random'},data-order=${theme.config.aside.card_tags?.order ?: 1}">
    <a class="link" th:each="tag, status : ${tags}" th:if="${tagLimit == 0 or status.index < tagLimit}" th:href="${tag.status.permalink}"><span class="name" th:text="${tag.spec.displayName}"></span><span class="num" th:text="${'（' + tag.status.visiblePostCount + '）'}"></span></a>
    <template data-tag-list><a class="link" th:each="tag : ${tags}" th:href="${tag.status.permalink}" th:attr="data-name=${tag.spec.displayName},data-count=${tag.status.visiblePostCount}"><span class="name" th:text="${tag.spec.displayName}"></span><span class="num" th:text="${'（' + tag.status.visiblePostCount + '）'}"></span></a></template>
    <th:block th:if="${#lists.isEmpty(tags)}" th:insert="~{views/components:: emptyData(false)}"></th:block>
  </div>
</section>

<!--/* archives() 按文章分页；取完整文章总量，不能将月份行数当作文章 size。 */-->
<section xmlns:th="https://www.thymeleaf.org" th:fragment="archives" th:if="${theme.config.aside.enable_archives != false}" class="aside-archives card card-archives"
  th:attr="data-card-order=${theme.config.aside.card_archives?.sort_order ?: 50}">
  <h1 class="title"><i class="fas fa-archive"></i><span class="name">归档</span><a class="card-more-btn" href="/archives" aria-label="查看全部归档">›</a></h1>
  <div class="content" th:with="archiveSize = ${stats.post == null or stats.post < 1 ? 1 : stats.post}, archiveYears = ${postFinder.archives(1, archiveSize)}, archiveRowLimit = ${theme.config.aside.card_archives?.limit == null ? 8 : theme.config.aside.card_archives.limit}, yearly = ${theme.config.aside.card_archives?.type == 'yearly'}">
    <style th:if="${archiveRowLimit > 0}" th:inline="css">.aside-archives .card-archive-list-item:nth-child(n + /*[[${archiveRowLimit + 1}]]*/ 9) { display: none; }</style>
    <ul class="card-archive-list" data-aside-archives th:attr="data-order=${theme.config.aside.card_archives?.order ?: -1},data-format=${theme.config.aside.card_archives?.format ?: (yearly ? 'YYYY年' : 'YYYY年MM月')},data-archive-row-limit=${archiveRowLimit}">
      <th:block th:each="year : ${archiveYears.items}">
        <li th:if="${yearly}" class="card-archive-list-item" th:attr="data-year=${year.year},data-month=1">
          <a class="card-archive-list-link" th:href="@{/archives/{year}(year=${year.year})}"><span class="card-archive-list-date" th:text="${year.year + '年'}"></span><span class="card-archive-list-count" th:text="${#aggregates.sum(year.months.![posts.size()])}"></span></a>
        </li>
        <li th:unless="${yearly}" class="card-archive-list-item" th:each="monthVo : ${year.months}" th:attr="data-year=${year.year},data-month=${monthVo.month}">
          <a class="card-archive-list-link" th:href="@{/archives/{year}/{month}(year=${year.year},month=${monthVo.month})}"><span class="card-archive-list-date" th:text="|${year.year}年${monthVo.month}月|"></span><span class="card-archive-list-count" th:text="${#lists.size(monthVo.posts)}"></span></a>
        </li>
      </th:block>
    </ul>
    <th:block th:if="${#lists.isEmpty(archiveYears.items)}" th:insert="~{views/components:: emptyData(false)}"></th:block>
  </div>
</section>

<!--/* 网站信息。对齐上游 card_webinfo：文章数目 + 最后更新时间；无 busuanzi 时不硬渲染总访问量；无文章点赞。 */-->
<section xmlns:th="https://www.thymeleaf.org" th:fragment="webInfo" th:if="${theme.config.aside.enable_webInfo != false}" th:attr="data-card-order=${theme.config.aside.card_webinfo?.sort_order ?: 60}" class="aside-webInfo card">
  <h1 class="title">
    <i class="fa-solid fa-chart-simple"></i>
    <span class="name">网站信息</span>
  </h1>

  <div
    class="content"
    th:with="
      latestUpdated = ${postFinder.list({page: 1, size: 1, sort: {'status.lastModifyTime,desc'}})},
      latestPublished = ${postFinder.list({page: 1, size: 1, sort: {'spec.publishTime,desc'}})},
      updatedPost = ${latestUpdated != null and not #lists.isEmpty(latestUpdated.items) ? latestUpdated.items[0] : null},
      publishedPost = ${latestPublished != null and not #lists.isEmpty(latestPublished.items) ? latestPublished.items[0] : null},
      updatedAt = ${updatedPost != null ? (updatedPost.status.lastModifyTime != null ? updatedPost.status.lastModifyTime : updatedPost.spec.publishTime) : null},
      publishedAt = ${publishedPost != null ? publishedPost.spec.publishTime : null},
      lastPush = ${updatedAt == null ? publishedAt : (publishedAt == null ? updatedAt : (updatedAt >= publishedAt ? updatedAt : publishedAt))}
    "
  >
    <div class="item" th:if="${theme.config.aside.card_webinfo?.post_count != false}">
      <span>文章数目：</span>
      <span th:text="${stats.post} + '章'"></span>
    </div>
    <div class="item" th:if="${theme.config.aside.card_webinfo?.runtime != false and not #strings.isEmpty(theme.config.base.site_birthday)}">
      <span>运行时间：</span>
      <span class="run-day" th:data-date="${theme.config.base.site_birthday}">... 天</span>
    </div>
    <div class="item" th:if="${theme.config.aside.card_webinfo?.last_push_date != false and lastPush != null}">
      <span>最后更新时间：</span>
      <time th:datetime="${lastPush}" data-relative-date="true" th:text="${#dates.format(lastPush, 'yyyy-MM-dd HH:mm')}"></time>
    </div>
  </div>
</section>

<!--/* 侧边栏 */-->
<aside xmlns:th="https://www.thymeleaf.org" th:fragment="common" th:if="${asideEnabled}" class="aside" data-aside-sort>
  <th:block th:replace="~{::user}"/>
  <th:block th:replace="~{::notice}"/>
  <th:block th:replace="~{::recentPost}"/>
  <th:block th:replace="~{::category}"/>
  <th:block th:replace="~{::tags}"/>
  <th:block th:replace="~{::archives}"/>
  <th:block th:replace="~{::webInfo}"/>
</aside>

<!--/* 阅读侧栏。SinglePage 的简洁目录是可选扩展，默认仍保留普通侧栏。 */-->
<th:block xmlns:th="https://www.thymeleaf.org" th:fragment="post">
  <th:block th:replace="~{::article(${post}, true)}"/>
</th:block>
<th:block xmlns:th="https://www.thymeleaf.org" th:fragment="single">
  <th:block th:replace="~{::article(${singlePage}, false)}"/>
</th:block>
<aside
  xmlns:th="https://www.thymeleaf.org"
  th:fragment="article(content, postPage)"
  th:if="${asideEnabled}"
  class="aside"
  th:with="
    tocCfg = ${theme.config.toc},
    tocOverride = ${#annotations.getOrDefault(content, 'toc', 'inherit')},
    tocNumberOverride = ${#annotations.getOrDefault(content, 'toc_number', 'inherit')},
    tocExpandOverride = ${#annotations.getOrDefault(content, 'toc_expand', 'inherit')},
    tocSimpleOverride = ${#annotations.getOrDefault(content, 'toc_style_simple', 'inherit')},
    tocDefault = ${postPage ? (tocCfg == null or (tocCfg.post != false and tocCfg.post != 'false')) : (tocCfg != null and (tocCfg.page == true or tocCfg.page == 'true'))},
    tocEnabled = ${tocOverride == 'true' ? true : (tocOverride == 'false' ? false : tocDefault)},
    tocNumber = ${tocNumberOverride == 'true' ? true : (tocNumberOverride == 'false' ? false : (tocCfg == null or (tocCfg.number != false and tocCfg.number != 'false')))},
    tocExpand = ${tocExpandOverride == 'true' ? true : (tocExpandOverride == 'false' ? false : (tocCfg != null and (tocCfg.expand == true or tocCfg.expand == 'true')))},
    tocSimpleDefault = ${postPage and tocCfg != null and (tocCfg.style_simple == true or tocCfg.style_simple == 'true')},
    tocSimple = ${tocEnabled and (tocSimpleOverride == 'true' ? true : (tocSimpleOverride == 'false' ? false : tocSimpleDefault))},
    tocPercent = ${tocCfg == null or (tocCfg.scroll_percent != false and tocCfg.scroll_percent != 'false')}
  "
>
  <th:block th:unless="${tocSimple}">
    <th:block th:replace="~{::user}"/>
    <th:block th:replace="~{::notice}"/>
  </th:block>
  <div class="is-sticky" th:if="${tocEnabled}">
    <section class="aside-toc card">
      <h1 class="title">
        <i class="fa-solid fa-list"></i>
        <span class="name">目录</span>
        <span class="toc-percentage" th:if="${tocPercent}"></span>
      </h1>
      <div class="toc" th:classappend="${(tocNumber ? 'is-numbered ' : '') + (tocExpand ? 'is-expand' : '')}"></div>
    </section>
  </div>
  <th:block th:unless="${tocSimple}">
    <th:block th:replace="~{::recentPost}"/>
    <th:block th:unless="${postPage}">
      <th:block th:replace="~{::category}"/>
      <th:block th:replace="~{::tags}"/>
      <th:block th:replace="~{::archives}"/>
      <th:block th:replace="~{::webInfo}"/>
    </th:block>
  </th:block>
</aside>
