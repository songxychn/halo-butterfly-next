<nav th:fragment="pagination(items, label)"
     th:if="${items.totalPages > 1 and items.page <= items.totalPages}"
     class="pagination plugin-pagination" th:aria-label="${label}">
  <a th:if="${items.hasPrevious()}" class="page prev" rel="prev"
     th:href="${items.prevUrl}" th:text="#{ui.previousPage}">上一页</a>
  <span class="page-info" aria-current="page"
        th:text="#{ui.pageNumber(${items.page},${items.totalPages})}"></span>
  <a th:if="${items.hasNext()}" class="page next" rel="next"
     th:href="${items.nextUrl}" th:text="#{ui.nextPage}">下一页</a>
</nav>
