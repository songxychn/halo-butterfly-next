<!--/* 基础配置 */-->
<script data-theme-script="config" id="baseScript" th:inline="javascript">
  window.MainApp = {
    conf: {
      pjax_enable: /*[[${theme.config.pjax?.enable == true}]]*/ false,
      pjax_exclude: /*[[${theme.config.pjax?.exclude ?: ''}]]*/ '',
      instantpage: /*[[${theme.config.loading?.instantpage == true}]]*/ false,
      snackbar_enable: /*[[${theme.config.snackbar?.enable == true}]]*/ false,
      snackbar_position: /*[[${theme.config.snackbar?.position ?: 'bottom-left'}]]*/ 'bottom-left',
      snackbar_bg_light: /*[[${theme.config.snackbar?.bg_light ?: '#1f2937'}]]*/ '#1f2937',
      snackbar_bg_dark: /*[[${theme.config.snackbar?.bg_dark ?: '#374151'}]]*/ '#374151',
      lazyload_enable: /*[[${theme.config.lazyload?.enable != false and theme.config.lazyload?.enable != 'false'}]]*/ true,
      lazyload_native: /*[[${theme.config.lazyload?.native != false and theme.config.lazyload?.native != 'false'}]]*/ true,
      lazyload_field: /*[[${theme.config.lazyload?.field ?: 'site'}]]*/ 'site',
      lazyload_blur: /*[[${theme.config.lazyload?.blur == true}]]*/ false,
      above_background_fallback: /*[[${theme.config.image?.default_top_img ?: ''}]]*/ '',
      restore_aside: /*[[${theme.config.aside.enable != false and theme.config.aside.enable != 'false' and theme.config.aside.hide_button != false and theme.config.aside.hide_button != 'false'}]]*/ true,
      style_mode: /*[[${theme.config.style.mode}]]*/ null,
      darkmode_autoChangeMode: /*[[${theme.config.darkmode?.autoChangeMode}]]*/ false,
      darkmode_start: /*[[${theme.config.darkmode?.start}]]*/ '',
      darkmode_end: /*[[${theme.config.darkmode?.end}]]*/ '',
      enable_aside: /*[[${theme.config.aside.enable}]]*/ true,
      enable_webInfo: /*[[${theme.config.aside.enable_webInfo}]]*/ true,
      assets_link: /*[[${assets_link}]]*/ true,
      nav_fixed: /*[[${theme.config.nav.fixed == true}]]*/ false,
      nav_display_post_title: /*[[${theme.config.nav.display_post_title != false}]]*/ true,
      appearance: /*[[${theme.config.appearance}]]*/ {},
      aside_tag_colors: /*[[${theme.config.aside.card_tags?.custom_colors}]]*/ [],
      effects: /*[[${theme.config.effects}]]*/ {},
      rightside_scroll_percent: /*[[${theme.config.rightside?.scroll_percent}]]*/ false,
    },
    attrs: {},
    modules: {},
  };
  /* @theme-bootstrap */
</script>

<!--/* style */-->
<style th:inline="css">
  :root {
    --card-border-radius: /*[(${theme.config.card.radius})]*/ 24px;
    --card-box-shadow: /*[(${theme.config.card.shadow})]*/ transparent;
    --rightside-bottom: /*[(${#strings.isEmpty(theme.config.rightside?.bottom) ? '40px' : theme.config.rightside.bottom})]*/ 40px;
    --link-hover-color: var(--theme);
    --cursor-default: auto;
    --cursor-pointer: pointer;
  }

  html {
    --theme: #49b1f5;
    --body-background: /*[(${theme.config.style.body_background})]*/ transparent;
    --nav-font-color: /*[(${theme.config.nav.font_color.light})]*/ transparent;
    --nav-active-font-color: /*[(${theme.config.nav.active_font_color.light})]*/ transparent;
    --nav-active-hover-font-color: /*[(${theme.config.nav.active_hover_font_color.light})]*/ transparent;
    --nav-active-background-color: /*[(${theme.config.nav.active_background_color.light})]*/ transparent;
    --nav-active-shadow: /*[(${theme.config.nav.active_shadow.light})]*/ transparent;
    --nav-dropdown-background-color: /*[(${theme.config.nav.dropdown_background_color.light})]*/ transparent;
    --nav-dropdown-font-color: /*[(${theme.config.nav.dropdown_font_color.light})]*/ transparent;
    --nav-dropdown-hover-font-color: /*[(${theme.config.nav.dropdown_hover_font_color.light})]*/ transparent;
  }

  html[data-color-scheme=dark] {
    --theme: #49b1f5;
    --body-background: rgb(15, 23, 42);
    --nav-font-color: /*[(${theme.config.nav.font_color.dark})]*/ transparent;
    --nav-active-font-color: /*[(${theme.config.nav.active_font_color.dark})]*/ transparent;
    --nav-active-hover-font-color: /*[(${theme.config.nav.active_hover_font_color.dark})]*/ transparent;
    --nav-active-background-color: /*[(${theme.config.nav.active_background_color.dark})]*/ transparent;
    --nav-active-shadow: /*[(${theme.config.nav.active_shadow.dark})]*/ transparent;
    --nav-dropdown-background-color: /*[(${theme.config.nav.dropdown_background_color.dark})]*/ transparent;
    --nav-dropdown-font-color: /*[(${theme.config.nav.dropdown_font_color.dark})]*/ transparent;
    --nav-dropdown-hover-font-color: /*[(${theme.config.nav.dropdown_hover_font_color.dark})]*/ transparent;
  }

  .loading #Butterfly {
    display: none;
  }

  /* The default cursor rules are small enough to avoid a blocking request. */
  body { cursor: var(--cursor-default); }
  body a, body button { cursor: var(--cursor-pointer); }
</style>
<link rel="preload stylesheet" as="style" th:href="${assets_link + 'plugins/fontawesome/css/all.min.css'}">
