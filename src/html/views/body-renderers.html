<th:block xmlns:th="https://www.thymeleaf.org" th:fragment="config(subject)">
  <script data-theme-script="body-renderer-config" th:inline="none"
    th:with="
      mermaidOverride = ${#annotations.getOrDefault(subject, 'mermaid', 'inherit')},
      chartOverride = ${#annotations.getOrDefault(subject, 'chartjs', 'inherit')},
      abcOverride = ${#annotations.getOrDefault(subject, 'abcjs', 'inherit')},
      bodyRenderers = ${ {
        'mermaid': {
          'enable': (mermaidOverride == 'true' ? true : (mermaidOverride == 'false' ? false : theme.config.code?.mermaid?.enable == true)),
          'code_write': (theme.config.code?.mermaid?.code_write == true),
          'theme': {'light': (theme.config.code?.mermaid?.theme?.light ?: 'default'), 'dark': (theme.config.code?.mermaid?.theme?.dark ?: 'dark')},
          'open_in_new_tab': (theme.config.code?.mermaid?.open_in_new_tab != false and theme.config.code?.mermaid?.open_in_new_tab != 'false'),
          'zoom_pan': (theme.config.code?.mermaid?.zoom_pan != false and theme.config.code?.mermaid?.zoom_pan != 'false')
        },
        'chartjs': {
          'enable': (chartOverride == 'true' ? true : (chartOverride == 'false' ? false : theme.config.code?.chartjs?.enable == true)),
          'fontColor': theme.config.code?.chartjs?.fontColor,
          'borderColor': theme.config.code?.chartjs?.borderColor,
          'scale_ticks_backdropColor': theme.config.code?.chartjs?.scale_ticks_backdropColor
        },
        'abcjs': {
          'enable': (abcOverride == 'true' ? true : (abcOverride == 'false' ? false : (theme.config.code?.abcjs?.enable == true and theme.config.code?.abcjs?.per_page != false and theme.config.code?.abcjs?.per_page != 'false')))
        }
      } },
      bodyRenderersJson = ${T(run.halo.app.infra.utils.JsonUtils).objectToJson(bodyRenderers)}
    "
    th:attr="data-body-renderers=${bodyRenderersJson}"
  >window.MainApp.merge(document.currentScript);</script>
</th:block>
