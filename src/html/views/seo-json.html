<!--/* JSON-LD structured data serialized with Halo JsonUtils and protected against script close tags. */-->
<th:block xmlns:th="https://www.thymeleaf.org" th:fragment="structured"
  th:if="${page == 'post' or (page == 'index' and posts.page == 1 and seoBase == seoOrigin)}"
  th:with="
    authorRaw = ${theme.config.post.post_copyright?.author_href ?: (seoBase + '/')},
    authorUrl = ${#strings.startsWith(authorRaw, 'http://') or #strings.startsWith(authorRaw, 'https://') ? authorRaw : (#strings.startsWith(authorRaw, '//') ? #strings.substringBefore(seoBase, ':') + ':' + authorRaw : (#strings.startsWith(authorRaw, '/') ? seoOrigin + authorRaw : seoBase + '/' + authorRaw))},
    postLd = ${page == 'post' ? {'@context': 'https://schema.org', '@type': 'BlogPosting', 'headline': seoTitle, 'url': seoUrl, 'image': imageUrl, 'datePublished': #strings.toString(post.spec.publishTime ?: ''), 'dateModified': #strings.toString((post.status.lastModifyTime ?: post.spec.publishTime) ?: ''), 'author': {{'@type': 'Person', 'name': (seoAuthor?.displayName ?: site.title), 'url': authorUrl}}} : null},
    aliases = ${(theme.config.seo?.alternate_name ?: {}).?[#this != null and not #strings.isEmpty(#strings.trim(name))].![#strings.trim(name)]},
    altNames = ${new java.util.ArrayList(aliases)},
    addSub = ${page == 'index' and not #strings.isEmpty(site.subtitle) ? altNames.add(site.subtitle) : false},
    addHost = ${page == 'index' ? altNames.add(seoHost) : false},
    siteLd = ${page == 'index' ? {'@context': 'https://schema.org', '@type': 'WebSite', 'name': site.title, 'url': seoBase + '/', 'alternateName': altNames} : null},
    rawJson = ${T(run.halo.app.infra.utils.JsonUtils).objectToJson(page == 'post' ? postLd : siteLd)},
    safeJson = ${#strings.replace(rawJson, '</', '<\/')}
  ">
  <script type="application/ld+json" th:utext="${safeJson}"></script>
</th:block>
