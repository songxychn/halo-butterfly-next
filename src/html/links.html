<layout
  th:replace="~{views/layout :: layout (
  page = 'links',
  title = ${site.title} + ' - ' + #{ui.linksTitle},
  pin = ~{::pin},
  header = ~{::header},
  main = ~{::main}
  )}"
>
  <!--/* css */-->
  <th:block th:fragment="pin">
    <script data-theme-script="page-config" id="pageScript" th:inline="javascript">
      Object.assign(window.MainApp.conf, {
        //第一屏
        enable_above: /*[[${aboveEnabled}]]*/ '',
        above_background: /*[[${aboveBackground}]]*/ '',
      });
    </script>
  </th:block>



  <!--/* header */-->
  <th:block th:fragment="header">
    <header th:class="${not aboveEnabled ? 'header dp' : 'header'}">
      <!--/* 导航栏 */-->
      <th:block th:replace="~{views/nav}"/>

      <!--第一屏内容-->
      <section class="above" th:if="${aboveEnabled}">
        <div class="above-info">
          <h1 class="above-title" th:text="#{ui.links}">链接管理</h1>
        </div>
      </section>
    </header>
  </th:block>


  <!--/* 內容 */-->
  <th:block th:fragment="main">
    <section class="content card" th:attr="data-link-random=${theme.config.links?.random_order}" th:with="noData = ${not #lists.isEmpty(groups)}">
      <h1 class="page-title" th:if="${not aboveEnabled}" th:text="${#messages.msg('ui.links')}"></h1>
      <section class="remote-links groups" data-remote-links data-i18n-loading="正在加载友链…" data-i18n-empty="暂无远端友链" data-i18n-error="远端友链暂时无法加载，本地友链不受影响。" th:if="${not #strings.isEmpty(theme.config.links?.source)}" th:attr="data-source=${theme.config.links.source},data-i18n-loading=#{ui.linksLoading},data-i18n-empty=#{ui.linksEmpty},data-i18n-error=#{ui.linksError}">
        <p data-links-status role="status" aria-live="polite" th:text="#{ui.linksLoading}">正在加载友链…</p>
        <button type="button" data-links-retry hidden th:text="#{ui.linksRetry}">重试加载友链</button>
        <div data-links-items></div>
        <noscript><p th:text="#{ui.linksJs}">启用 JavaScript 后可查看远端友链，本地友链仍可使用。</p></noscript>
      </section>
      <th:block th:if="${noData}">
        <div class="groups">
          <div class="item" th:each="group : ${groups}">
            <h2 class="name" th:text="${group.spec.displayName}"></h2>
            <th:block th:each="description : ${theme.config.links?.group_descriptions}"><p class="group-description" th:if="${description.group == group.metadata.name}" th:text="${description.description}"></p></th:block>

            <div class="list" data-link-list>
              <a class="link " th:each="link : ${group.links}" th:href="${link.spec.url != null and link.spec.url.matches('(?i)^https?://.*|^/(?!/).*') ? link.spec.url : null}" data-site-link target="_blank" rel="noopener noreferrer">
                <img th:replace="~{views/components:: lazyLoadImg(${link.spec.logo},${link.spec.displayName},'logo',false,'')}"/>
                <div class="info">
                  <p class="n" th:text="${link.spec.displayName}"></p>
                  <p class="d" th:text="${link.spec.description}"></p>
                </div>
              </a>
            </div>

          </div>
        </div>

      </th:block>

      <th:block th:unless="${noData}" th:insert="~{views/components:: emptyData(false)}"></th:block>
    </section>
    <th:block th:replace="~{views/aside::common}"/>
  </th:block>
</layout>
