<layout
  th:replace="~{views/layout :: layout (
  page = 'categories',
  title = ${site.title} + ' - ' + #{ui.categories},
  pin = ~{::pin},
  header = ~{::header},
  main = ~{::main}
  )}"
>
  <!--/* pin */-->
  <th:block th:fragment="pin">
<script data-theme-script="page-config" id="pageScript" th:inline="javascript">
      window.MainApp.data =  /*[[${categories}]]*/ [];

      Object.assign(window.MainApp.conf, {
        //第一屏
        enable_above: /*[[${aboveEnabled}]]*/ '',
        above_background: /*[[${aboveBackground}]]*/ '',
      });
    </script>
  </th:block>

  <!--/* header */-->
  <th:block th:fragment="header">
    <header th:class="${not aboveEnabled ? 'header dp' : 'header'}">
      <!--/* 导航栏 */-->
      <th:block th:replace="~{views/nav}"/>

      <!--第一屏内容-->
      <section class="above" th:if="${aboveEnabled}">
        <div class="above-info">
          <h1 class="above-title" th:text="#{ui.categories}">分类</h1>
        </div>
      </section>
    </header>
  </th:block>


  <!--/* 內容 */-->
  <th:block th:fragment="main">
    <section class="content card" th:with="noData = ${not #lists.isEmpty(categories)}">
      <h1 class="page-title" th:if="${not aboveEnabled}" th:text="${#messages.msg('ui.categories')}"></h1>
      <th:block th:if="${noData}">
        <div class="chart" th:if="${theme.config.appearance?.category_ui == 'chart'}"></div>
        <th:block th:if="${theme.config.appearance?.category_ui != 'chart'}"><th:block th:replace="~{::categoryList(${categoryFinder.listAsTree()})}"/></th:block>
        <div class="chart-fallback" th:if="${theme.config.appearance?.category_ui == 'chart'}"><th:block th:replace="~{::categoryList(${categoryFinder.listAsTree()})}"/></div>
      </th:block>

      <th:block th:unless="${noData}" th:insert="~{views/components:: emptyData(false)}"></th:block>
    </section>
    <th:block th:replace="~{views/aside::common}"/>
  </th:block>
</layout>
<th:block xmlns:th="https://www.thymeleaf.org" th:fragment="categoryList(nodes)">
  <ul class="category-list"><li th:each="node : ${nodes}" th:if="${node.postCount > 0}">
    <a th:href="${node.status.permalink}"><span th:text="${node.spec.displayName}"></span><span th:text="${node.postCount}"></span></a>
    <th:block th:if="${not #lists.isEmpty(node.children)}" th:replace="~{::categoryList(${node.children})}"/>
  </li></ul>
</th:block>
