<th:block xmlns:th="https://www.thymeleaf.org"
          th:with="selectedLayout = ${#strings.toString(theme.config.index.index_layout)}, homeLayout = ${#lists.contains({'1','2','3','4','5','6','7'}, selectedLayout) ? selectedLayout : '3'}">
<layout
  th:replace="~{views/layout :: layout (
  page = 'index',
  title = ${site.title +  (#strings.isEmpty(site.subtitle) ? '' : ' - ' + site.subtitle )},
  pin = ~{::pin},
  header = ~{::header},
  main = ~{::main}
  )}"
>


  <!--/* pin */-->
  <th:block th:fragment="pin">
    <script defer data-theme-script="masonry" id="masonryScript" th:if="${homeLayout == '6' or homeLayout == '7'}"
            th:src="${assets_link + 'js/masonry.min.js?v=' + theme.spec.version}"></script>
    <link rel="preload" as="image" fetchpriority="high"
          th:if="${aboveEnabled and not #strings.isEmpty(aboveBackground) and (#strings.startsWith(aboveBackground, '/') or #strings.startsWith(aboveBackground, 'https://') or #strings.startsWith(aboveBackground, 'http://'))}"
          th:href="${aboveBackground}">
    <script data-theme-script="page-config" id="pageScript" th:inline="javascript">
      Object.assign(window.MainApp.conf, {
        //第一屏
        enable_above: /*[[${aboveEnabled}]]*/ '',
        above_background: /*[[${aboveBackground}]]*/ '',
        // 字幕使用统一默认和明确来源
        enable_subtitle: /*[[${theme.config.index.enable_subtitle != false}]]*/ true,
        subtitle_effect: /*[[${theme.config.index.subtitle_effect != false}]]*/ true,
        subtitle_source: /*[[${theme.config.index.subtitle_source ?: 'local'}]]*/ 'local',
        subtitle_typed_option: /*[[${theme.config.index.subtitle_typed_option}]]*/ null,
        site_subtitle: /*[[${site.subtitle ?: ''}]]*/ '',
        typewriter_custom_text: /*[[${theme.config.index.typewriter_custom_text}]]*/ '',
        typewriter_random_api: /*[[${theme.config.index.typewriter_random_api}]]*/ '',
        typewriter_api_value_format: /*[[${theme.config.index.typewriter_api_value_format}]]*/ '',
        // 分页
        nextUrl: /*[[${posts.nextUrl}]]*/ {},
        prevUrl: /*[[${posts.prevUrl}]]*/ {},
        page: /*[[${posts.page}]]*/ {},
        size: /*[[${posts.size}]]*/ {},
        total: /*[[${posts.total}]]*/ {},
        totalPages: /*[[${posts.totalPages}]]*/ {},
        hasPrevious: /*[[${posts.hasPrevious()}]]*/ {},
        hasNext: /*[[${posts.hasNext()}]]*/ {},
      });
    </script>
  </th:block>


  <!--/* header */-->
  <th:block th:fragment="header">
    <header th:class="${not aboveEnabled ? 'header dp' : 'header'}">
      <!--/* 导航栏 */-->
      <th:block th:replace="~{views/nav}"/>

      <!--/* 第一屏内容 */-->
      <section class="above" th:if="${aboveEnabled}"
               th:style="|height: ${#strings.isEmpty(theme.config.index.top_img_height) ? '100vh' : theme.config.index.top_img_height}; --index-site-info-top: ${#strings.isEmpty(theme.config.index.site_info_top) ? '43%' : theme.config.index.site_info_top};|">
        <div class="above-info">
          <h1 class="above-title" th:text="${site.title}"></h1>
          <div class="above-subtitle" th:if="${theme.config.index.enable_subtitle != false and (not #strings.isEmpty(site.subtitle) or not #strings.isEmpty(theme.config.index.typewriter_custom_text) or #lists.contains({'custom','hitokoto','yiyan','jinrishici'}, theme.config.index.subtitle_source))}">
            <span class="above-subtitle--text"></span>
          </div>
        </div>
        <!--/* 对齐 Butterfly 5.7.0 layout/includes/header/index.pug：is_home() 时 #scroll-down + .scroll-down-effects */-->
        <div id="scroll-down">
          <i class="fas fa-angle-down scroll-down-effects"></i>
        </div>
      </section>
    </header>
  </th:block>


  <!--/* 內容 */-->
  <th:block th:fragment="main">
    <section class="content">
      <h1 class="page-title" th:if="${not aboveEnabled}" th:text="${site.title}"></h1>
      <th:block th:replace="~{views/components:: list(${posts.items},${homeLayout})}"/>
    </section>
    <th:block th:replace="~{views/aside::common}"/>
  </th:block>
</layout>
</th:block>
