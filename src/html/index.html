<th:block xmlns:th="https://www.thymeleaf.org"
          th:with="selectedLayout = ${#strings.toString(theme.config.home.index_layout)}, homeLayout = ${#lists.contains({'1','2','3','4','5','6','7'}, selectedLayout) ? selectedLayout : '3'}">
<layout
  th:replace="~{views/layout :: layout (
  page = 'index',
  title = ${site.title +  (#strings.isEmpty(site.subtitle) ? '' : ' - ' + site.subtitle )},
  pin = ~{::pin},
  header = ~{::header},
  main = ~{::main}
  )}"
>


  <!--/* pin */-->
  <th:block th:fragment="pin">
    <script defer data-theme-script="masonry" id="masonryScript" th:if="${homeLayout == '6' or homeLayout == '7'}"
            th:src="${assets_link + 'js/masonry.min.js?v=' + theme.spec.version}"></script>
    <link rel="preload" as="image" fetchpriority="high"
          th:if="${aboveEnabled and not #strings.isEmpty(aboveBackground) and (#strings.startsWith(aboveBackground, '/') or #strings.startsWith(aboveBackground, 'https://') or #strings.startsWith(aboveBackground, 'http://'))}"
          th:href="${aboveBackground}">
    <script data-theme-script="page-config" id="pageScript" th:inline="none"
      th:with="pageConf = ${ {
        'enable_subtitle': (theme.config.home.enable_subtitle != false),
        'subtitle_effect': (theme.config.home.subtitle_effect != false),
        'subtitle_typed_option': theme.config.home.subtitle_typed_option,
        'site_subtitle': (site.subtitle ?: ''),
        'typewriter_custom_text': theme.config.home.typewriter_custom_text,
        'nextUrl': posts.nextUrl,
        'prevUrl': posts.prevUrl,
        'page': posts.page,
        'size': posts.size,
        'total': posts.total,
        'totalPages': posts.totalPages,
        'hasPrevious': posts.hasPrevious(),
        'hasNext': posts.hasNext()
      } }"
      th:attr="data-conf=${T(run.halo.app.infra.utils.JsonUtils).objectToJson(pageConf)}"
    >window.MainApp.merge(document.currentScript);</script>
  </th:block>


  <!--/* header */-->
  <th:block th:fragment="header">
    <header th:class="${not aboveEnabled ? 'header dp' : 'header'}">
      <!--/* 导航栏 */-->
      <th:block th:replace="~{views/nav}"/>

      <!--/* 第一屏内容 */-->
      <section class="above" th:if="${aboveEnabled}"
               th:style="|height: ${#strings.isEmpty(theme.config.home.top_img_height) ? '100vh' : theme.config.home.top_img_height}; --index-site-info-top: ${#strings.isEmpty(theme.config.home.site_info_top) ? '43%' : theme.config.home.site_info_top};|">
        <div class="above-info">
          <h1 class="above-title" th:text="${site.title}"></h1>
          <div class="above-subtitle" th:if="${theme.config.home.enable_subtitle != false and (not #strings.isEmpty(site.subtitle) or not #strings.isEmpty(theme.config.home.typewriter_custom_text))}">
            <span class="above-subtitle--text"></span>
          </div>
          <th:block th:if="${theme.config.aside?.social_position == 'header' or theme.config.aside?.social_position == 'both'}"><th:block th:replace="~{views/social :: icons}"/></th:block>
        </div>
        <!--/* 对齐 Butterfly 5.7.0 layout/includes/header/index.pug：is_home() 时 #scroll-down + .scroll-down-effects */-->
        <div id="scroll-down">
          <i class="fas fa-angle-down scroll-down-effects"></i>
        </div>
      </section>
    </header>
  </th:block>


  <!--/* 內容 */-->
  <th:block th:fragment="main">
    <section class="content">
      <h1 class="page-title" th:if="${not aboveEnabled}" th:text="${site.title}"></h1>
      <th:block th:if="${not aboveEnabled and (theme.config.aside?.social_position == 'header' or theme.config.aside?.social_position == 'both')}"><th:block th:replace="~{views/social :: icons}"/></th:block>
      <th:block th:replace="~{views/components:: list(${posts.items},${homeLayout})}"/>
    </section>
    <th:block th:replace="~{views/aside::common}"/>
  </th:block>
</layout>
</th:block>
