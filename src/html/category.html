<layout
  th:replace="~{views/layout :: layout (
  page = 'category',
  title = ${site.title} + ' - ' + #{ui.categoryTitle},
  pin = ~{::pin},
  header = ~{::header},
  main = ~{::main}
  )}"
>
  <!--/* pin */-->
  <th:block th:fragment="pin">
    <script data-theme-script="page-config" id="pageScript" th:inline="none"
      th:with="pageConf = ${ {
        'nextUrl': posts.nextUrl,
        'prevUrl': posts.prevUrl,
        'page': posts.page,
        'size': posts.size,
        'total': posts.total,
        'totalPages': posts.totalPages,
        'hasPrevious': posts.hasPrevious(),
        'hasNext': posts.hasNext()
      } }, pageConfJson = ${T(run.halo.app.infra.utils.JsonUtils).objectToJson(pageConf)}"
      th:attr="data-conf=${pageConfJson}"
    >window.MainApp.merge(document.currentScript);</script>
  </th:block>


  <!--/* header */-->
  <th:block th:fragment="header">
    <header th:class="${not aboveEnabled ? 'header dp' : 'header'}">
      <!--/* 导航栏 */-->
      <th:block th:replace="~{views/nav}"/>

      <!--第一屏内容-->
      <section class="above" th:if="${aboveEnabled}">
        <div class="above-info">
          <h1 class="above-title" th:text="${category.spec.displayName}"></h1>
        </div>
      </section>
    </header>
  </th:block>


  <!--/* 內容 */-->
  <th:block th:fragment="main">
    <section class="content">
      <h1 class="page-title" th:if="${not aboveEnabled}" th:text="${category.spec.displayName}"></h1>
      <th:block th:replace="~{views/components:: list(${posts.items},'list')}"/>
    </section>
    <th:block th:replace="~{views/aside::common}"/>
  </th:block>
</layout>
