<layout
  xmlns:th="https://www.thymeleaf.org"
  th:replace="~{views/layout :: layout (
  page = 'post',
  title = ${post.spec.title + ' - ' + site.title},
  pin = ~{::pin},
  header = ~{::header},
  main = ~{::main}
  )}"
>
  <!--/* pin */-->
  <th:block th:fragment="pin">
    <link rel="preload" as="image" fetchpriority="high"
          th:if="${aboveEnabled and not #strings.isEmpty(aboveBackground) and (#strings.startsWith(aboveBackground, '/') or #strings.startsWith(aboveBackground, 'https://') or #strings.startsWith(aboveBackground, 'http://'))}"
          th:href="${aboveBackground}">
    <script data-theme-script="page-config" id="pageScript" th:inline="javascript" th:with="tocNumberOverride = ${#annotations.getOrDefault(post, 'toc_number', 'inherit')}, tocExpandOverride = ${#annotations.getOrDefault(post, 'toc_expand', 'inherit')}, mathOverride = ${#annotations.getOrDefault(post, 'katex', 'inherit')}">
      Object.assign(window.MainApp.conf, {
        // 第一屏
        enable_above: /*[[${aboveEnabled}]]*/ '',
        above_background: /*[[${aboveBackground}]]*/ '',
        // 渲染
        enable_h_icon: /*[[${theme.config.render.enable_h_icon}]]*/ true,
        // 目录：单篇显式 true / false 优先，否则继承全局
        toc_number: /*[[${tocNumberOverride == 'true' ? true : (tocNumberOverride == 'false' ? false : theme.config.toc.number)}]]*/ true,
        toc_expand: /*[[${tocExpandOverride == 'true' ? true : (tocExpandOverride == 'false' ? false : theme.config.toc.expand)}]]*/ false,
        toc_scroll_percent: /*[[${theme.config.toc.scroll_percent}]]*/ true,
        math_enabled: /*[[${mathOverride == 'true' ? true : (mathOverride == 'false' ? false : (theme.config.math?.enable != false and theme.config.math?.enable != 'false'))}]]*/ true,
        math_copy_tex: /*[[${theme.config.math?.copy_tex != false and theme.config.math?.copy_tex != 'false'}]]*/ true,
        math_hide_scrollbar: /*[[${theme.config.math?.hide_scrollbar == true or theme.config.math?.hide_scrollbar == 'true'}]]*/ false,
        anchor_auto_update: /*[[${theme.config.anchor?.auto_update}]]*/ false,
        anchor_click_to_scroll: /*[[${theme.config.anchor?.click_to_scroll}]]*/ false,
        photofigcaption: /*[[${theme.config.post?.photofigcaption == true or theme.config.post?.photofigcaption == 'true'}]]*/ false,
        related_post_limit: /*[[${theme.config.post.related_post.limit}]]*/ 6,
        post_copyright_decode: /*[[${theme.config.post.post_copyright.decode}]]*/ false,
      });
      // 文章页面 自定义元数据
      Object.assign(window.MainApp.attrs, {
        enable_code_copy: /*[[${#annotations.getOrDefault(post, 'enable_code_copy','true')}]]*/ true,
      });
    </script>
    <th:block th:replace="~{views/body-renderers :: config(${post})}"/>
    <th:block th:replace="~{views/components :: codeBlockPin}"/>
  </th:block>

  <th:block th:fragment="header">
    <header th:class="${not aboveEnabled ? 'header dp' : 'header'}">
      <!--/* 导航栏 */-->
      <th:block th:replace="~{views/nav}"/>

      <!--第一屏：标题 + 元信息；关闭第一屏时元信息改到文章卡片顶部，避免两处重复 -->
      <section class="above" th:if="${aboveEnabled}">
        <div class="above-info" th:classappend="${theme.config.post.post_meta?.position == 'center' ? ' center' : ' left'}">
          <h1 class="post-title" th:text="${post.spec.title}"></h1>
          <th:block th:replace="~{views/components :: postMeta}"/>
        </div>
      </section>
    </header>
  </th:block>

  <!--/* 內容 */-->
  <th:block th:fragment="main">
    <section class="content card">
      <div
        id="post-info"
        class="post-info"
        th:if="${not aboveEnabled}"
        th:classappend="${theme.config.post.post_meta?.position == 'center' ? ' center' : ' left'}"
      >
        <h1 class="post-title" th:text="${post.spec.title}"></h1>
        <th:block th:replace="~{views/components :: postMeta}"/>
      </div>
      <article th:lang="${contentLanguage}" class="render"
        th:attr="data-copy-enabled=${theme.config.copy?.enable != false and theme.config.copy?.enable != 'false'},data-copy-copyright=${theme.config.copy?.copyright?.enable == true or theme.config.copy?.copyright?.enable == 'true'},data-copy-limit=${theme.config.copy?.copyright?.limit_count != null ? theme.config.copy.copyright.limit_count : 150},data-copy-author=${post.owner?.displayName ?: site.title},data-copy-url=${canonical ?: post.status.permalink},data-copy-site=${site.title},data-copy-license=${theme.config.post.post_copyright?.license ?: 'CC BY-NC-SA 4.0'}">
        <th:block th:replace="~{views/components :: noticeOutdate('top')}"/>
        <th:block th:utext="${post.content.content}"/>
        <th:block th:replace="~{views/components :: noticeOutdate('bottom')}"/>
      </article>

      <th:block th:replace="~{views/components :: postCopyright}"/>
      <th:block th:replace="~{views/share :: postShare}"/>

      <th:block th:replace="~{views/components :: postReward}"/>
      <section class="theme-ad ad-post" aria-label="广告" th:aria-label="#{ui.ad}" th:if="${not #strings.isEmpty(theme.config.ad?.post)}" ><th:block th:replace="~{views/integration-ads::content(${theme.config.ad.post})}"/></section>
      <th:block th:replace="~{views/components :: postPagination}"/>
      <th:block th:replace="~{views/components :: relatedPosts}"/>

      <div
        id="post-comment"
        role="region" aria-labelledby="comment-title"
        th:if="${pluginFinder.available('PluginCommentWidget') && haloCommentEnabled && post.spec.allowComment}"
      >
        <div class="comment-head">
          <h2 class="comment-headline" id="comment-title" tabindex="-1">
            <i class="fa-solid fa-comments fa-fw" aria-hidden="true"></i>
            <span th:text="#{ui.comments}"></span>
          </h2>
        </div>
        <p class="comment-notice" th:if="${theme.config.comments?.text != false and not #strings.isEmpty(theme.config.comments?.notice)}" th:text="${theme.config.comments.notice}"></p>
        <div class="comment-wrap">
          <th:block th:replace="~{views/comment-lazy :: widget('Post', ${post.metadata.name})}"/>
        </div>
      </div>
      <p class="comment-notice comment-unavailable"
        th:if="${theme.config.comments?.text != false and ((site.comment.enable != true or post.spec.allowComment != true) ? not #strings.isEmpty(theme.config.comments?.closed_notice) : ((not pluginFinder.available('PluginCommentWidget') or not haloCommentEnabled) and not #strings.isEmpty(theme.config.comments?.unavailable_notice)))}"
        th:text="${(site.comment.enable != true or post.spec.allowComment != true) ? theme.config.comments.closed_notice : theme.config.comments.unavailable_notice}"></p>
    </section>
    <th:block th:replace="~{views/aside::post}"/>
  </th:block>
</layout>
