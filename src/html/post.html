<layout
  xmlns:th="https://www.thymeleaf.org"
  th:replace="~{views/layout :: layout (
  page = 'post',
  title = ${post.spec.title + ' - ' + site.title},
  pin = ~{::pin},
  header = ~{::header},
  main = ~{::main}
  )}"
>
  <!--/* pin */-->
  <th:block th:fragment="pin">
    <style
      id="pageStyle"
      xmlns:th="https://www.thymeleaf.org"
      th:inline="css"
    >

    </style>
    <script id="pageScript" th:inline="javascript" th:with="above_background = ${not #strings.isEmpty(post.spec.cover) ? post.spec.cover : (theme.config.loading.img.random_enable ? theme.config.loading.img.random_link  : ''  )}">
      Object.assign(window.MainApp.conf, {
        // 第一屏
        enable_above: /*[[${theme.config.post.enable_above}]]*/ '',
        above_background: /*[[${above_background}]]*/ '',
        // 渲染
        enable_h_icon: /*[[${theme.config.render.enable_h_icon}]]*/ true,
        // 目录：对齐 toc.number / expand / scroll_percent
        toc_number: /*[[${theme.config.toc.number}]]*/ true,
        toc_expand: /*[[${theme.config.toc.expand}]]*/ false,
        toc_scroll_percent: /*[[${theme.config.toc.scroll_percent}]]*/ true,
      });
      // 文章页面 自定义元数据
      Object.assign(window.MainApp.attrs, {
        enable_code_copy: /*[[${#annotations.getOrDefault(post, 'enable_code_copy','true')}]]*/ true,
      });
    </script>
    <th:block th:replace="~{views/components :: codeBlockPin}"/>
  </th:block>

  <th:block th:fragment="header">
    <header th:class="${not theme.config.post.enable_above ? 'header dp' : 'header'}">
      <!--/* 导航栏 */-->
      <th:block th:replace="~{views/nav}"/>

      <!--第一屏：标题 + 元信息；关闭第一屏时元信息改到文章卡片顶部，避免两处重复 -->
      <section class="above" th:if="${theme.config.post.enable_above}">
        <div class="above-info" th:classappend="${theme.config.post.post_meta?.position == 'center' ? ' center' : ' left'}">
          <h1 class="post-title" th:text="${post.spec.title}"></h1>
          <th:block th:replace="~{views/components :: postMeta}"/>
        </div>
      </section>
    </header>
  </th:block>

  <!--/* 內容 */-->
  <th:block th:fragment="main">
    <section class="content card">
      <div
        id="post-info"
        class="post-info"
        th:if="${not theme.config.post.enable_above}"
        th:classappend="${theme.config.post.post_meta?.position == 'center' ? ' center' : ' left'}"
      >
        <h1 class="post-title" th:text="${post.spec.title}"></h1>
        <th:block th:replace="~{views/components :: postMeta}"/>
      </div>
      <article class="render">
        <th:block th:replace="~{views/components :: noticeOutdate('top')}"/>
        <th:block th:utext="${post.content.content}"/>
        <th:block th:replace="~{views/components :: noticeOutdate('bottom')}"/>
      </article>

      <div class="copy-right">
        <i class="fa-solid fa-copyright"></i>

        <div class="author">
          <span class="name">文章作者：</span>
          <span class="text" th:text="${contributor?.displayName ?: site.title}"></span>
        </div>

        <div class="url">
          <span class="name">本文链接：</span>
          <span class="text"><a class="permalink" target="_blank"></a></span>
        </div>


        <div class="declaration">
          <span class="name">版权声明：</span>
          <span class="text">本站所有文章除特别声明外，均采用 <a href="https://creativecommons.org/licenses/by-nc-sa/4.0/" target="_blank">CC BY-NC-SA 4.0</a> 许可协议。转载请注明来自 <a href="/" target="_blank" th:text="${contributor?.displayName ?: site.title}"></a>！</span>
        </div>
      </div>

      <th:block th:replace="~{views/components :: postPagination}"/>

      <halo:comment
        th:if="${pluginFinder.available('PluginCommentWidget') && haloCommentEnabled && post.spec.allowComment}"
        group="content.halo.run"
        kind="Post"
        th:attr="name=${post.metadata.name}"
      />
    </section>
    <th:block th:replace="~{views/aside::post}"/>
  </th:block>
</layout>
