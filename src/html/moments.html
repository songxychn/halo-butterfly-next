<layout
  th:replace="~{views/layout :: layout (
  page = 'moments',
  title = ${site.title} + ' - ' + #{ui.moments},
  pin = ~{::pin},
  header = ~{::header},
  main = ~{::main}
  )}"
>
  <!--/* pin */-->
  <th:block th:fragment="pin">
    <script data-theme-script="page-config" id="pageScript" th:inline="javascript">
      Object.assign(window.MainApp.conf, {
        //第一屏
        enable_above: /*[[${aboveEnabled}]]*/ '',
        above_background: /*[[${aboveBackground}]]*/ '',
      });
    </script>
  </th:block>

  <!--/* header */-->
  <th:block th:fragment="header">
    <header th:class="${not aboveEnabled ? 'header dp' : 'header'}">
      <!--/* 导航栏 */-->
      <th:block th:replace="~{views/nav}"/>

      <!--第一屏内容-->
      <section class="above" th:if="${aboveEnabled}">
        <div class="above-info">
          <h1 class="above-title" th:text="#{ui.moments}">瞬间</h1>
        </div>
      </section>
    </header>
  </th:block>


  <!--/* 內容 */-->
  <th:block th:fragment="main">

    <section class="content card animate__animated animate__fadeIn" th:with="noData = ${not #lists.isEmpty(moments.items)}"  th:style="${ noData ?  '' : 'min-height: auto'}">
      <h1 class="page-title" th:if="${not aboveEnabled}" th:text="${#messages.msg('ui.moments')}"></h1>
      <ul class="list" th:if="${noData}">
        <li class="item" th:each="moment : ${moments.items}" th:insert="~{::item(${moment})}"></li>
      </ul>
      <th:block th:unless="${noData}" th:insert="~{views/components:: emptyData(false)}"></th:block>
      <th:block th:replace="~{views/plugin-pagination :: pagination(${moments}, #{ui.momentPagination})}"/>
      <form class="moment-page-jump" data-moment-page-jump hidden th:if="${moments.totalPages > 1 and moments.page <= moments.totalPages}"
        th:attr="data-total-pages=${moments.totalPages}">
        <label><span th:text="#{ui.momentPage}">页码</span> <input type="number" name="page" min="1" th:max="${moments.totalPages}" th:value="${moments.page}" required aria-label="瞬间页码" th:aria-label="#{ui.momentPage}"/></label>
        <button type="submit" th:text="#{ui.momentJump}">跳转</button>
      </form>
    </section>
    <th:block th:replace="~{views/aside::common}"/>
  </th:block>
  <th:block th:fragment="item(moment)" th:with="content=${moment.spec.content},momentDate=${moment.spec.releaseTime ?: moment.metadata.creationTimestamp}">
          <div class="moment-byline" th:attr="data-moment-key=${moment.metadata.name}">
            <img class="moment-avatar" th:if="${not #strings.isEmpty(moment.owner?.avatar)}" th:src="${moment.owner.avatar}" alt="" width="40" height="40" loading="lazy"/>
            <span th:text="${moment.owner?.displayName ?: moment.spec.owner}"></span>
            <a class="moment-permalink" th:href="@{/moments/{name}(name=${moment.metadata.name})}">
              <time data-moment-date th:datetime="${momentDate}" th:text="${momentDate}" th:attr="data-time-zone=${theme.config.moments?.timezone ?: 'UTC'}"></time>
            </a>
          </div>
          <div class="h" th:if="${not #strings.isEmpty(content.html)}" th:utext="${content.html}"></div>

          <div class="medium">
            <th:block th:if="${not #lists.isEmpty(content.medium)}" th:each="momentItem : ${content.medium}">
              <img alt="瞬间图片" th:alt="#{ui.image}" loading="lazy" th:if="${momentItem.type.name == 'PHOTO'}" th:src="${momentItem.url}"/>
              <video controls preload="metadata" th:if="${momentItem.type.name == 'VIDEO'}" th:src="${momentItem.url}"></video>
              <audio controls preload="none" th:if="${momentItem.type.name == 'AUDIO'}" th:src="${momentItem.url}"></audio>
            </th:block>
          </div>

          <footer class="moment-footer">
            <a class="moment-tag" th:each="tag : ${moment.spec.tags}" th:href="@{/moments(tag=${tag})}" th:text="${'#' + tag}"></a>
            <a class="moment-comment-link" th:if="${pluginFinder.available('PluginCommentWidget', '>=3.3.2') and haloCommentEnabled}"
              th:href="@{/moments/{name}(name=${moment.metadata.name})} + '#post-comment'"
              th:text="${#messages.msg('ui.commentPrefix') + (moment.stats?.approvedComment ?: 0)}"></a>
          </footer>
  </th:block>
</layout>
