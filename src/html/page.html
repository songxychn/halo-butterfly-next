<layout
  th:replace="~{views/layout :: layout (
  page = 'single',
  title = ${singlePage.spec.title + ' - ' + site.title} ,
  pin = ~{::pin},
  header = ~{::header},
  main = ~{::main}
  )}"
>
  <!--/* pin */-->
  <th:block th:fragment="pin">
    <script data-theme-script="page-config" id="pageScript" th:inline="javascript" th:with="tocNumberOverride = ${#annotations.getOrDefault(singlePage, 'toc_number', 'inherit')}, tocExpandOverride = ${#annotations.getOrDefault(singlePage, 'toc_expand', 'inherit')}, mathOverride = ${#annotations.getOrDefault(singlePage, 'katex', 'inherit')}">
      Object.assign(window.MainApp.conf, {
        //第一屏
        enable_above: /*[[${aboveEnabled}]]*/ '',
        above_background: /*[[${aboveBackground}]]*/ '',
        enable_h_icon: /*[[${theme.config.render.enable_h_icon}]]*/ true,
        toc_number: /*[[${tocNumberOverride == 'true' ? true : (tocNumberOverride == 'false' ? false : theme.config.toc.number)}]]*/ true,
        toc_expand: /*[[${tocExpandOverride == 'true' ? true : (tocExpandOverride == 'false' ? false : theme.config.toc.expand)}]]*/ false,
        toc_scroll_percent: /*[[${theme.config.toc.scroll_percent}]]*/ true,
        math_enabled: /*[[${mathOverride == 'true' ? true : (mathOverride == 'false' ? false : (theme.config.math?.enable != false and theme.config.math?.enable != 'false'))}]]*/ true,
        math_copy_tex: /*[[${theme.config.math?.copy_tex != false and theme.config.math?.copy_tex != 'false'}]]*/ true,
        math_hide_scrollbar: /*[[${theme.config.math?.hide_scrollbar == true or theme.config.math?.hide_scrollbar == 'true'}]]*/ false,
        anchor_auto_update: /*[[${theme.config.anchor?.auto_update}]]*/ false,
        anchor_click_to_scroll: /*[[${theme.config.anchor?.click_to_scroll}]]*/ false,
        photofigcaption: /*[[${theme.config.post?.photofigcaption == true or theme.config.post?.photofigcaption == 'true'}]]*/ false,
      });
    </script>
    <th:block th:replace="~{views/body-renderers :: config(${singlePage})}"/>
    <th:block th:replace="~{views/components :: codeBlockPin}"/>
  </th:block>


  <!--/* header */-->
  <th:block th:fragment="header">
    <header th:class="${not aboveEnabled ? 'header dp' : 'header'}">
      <!--/* 导航栏 */-->
      <th:block th:replace="~{views/nav}"/>

      <!--第一屏内容-->
      <section class="above" th:if="${aboveEnabled}">
        <div class="above-info">
          <h1 class="above-title" th:text="${singlePage.spec.title}"></h1>
        </div>
      </section>
    </header>
  </th:block>


  <!--/* 內容 */-->
  <th:block th:fragment="main">
    <section class="content card">
      <h1 class="page-title" th:if="${not aboveEnabled}" th:text="${singlePage.spec.title}"></h1>
      <article th:lang="${contentLanguage}" class="render" th:utext="${singlePage.content.content}"
        th:attr="data-copy-enabled=${theme.config.copy?.enable != false and theme.config.copy?.enable != 'false'},data-copy-copyright=${theme.config.copy?.copyright?.enable == true or theme.config.copy?.copyright?.enable == 'true'},data-copy-limit=${theme.config.copy?.copyright?.limit_count != null ? theme.config.copy.copyright.limit_count : 150},data-copy-author=${singlePage.owner?.displayName ?: site.title},data-copy-url=${canonical ?: singlePage.status.permalink},data-copy-site=${site.title},data-copy-license=${theme.config.post.post_copyright?.license ?: 'CC BY-NC-SA 4.0'}"></article>
      <div
        id="post-comment"
        role="region" aria-labelledby="comment-title"
        th:if="${pluginFinder.available('PluginCommentWidget', '>=3.3.2') && haloCommentEnabled && singlePage.spec.allowComment}"
      >
        <div class="comment-head">
          <h2 class="comment-headline" id="comment-title" tabindex="-1">
            <i class="fa-solid fa-comments fa-fw" aria-hidden="true"></i>
            <span th:text="#{ui.comments}"></span>
          </h2>
        </div>
        <p class="comment-notice" th:if="${theme.config.comments?.text != false and not #strings.isEmpty(theme.config.comments?.notice)}" th:text="${theme.config.comments.notice}"></p>
        <div class="comment-wrap">
          <halo:comment group="content.halo.run" kind="SinglePage" th:attr="name=${singlePage.metadata.name}" />
        </div>
      </div>
      <p class="comment-notice comment-unavailable"
        th:if="${theme.config.comments?.text != false and ((site.comment.enable != true or singlePage.spec.allowComment != true) ? not #strings.isEmpty(theme.config.comments?.closed_notice) : ((not pluginFinder.available('PluginCommentWidget', '>=3.3.2') or not haloCommentEnabled) and not #strings.isEmpty(theme.config.comments?.unavailable_notice)))}"
        th:text="${(site.comment.enable != true or singlePage.spec.allowComment != true) ? theme.config.comments.closed_notice : theme.config.comments.unavailable_notice}"></p>
    </section>
    <th:block th:replace="~{views/aside::single}"/>
  </th:block>
</layout>
