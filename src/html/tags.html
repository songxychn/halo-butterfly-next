<layout
  th:replace="~{views/layout :: layout (
  page = 'tags',
  title = ${site.title} + ' - ' + #{ui.tags},
  pin = ~{::pin},
  header = ~{::header},
  main = ~{::main}
  )}"
>
  <!--/* pin */-->
  <th:block th:fragment="pin">
    <script data-theme-script="page-config" id="pageScript" th:inline="javascript">
      Object.assign(window.MainApp.conf, {
        //第一屏
        enable_above: /*[[${aboveEnabled}]]*/ '',
        above_background: /*[[${aboveBackground}]]*/ '',
      });
    </script>
  </th:block>


  <!--/* header */-->
  <th:block th:fragment="header">
    <header th:class="${not aboveEnabled ? 'header dp' : 'header'}">
      <!--/* 导航栏 */-->
      <th:block th:replace="~{views/nav}"/>

      <!--第一屏内容-->
      <section class="above" th:if="${aboveEnabled}">
        <div class="above-info">
          <h1 class="above-title" th:text="#{ui.tags}">标签</h1>
        </div>
      </section>
    </header>
  </th:block>


  <!--/* 內容 */-->
  <th:block th:fragment="main">
    <section class="content card" th:with="noData = ${not #lists.isEmpty(tags)}">
      <h1 class="page-title" th:if="${not aboveEnabled}" th:text="${#messages.msg('ui.tags')}"></h1>
      <th:block th:if="${noData}">
        <div class="chart" th:if="${theme.config.appearance?.tag_ui == 'chart'}"></div>

        <div class="equinox" data-tag-cloud th:attr="data-orderby=${theme.config.tags.cloud?.orderby ?: 'native'},data-order=${theme.config.tags.cloud?.order ?: 1},data-amount=${theme.config.tags.cloud?.amount ?: 0},data-min-font=${theme.config.tags.cloud?.min_font ?: 12},data-max-font=${theme.config.tags.cloud?.max_font ?: 21},data-unit=${theme.config.tags.cloud?.unit ?: 'px'}">
          <a class="link "
             th:each="tag : ${tags}"
             th:text="${tag.spec.displayName}"
             th:data-postCount="${tag.postCount}"
             th:data-color="${tag.spec.color}"
             th:href="${tag.status.permalink}"></a>
        </div>
      </th:block>

      <th:block th:unless="${noData}" th:insert="~{views/components:: emptyData(false)}"></th:block>
    </section>
    <th:block th:replace="~{views/aside::common}"/>
  </th:block>
</layout>
