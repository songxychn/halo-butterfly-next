apiVersion: v1alpha1
kind: AnnotationSetting
metadata:
  generateName: annotation-setting-
spec:
  targetRef:
    group: ""
    kind: MenuItem
  formSchema:
    - $formkit: "text"
      name: "icon"
      label: "图标"
    - $formkit: "radio"
      name: "hide"
      label: "移动菜单默认折叠"
      help: "仅分组生效。对应 Butterfly 的 hide：开启时收起子菜单；关闭时默认展开，不隐藏菜单项。"
      value: "false"
      options:
        - label: 默认展开
          value: "false"
        - label: 默认折叠
          value: "true"

---
apiVersion: v1alpha1
kind: AnnotationSetting
metadata:
  generateName: annotation-setting-
spec:
  targetRef:
    group: content.halo.run
    kind: Post
  formSchema:
    - $formkit: "radio"
      name: "enable_code_copy"
      label: "启用代码复制"
      help: "本篇文章代码块复制按钮"
      value: "true"
      options:
        - label: 启用
          value: "true"
        - label: 禁用
          value: "false"
    - $formkit: "radio"
      name: "toc"
      label: "显示目录"
      help: "单篇设置优先于全局设置。"
      value: "inherit"
      options:
        - label: 跟随全局
          value: "inherit"
        - label: 开启
          value: "true"
        - label: 关闭
          value: "false"
    - $formkit: "radio"
      name: "toc_number"
      label: "目录编号"
      help: "单篇设置优先于全局设置。"
      value: "inherit"
      options:
        - label: 跟随全局
          value: "inherit"
        - label: 开启
          value: "true"
        - label: 关闭
          value: "false"
    - $formkit: "radio"
      name: "toc_expand"
      label: "展开全部目录"
      help: "单篇设置优先于全局设置。"
      value: "inherit"
      options:
        - label: 跟随全局
          value: "inherit"
        - label: 开启
          value: "true"
        - label: 关闭
          value: "false"
    - $formkit: "radio"
      name: "toc_style_simple"
      label: "简洁目录侧栏"
      help: "单篇设置优先于全局设置。"
      value: "inherit"
      options:
        - label: 跟随全局
          value: "inherit"
        - label: 开启
          value: "true"
        - label: 关闭
          value: "false"
    - $formkit: "radio"
      name: "copyright"
      label: "文章版权声明"
      help: "单篇设置优先于全局设置。"
      value: "inherit"
      options:
        - label: 跟随全局
          value: "inherit"
        - label: 开启
          value: "true"
        - label: 关闭
          value: "false"
    - $formkit: "radio"
      name: "noticeOutdate"
      label: "文章过期提醒"
      help: "单篇设置优先于全局设置。开启后仍按全局过期天数判断。"
      value: "inherit"
      options:
        - label: 跟随全局
          value: "inherit"
        - label: 开启
          value: "true"
        - label: 关闭
          value: "false"

