apiVersion: v1alpha1
kind: AnnotationSetting
metadata:
  generateName: annotation-setting-
spec:
  targetRef:
    group: ""
    kind: MenuItem
  formSchema:
    - $formkit: "text"
      name: "icon"
      label: "图标"
    - $formkit: "radio"
      name: "hide"
      label: "移动菜单默认折叠"
      help: "仅分组生效。对应 Butterfly 的 hide：开启时收起子菜单；关闭时默认展开，不隐藏菜单项。"
      value: "false"
      options:
        - label: 默认展开
          value: "false"
        - label: 默认折叠
          value: "true"

---
apiVersion: v1alpha1
kind: AnnotationSetting
metadata:
  generateName: annotation-setting-
spec:
  targetRef:
    group: content.halo.run
    kind: Post
  formSchema:
    - $formkit: select
      name: aside
      label: 本篇侧栏
      help: 跟随全局或覆盖本篇侧栏显示；不改变其他页面。
      value: inherit
      options:
        - label: 跟随全局
          value: inherit
        - label: 显示
          value: "true"
        - label: 隐藏
          value: "false"
    - $formkit: select
      name: highlight_shrink
      label: 本篇代码折叠
      value: inherit
      help: 保留当前代码功能总开关；此项只覆盖初始开合状态和折叠按钮。
      options:
        - label: 跟随全局
          value: inherit
        - label: 初始展开
          value: expanded
        - label: 初始折叠
          value: collapsed
        - label: 不显示折叠按钮
          value: disabled
    - $formkit: text
      name: copyright_author
      label: 版权作者
      value: ""
      help: 留空继承全局或当前文章；链接仅允许 HTTP(S) 或站内根路径，声明按纯文本显示。
    - $formkit: text
      name: copyright_author_href
      label: 版权作者链接
      value: ""
      help: 留空继承全局或当前文章；链接仅允许 HTTP(S) 或站内根路径，声明按纯文本显示。
    - $formkit: text
      name: copyright_url
      label: 原文链接
      value: ""
      help: 留空继承全局或当前文章；链接仅允许 HTTP(S) 或站内根路径，声明按纯文本显示。
    - $formkit: textarea
      name: copyright_info
      label: 版权补充声明
      value: ""
      help: 留空继承全局或当前文章；链接仅允许 HTTP(S) 或站内根路径，声明按纯文本显示。
    - $formkit: text
      name: copyright_license
      label: 本篇许可证名称
      value: ""
      help: 留空继承全局或当前文章；链接仅允许 HTTP(S) 或站内根路径，声明按纯文本显示。
    - $formkit: text
      name: copyright_license_url
      label: 本篇许可证链接
      value: ""
      help: 留空继承全局或当前文章；链接仅允许 HTTP(S) 或站内根路径，声明按纯文本显示。
    - $formkit: select
      name: language
      label: 正文语言
      help: 设置正文 lang 和分享元数据语言；导航等界面仍使用访问者语言，不翻译作者内容。
      value: ""
      options:
        - label: 跟随访问者语言
          value: ""
        - label: English
          value: en
        - label: 日本語
          value: ja
        - label: 한국어
          value: ko
        - label: 简体中文
          value: zh-CN
        - label: 繁體中文（香港）
          value: zh-HK
        - label: 繁體中文（臺灣）
          value: zh-TW
    - $formkit: radio
      name: top_img_enable
      label: 显示顶图
      help: 顶图复用文章封面；跟随全局时使用文章第一屏设置。全局关闭顶图时此项不能重新开启。
      value: inherit
      options:
        - label: 跟随全局
          value: inherit
        - label: 显示
          value: "true"
        - label: 隐藏
          value: "false"
    - $formkit: radio
      name: mermaid
      label: 渲染 Mermaid
      help: 跟随全局或为本篇覆盖；关闭保留源码。
      value: inherit
      options:
        - label: 跟随全局
          value: inherit
        - label: 开启
          value: "true"
        - label: 关闭
          value: "false"
    - $formkit: radio
      name: chartjs
      label: 渲染正文图表
      help: 跟随全局或为本篇覆盖；关闭保留源码。
      value: inherit
      options:
        - label: 跟随全局
          value: inherit
        - label: 开启
          value: "true"
        - label: 关闭
          value: "false"
    - $formkit: radio
      name: abcjs
      label: 渲染 ABC 乐谱
      help: 跟随全局或为本篇覆盖；关闭保留源码。
      value: inherit
      options:
        - label: 跟随全局
          value: inherit
        - label: 开启
          value: "true"
        - label: 关闭
          value: "false"
    - $formkit: "radio"
      name: "katex"
      label: "显示公式"
      help: "优先于全局数学公式设置；关闭时显示可提取的 TeX 源码，不关闭插件资源。"
      value: "inherit"
      options:
        - label: 跟随全局
          value: "inherit"
        - label: 开启
          value: "true"
        - label: 关闭
          value: "false"
    - $formkit: "radio"
      name: "enable_code_copy"
      label: "启用代码复制"
      help: "本篇文章代码块复制按钮"
      value: "true"
      options:
        - label: 启用
          value: "true"
        - label: 禁用
          value: "false"
    - $formkit: "radio"
      name: "toc"
      label: "显示目录"
      help: "单篇设置优先于全局设置。"
      value: "inherit"
      options:
        - label: 跟随全局
          value: "inherit"
        - label: 开启
          value: "true"
        - label: 关闭
          value: "false"
    - $formkit: "radio"
      name: "toc_number"
      label: "目录编号"
      help: "单篇设置优先于全局设置。"
      value: "inherit"
      options:
        - label: 跟随全局
          value: "inherit"
        - label: 开启
          value: "true"
        - label: 关闭
          value: "false"
    - $formkit: "radio"
      name: "toc_expand"
      label: "展开全部目录"
      help: "单篇设置优先于全局设置。"
      value: "inherit"
      options:
        - label: 跟随全局
          value: "inherit"
        - label: 开启
          value: "true"
        - label: 关闭
          value: "false"
    - $formkit: "radio"
      name: "toc_style_simple"
      label: "简洁目录侧栏"
      help: "单篇设置优先于全局设置。"
      value: "inherit"
      options:
        - label: 跟随全局
          value: "inherit"
        - label: 开启
          value: "true"
        - label: 关闭
          value: "false"
    - $formkit: "radio"
      name: "copyright"
      label: "文章版权声明"
      help: "单篇设置优先于全局设置。"
      value: "inherit"
      options:
        - label: 跟随全局
          value: "inherit"
        - label: 开启
          value: "true"
        - label: 关闭
          value: "false"
    - $formkit: "radio"
      name: "noticeOutdate"
      label: "文章过期提醒"
      help: "单篇设置优先于全局设置。开启后仍按全局过期天数判断。"
      value: "inherit"
      options:
        - label: 跟随全局
          value: "inherit"
        - label: 开启
          value: "true"
        - label: 关闭
          value: "false"

