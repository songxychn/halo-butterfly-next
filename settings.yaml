          children:
            - $formkit: text
              name: name
              label: 名称
              placeholder: 请填写 账号名称
              value: ""
              validation: required
            - $formkit: text
              name: icon
              label: 图标
              placeholder: 请填写 图标
              value: ""
              validation: required
            - $formkit: text
              name: link
              label: 链接
              placeholder: 请填写 链接
              value: ""
              validation: required
