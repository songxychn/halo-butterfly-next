apiVersion: v1alpha1
kind: Setting
metadata:
  name: halo-butterfly-next-setting
spec:
  forms:
    - group: base
      label: 基本设置
      formSchema:
        - $formkit: checkbox
          name: enable_seo
          label: 输出主题分享元数据与规范链接
          value: true
          help: 输出 Open Graph 及文章、自定义页面、首页第一页的 canonical。使用其他 SEO 插件时可关闭；描述和关键词由 Halo 提供。
        - $formkit: text
          name: metadata_name
          label: 作者用户名
          placeholder: 请填写作者的唯一标识（用户名）
          value: ""
          help: 可选。填写 Halo 用户名显示个人资料；留空或用户不存在时使用站点信息。
        - $formkit: text
          name: icp
          label: ICP 备案号
          placeholder: 请填写 ICP 备案号信息
          help: ICP 备案信息将展示在页脚中，不填不展示（示例：蜀ICP备xx号）
        - $formkit: text
          name: police
          label: 公网安备号
          placeholder: 请填写公网安备号信息
          help: 公网安备信息将展示在页脚中，不填不展示（示例：京公xxx号）
        - $formkit: date
          name: site_birthday
          label: 建站时间
          placeholder: 示例 2022-01-01 00:00
          help: 自定义博客的起始时间/安装时间，作为计算博客运行时间的参照值，不选择不显示
    #主题设置
    - group: style
      label: 主题设置
      formSchema:
        - $formkit: select
          name: mode
          label: 主题模式
          value: 'user'
          placeholder: 请填写主题颜色
          help: '设置博客的主题模式（自动/用户/浅色/深色），默认为用户模式，仅在用户模式下页面才有主题切换按钮，自动模式下根据时间自动切换'
          options:
            - value: 'auto'
              label: 自动模式
            - value: 'user'
              label: 用户模式
            - value: 'light'
              label: 浅色模式
            - value: 'dark'
              label: 深色模式
        - $formkit: select
          name: font_family
          label: 主题字体
          value: 'null'
          help: 当前预览版使用系统字体。旧版附带字体不再分发。
          options:
            - value: 'null'
              label: "系统字体"
        - $formkit: text
          name: body_background
          label: 全局背景（浅色）
          placeholder: 请填写 全局背景
          value: '#f7f9fe'
          help: 颜色值 默认值：#f7f9fe
          validation: required
    #加载设置
    - group: loading
      label: 加载设置
      formSchema:
        - $formkit: radio
          name: type
          label: 页面加载（Loading）
          help: 内置多种加载样式
          value: 'circle'
          options:
            - label: '转圈'
              value: 'circle'
            - label: '沙漏'
              value: 'hourglass'
            - label: '交叉线'
              value: 'cross_line'
            - label: '小圆点'
              value: 'dot'
          validation: required
        - $formkit: group
          label: 图片加载
          name: img
          value:
            preload: 'data:image/gif;base64,R0lGODdhAQABAPAAAMPDwwAAACwAAAAAAQABAAACAkQBADs='
            err: 'data:image/gif;base64,R0lGODdhAQABAPAAAMPDwwAAACwAAAAAAQABAAACAkQBADs='
            random_enable: false
            random_link: ''
          children:
            - $formkit: attachment
              name: preload
              label: 预加载图
              placeholder: 请填写 预加载图片
              value: 'data:image/gif;base64,R0lGODdhAQABAPAAAMPDwwAAACwAAAAAAQABAAACAkQBADs='
              help: 预加载图片，默认 data:image/gif;base64,R0lGODdhAQABAPAAAMPDwwAAACwAAAAAAQABAAACAkQBADs=
              validation: required
            - $formkit: attachment
              name: err
              label: 加载失败图
              placeholder: 请填写 加载失败图片
              value: 'data:image/gif;base64,R0lGODdhAQABAPAAAMPDwwAAACwAAAAAAQABAAACAkQBADs='
              help: 加载失败图片，默认 data:image/gif;base64,R0lGODdhAQABAPAAAMPDwwAAACwAAAAAAQABAAACAkQBADs=
              validation: required
            - $formkit: radio
              name: random_enable
              label: 启用随机图片
              help: 是否启用随机图API（必须先配置 API），开启后将使用随机图填充没有设置封面的，未开启时使用主题内置的封面图
              value: false
              validation: required
              options:
                - label: 启用
                  value: true
                - label: 禁用
                  value: false
            - $formkit: text
              name: random_link
              label: 随机图片链接
              placeholder: 请正确填写 随机图片链接
              value: ''
              help: 自定义随机图API，用于填充没有设置封面的 ，免费 API 不会一直可用，请知悉
              validation: url
    #导航设置
    - group: nav
      label: 导航设置
      formSchema:
        - $formkit: radio
          name: fixed
          label: 滚动后始终固定导航
          help: 关闭时滚动超过导航高度后向下隐藏、向上显示（上游 nav.fixed 默认关闭）。开启后导航始终吸顶可见。
          value: false
          options:
            - label: 启用
              value: true
            - label: 禁用
              value: false
        - $formkit: attachment
          name: logo
          label: 导航 Logo
          placeholder: 可选，留空不显示
          value: ""
          help: 显示在站点标题左侧。留空不显示图片。
        - $formkit: radio
          name: display_title
          label: 显示站点标题
          help: 关闭后导航不显示站点名，可只保留 Logo。
          value: true
          options:
            - label: 启用
              value: true
            - label: 禁用
              value: false
        - $formkit: radio
          name: display_post_title
          label: 滚动后显示文章标题
          help: 仅文章页。开启且导航进入滚动固定态时，用文章标题替换站点名。
          value: true
          options:
            - label: 启用
              value: true
            - label: 禁用
              value: false
        - $formkit: group
          name: font_color
          label: 导航栏默认字体颜色
          help: 支持rgba颜色值和十六进制颜色值
          value:
            light: rgba(238, 238, 238, 1)
            dark: rgba(255, 255, 255, 0.7)
          children:
            - $formkit: text
              name: light
              label: 浅色
              value: ""
              help: 默认值：rgba(238, 238, 238, 1)
              validation: required
            - $formkit: text
              name: dark
              label: 暗色
              value: ""
              help: 默认值：rgba(255, 255, 255, 0.7)
              validation: required
        - $formkit: group
          name: active_font_color
          label: 导航栏滚动悬浮字体颜色
          help: 支持rgba颜色值和十六进制颜色值
          value:
            light: rgb(76, 73, 72)
            dark: rgba(255, 255, 255, 0.7)
          children:
            - $formkit: text
              name: light
              label: 浅色
              value: ""
              help: 默认值：rgb(76, 73, 72)
              validation: required
            - $formkit: text
              name: dark
              label: 暗色
              value: ""
              help: 默认值：rgba(255, 255, 255, 0.7)
              validation: required
        - $formkit: group
          name: active_hover_font_color
          label: 导航栏滚动悬浮鼠标移入字体颜色
          help: 支持rgba颜色值和十六进制颜色值（默认主题色）
          value:
            light: var(--theme)
            dark: var(--theme)
          children:
            - $formkit: text
              name: light
              label: 浅色
              value: ""
              help: 默认值：var(--theme)
              validation: required
            - $formkit: text
              name: dark
              label: 暗色
              value: ""
              help: 默认值：var(--theme)
              validation: required
        - $formkit: group
          name: active_background_color
          label: 导航栏滚动悬浮背景颜色
          help: 支持rgba颜色值和十六进制颜色值
          value:
            light: rgba(255, 255, 255, .8)
            dark: rgba(18, 18, 18, .8)
          children:
            - $formkit: text
              name: light
              label: 浅色
              value: ""
              help: 默认值：rgba(255, 255, 255, .8)
              validation: required
            - $formkit: text
              name: dark
              label: 暗色
              value: ""
              help: 默认值：rgba(18, 18, 18, .8)
              validation: required
        - $formkit: group
          name: active_shadow
          label: 导航栏滚动悬浮阴影
          help: 支持rgba颜色值和十六进制颜色值
          value:
            light: 0 5px 6px -5px rgba(133, 133, 133, .6)
            dark: 0 5px 6px -5px rgba(133, 133, 133, 0)
          children:
            - $formkit: text
              name: light
              label: 浅色
              value: ""
              help: 默认值：0 5px 6px -5px rgba(133, 133, 133, .6)
              validation: required
            - $formkit: text
              name: dark
              label: 暗色
              value: ""
              help: 默认值：0 5px 6px -5px rgba(133, 133, 133, 0)
              validation: required
        - $formkit: group
          name: dropdown_background_color
          label: 导航栏二级下拉背景颜色
          help: 支持rgba颜色值和十六进制颜色值
          value:
            light: rgba(255, 255, 255)
            dark: rgba(18, 18, 18)
          children:
            - $formkit: text
              name: light
              label: 浅色
              value: ""
              help: 默认值：rgba(255, 255, 255)
              validation: required
            - $formkit: text
              name: dark
              label: 暗色
              value: ""
              help: 默认值：rgba(18, 18, 18)
              validation: required
        - $formkit: group
          name: dropdown_font_color
          label: 导航栏二级下拉字体颜色
          help: 支持rgba颜色值和十六进制颜色值
          value:
            light: rgba(76, 73, 72, 1)
            dark: rgba(255, 255, 255, 0.7)
          children:
            - $formkit: text
              name: light
              label: 浅色
              value: ""
              help: 默认值：rgba(76, 73, 72, 1)
              validation: required
            - $formkit: text
              name: dark
              label: 暗色
              value: ""
              help: 默认值：rgba(255, 255, 255, 0.7)
              validation: required
        - $formkit: group
          name: dropdown_hover_font_color
          label: 导航栏hover二级下拉字体颜色
          help: 支持rgba颜色值和十六进制颜色值
          value:
            light: rgb(244 244 244)
            dark: rgb(54 50 50)
          children:
            - $formkit: text
              name: light
              label: 浅色
              value: ""
              help: 默认值：rgb(244 244 244)
              validation: required
            - $formkit: text
              name: dark
              label: 暗色
              value: ""
              help: 默认值：rgb(54 50 50)
              validation: required
    #侧边栏设置
    - group: aside
      label: 侧边栏设置
      formSchema:
        - $formkit: radio
          name: enable
          label: 启用侧边栏（全局）
          help: 是否启用侧边栏，关闭后所有页面都没有侧边栏（优先级高于页面元数据）
          value: true
          options:
            - label: 启用
              value: true
            - label: 禁用
              value: false
        - $formkit: radio
          name: position
          label: 侧边栏位置
          help: 侧边栏展示位置，左边或右边
          value: aside-right
          options:
            - label: 左边
              value: aside-left
            - label: 右边
              value: aside-right
        - $formkit: group
          name: button
          label: 侧边栏按钮
          value:
            name: '上游 Halo 移植项目'
            link: 'https://github.com/dhjddcn/halo-theme-butterfly'
          children:
            - $formkit: text
              name: name
              label: 名称
              placeholder: 请填写 按钮名称
              help: 支持html代码片段
              value: ""
              validation: required
            - $formkit: text
              name: link
              label: 链接
              placeholder: 请填写 按钮链接
              value: ""
              validation: required
        - $formkit: repeater
          name: social
          label: 社交账号
          value:
            - name: 'Github'
              icon: '<i class="fa-brands fa-github"></i>'
              link: 'https://github.com/dhjddcn'
          children:
            - $formkit: text
              name: name
              label: 名称
              placeholder: 请填写 账号名称
              value: ""
              validation: required
            - $formkit: text
              name: icon
              label: 图标
              placeholder: 请填写 图标
              value: ""
              validation: required
            - $formkit: text
              name: link
              label: 链接
              placeholder: 请填写 链接
              value: ""
              validation: required
        - $formkit: textarea
          rows: 5
          name: notice
          label: 侧边栏公告
          placeholder: 请填写 侧边栏公告内容
          value: '好博客，一定要 分享出去 呀~'
          help: 侧边栏公告内容, 支持 html 代码片段
        - $formkit: radio
          name: enable_category
          label: 启用侧边栏分类
          help: 是否启用侧边栏分类（只随机展示 5 个分类，不支持二级分类）
          value: true
          options:
            - label: 启用
              value: true
            - label: 禁用
              value: false
        - $formkit: radio
          name: enable_tags
          label: 启用侧边栏标签
          help: 是否启用侧边栏标签（只随机展示 25 个标签）
          value: true
          options:
            - label: 启用
              value: true
            - label: 禁用
              value: false
        - $formkit: radio
          name: enable_custom
          label: 启用侧边栏自定义模块
          help: 是否启用自定义模块
          value: false
          options:
            - label: 启用
              value: true
            - label: 禁用
              value: false
        - $formkit: radio
          name: enable_webInfo
          label: 启用侧边栏网站资讯
          help: 是否启用侧边栏网站资讯
          value: true
          options:
            - label: 启用
              value: true
            - label: 禁用
              value: false
    #卡片设置
    - group: card
      label: 卡片设置
      formSchema:
        - $formkit: text
          name: radius
          label: 卡片圆角
          placeholder: 请填写 卡片圆角
          value: 15px
          help: 卡片圆角，像素或百分比，默认值： 15px
          validation: required
        - $formkit: text
          name: shadow
          label: 卡片阴影
          placeholder: 请填写 卡片阴影
          value: 0 3px 8px 6px rgba(7,17,27,0.05)
          help: 卡片阴影，默认值： 0 3px 8px 6px rgba(7,17,27,0.05)
          validation: required
    #首页设置
    - group: index
      label: 首页设置
      formSchema:
        - $formkit: radio
          name: enable_above
          label: 启用第一屏
          help: 启用首页第一屏
          value: true
          options:
            - label: 启用
              value: true
            - label: 禁用
              value: false
        - $formkit: attachment
          name: above_background
          label: 第一屏背景图
          placeholder: 请填写 第一屏背景图
          value: '/themes/halo-butterfly-next/assets/images/above.svg'
          help: 如果全局背景图设置为图片链接，则此处背景图将不生效
          validation: required
        - $formkit: text
          name: top_img_height
          label: 首页第一屏高度
          placeholder: 例如 100vh、60vh、500px
          value: ""
          help: 留空为全屏 100vh，对应上游 index_top_img_height。
        - $formkit: text
          name: site_info_top
          label: 首页标题垂直位置
          placeholder: 例如 43%、50%、20%
          value: ""
          help: 留空为垂直居中。对应上游 index_site_info_top。
        - $formkit: radio
          name: enable_subtitle
          label: 启用首页字幕
          help: 关闭后不显示字幕，也不请求随机文案。默认开启以保留旧版本行为。
          value: true
          options:
            - label: 启用
              value: true
            - label: 禁用
              value: false
        - $formkit: radio
          name: subtitle_effect
          label: 启用字幕打字效果
          help: 关闭后静态显示第一条文案；随机来源开启时显示返回文案，失败回退到自定义第一条。
          value: true
          options:
            - label: 启用
              value: true
            - label: 禁用
              value: false
        - $formkit: textarea
          rows: 5
          name: typewriter_custom_text
          label: 首页字幕文案
          placeholder: 请填写 首页字幕文案
          help: 多条文案用 |&| 分隔；关闭打字效果时显示第一条。留空不显示提示文字；随机来源失败时回退到此处文案。
          value: '欢迎使用Butterfly主题，一个简洁、优雅的主题~'
        - $formkit: radio
          name: enable_typewriter_random_text
          label: 启用随机打字机文案
          help: 是否启用随文案API（必须先配置 API），启用后将显示随机API文案，禁用时显示打字机文案
          value: false
          options:
            - label: 启用
              value: true
            - label: 禁用
              value: false
        - $formkit: text
          name: typewriter_random_api
          label: 随机文案链接（api）
          placeholder: 请正确填写 随机文案链接（api）
          value: ''
          help: 自定义随机文案API(推荐使用一言,返回格式设置为TEXT格式，json需要配置取值格式)，免费 API 不会一直可用，请知悉
        - $formkit: text
          name: typewriter_api_value_format
          label: 随机文案api取值格式
          value: ''
          help: 如果使用的随机文案API返回格式不是TEXT格式，Json请自定义取值格式，如：data.content
        - $formkit: radio
          name: post_layout
          label: 文章布局方式
          help: 文章布局方式 提供（列表、平铺）两种，仅首页生效
          value: list
          options:
            - label: 列表
              value: list
            - label: 平铺
              value: tile
        - $formkit: group
          name: post_meta
          label: 首页列表元信息
          help: 对应上游 Butterfly post_meta.page（不含 date_format / relative）。控制首页/分类/标签列表卡片上的日期、分类与标签。
          value:
            date_type: created
            categories: true
            tags: true
            label: true
          children:
            - $formkit: radio
              name: date_type
              label: 日期显示
              help: 对应上游 post_meta.page.date_type。created 只发布日（默认），updated 只更新日，both 两者。
              value: created
              options:
                - label: 仅发布日
                  value: created
                - label: 仅更新日
                  value: updated
                - label: 发布日与更新日
                  value: both
            - $formkit: radio
              name: categories
              label: 显示分类
              help: 对应上游 post_meta.page.categories。关闭后即使有分类也不渲染。
              value: true
              options:
                - label: 显示
                  value: true
                - label: 隐藏
                  value: false
            - $formkit: radio
              name: tags
              label: 显示标签
              help: 对应上游 post_meta.page.tags。关闭后即使有标签也不渲染。
              value: true
              options:
                - label: 显示
                  value: true
                - label: 隐藏
                  value: false
            - $formkit: radio
              name: label
              label: 显示日期前缀
              help: 对应上游 post_meta.page.label。关闭后不显示「发布于」「更新于」等前缀。
              value: true
              options:
                - label: 显示
                  value: true
                - label: 隐藏
                  value: false
    #文章设置
    - group: post
      label: 文章设置
      formSchema:
        - $formkit: radio
          name: enable_above
          label: 启用第一屏
          help: 启用首页第一屏
          value: true
          options:
            - label: 启用
              value: true
            - label: 禁用
              value: false
        - $formkit: group
          name: post_meta
          label: 文章页元信息
          help: 对应上游 Butterfly post_meta.post（不含 date_format / relative）
          value:
            position: left
            date_type: both
            categories: true
            tags: true
            label: true
          children:
            - $formkit: radio
              name: position
              label: 元信息对齐
              help: 对应上游 post_meta.post.position，可选 left / center。默认 left。
              value: left
              options:
                - label: 左对齐
                  value: left
                - label: 居中
                  value: center
            - $formkit: radio
              name: date_type
              label: 日期显示
              help: 对应上游 post_meta.post.date_type。created 只发布日，updated 只更新日，both 两者。
              value: both
              options:
                - label: 发布日与更新日
                  value: both
                - label: 仅发布日
                  value: created
                - label: 仅更新日
                  value: updated
            - $formkit: radio
              name: categories
              label: 显示分类
              help: 对应上游 post_meta.post.categories。关闭后即使有分类也不渲染。
              value: true
              options:
                - label: 显示
                  value: true
                - label: 隐藏
                  value: false
            - $formkit: radio
              name: tags
              label: 显示标签
              help: 对应上游 post_meta.post.tags。关闭后即使有标签也不渲染。
              value: true
              options:
                - label: 显示
                  value: true
                - label: 隐藏
                  value: false
            - $formkit: radio
              name: label
              label: 显示日期前缀
              help: 对应上游 post_meta.post.label。关闭后不显示「发布于」「更新于」等前缀。
              value: true
              options:
                - label: 显示
                  value: true
                - label: 隐藏
                  value: false
