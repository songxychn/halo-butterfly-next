          children:
            - $formkit: radio
              name: enable
              label: 启用过期提醒
              help: 默认关闭；单篇元数据可覆盖此开关，提醒仍需达到过期天数。
              value: false
              options:
                - label: 启用
                  value: true
                - label: 禁用
                  value: false
