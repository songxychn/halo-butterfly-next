                - label: 隐藏
                  value: false
            - $formkit: radio
              name: label
              label: 显示日期前缀
              help: 对应上游 post_meta.page.label。关闭后不显示「发布于」「更新于」等前缀。
              value: true
              options:
                - label: 显示
                  value: true
                - label: 隐藏
                  value: false
