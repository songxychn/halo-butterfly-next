    #页脚（对齐上游 footer.owner / copyright / custom_text）
    - group: footer
      label: 页脚
      formSchema:
        - $formkit: group
          name: owner
          label: 站点所有权
          help: 对应上游 Butterfly footer.owner（_config.yml / layout/includes/footer.pug，5.7.0 f223b188）。默认 enable true、since 2025。关闭不渲染 © 行。since 与当前年不同时显示 since - current，否则只显示当前年。作者用站点名称。不做 footer.nav、footer_img、reward。
          value:
            enable: true
            since: 2025
          children:
            - $formkit: radio
              name: enable
              label: 显示所有权行
              help: 对应上游 footer.owner.enable（默认 true）。关闭不渲染 © 所有权行。
              value: true
              options:
                - label: 显示
                  value: true
                - label: 隐藏
                  value: false
            - $formkit: number
              name: since
              label: 起始年
              help: 对应上游 footer.owner.since（默认 2025）。与当前年相同或为空时只显示当前年。
              value: 2025
        - $formkit: group
          name: copyright
          label: 框架与主题
          help: 对应上游 Butterfly footer.copyright（_config.yml / footer.pug）。默认 enable true、version true。关闭不渲染 Powered by 行。version 关闭不显示主题版本号。Halo 替代 Hexo。不做 footer.nav。
          value:
            enable: true
            version: true
          children:
            - $formkit: radio
              name: enable
              label: 显示框架与主题
              help: 对应上游 footer.copyright.enable（默认 true）。关闭不渲染框架/主题行。
              value: true
              options:
                - label: 显示
                  value: true
                - label: 隐藏
                  value: false
            - $formkit: radio
              name: version
              label: 显示版本号
              help: 对应上游 footer.copyright.version（默认 true）。开启时在主题名后显示 theme.spec.version。
              value: true
              options:
                - label: 显示
                  value: true
                - label: 隐藏
                  value: false
        - $formkit: textarea
          name: custom_text
          label: 自定义文案
          help: 对应上游 footer.custom_text（默认空）。有内容才渲染。可见文本 th:text，不做 HTML。
          value: ""
    - group: error404
      label: 404 页面
      formSchema:
        - $formkit: text
          name: subtitle
          label: 提示文案
          value: 'Page Not Found'
          help: 按纯文本显示。留空时使用“页面未找到”。
        - $formkit: attachment
          name: background
          label: 404 配图
          value: ''
          help: 留空使用首页第一屏背景；图片加载失败时回退到首页背景及主题内置插图。
