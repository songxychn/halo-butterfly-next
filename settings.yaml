apiVersion: v1alpha1
kind: Setting
metadata:
  name: halo-butterfly-next-setting
spec:
  forms:
    - group: base
      label: 基本设置
      formSchema:
        - $formkit: checkbox
          name: enable_seo
          label: 输出主题分享元数据与规范链接
          value: true
          help: 输出 Open Graph 及文章、自定义页面、首页第一页的 canonical。使用其他 SEO 插件时可关闭；描述和关键词由 Halo 提供。
        - $formkit: text
          name: metadata_name
          label: 作者用户名
          placeholder: 请填写作者的唯一标识（用户名）
          value: ""
          help: 可选。填写 Halo 用户名显示个人资料；留空或用户不存在时使用站点信息。
        - $formkit: text
          name: icp
          label: ICP 备案号
          placeholder: 请填写 ICP 备案号信息
          help: ICP 备案信息将展示在页脚中，不填不展示（示例：蜀ICP备xx号）
        - $formkit: text
          name: police
          label: 公网安备号
          placeholder: 请填写公网安备号信息
          help: 公网安备信息将展示在页脚中，不填不展示（示例：京公xxx号）
        - $formkit: date
          name: site_birthday
          label: 建站时间
          placeholder: 示例 2022-01-01 00:00
          help: 自定义博客的起始时间/安装时间，作为计算博客运行时间的参照值，不选择不显示
    #主题设置
    - group: style
      label: 主题设置
      formSchema:
        - $formkit: select
          name: mode
          label: 主题模式
          value: 'user'
          placeholder: 请填写主题颜色
          help: '设置博客的主题模式（自动/用户/浅色/深色），默认为用户模式，仅在用户模式下页面才有主题切换按钮，自动模式下根据时间自动切换'
          options:
            - value: 'auto'
              label: 自动模式
            - value: 'user'
              label: 用户模式
            - value: 'light'
              label: 浅色模式
            - value: 'dark'
              label: 深色模式
        - $formkit: select
          name: font_family
          label: 主题字体
          value: 'null'
          help: 当前预览版使用系统字体。旧版附带字体不再分发。
          options:
            - value: 'null'
              label: "系统字体"
        - $formkit: text
          name: body_background
          label: 全局背景（浅色）
          placeholder: 请填写 全局背景
          value: '#f7f9fe'
          help: 颜色值 默认值：#f7f9fe
          validation: required
    #加载设置
    - group: loading
      label: 加载设置
      formSchema:
        - $formkit: radio
          name: type
          label: 页面加载（Loading）
          help: 内置多种加载样式
          value: 'circle'
          options:
            - label: '转圈'
              value: 'circle'
            - label: '沙漏'
              value: 'hourglass'
            - label: '交叉线'
              value: 'cross_line'
            - label: '小圆点'
              value: 'dot'
          validation: required
        - $formkit: group
          label: 图片加载
          name: img
          value:
            preload: 'data:image/gif;base64,R0lGODdhAQABAPAAAMPDwwAAACwAAAAAAQABAAACAkQBADs='
            err: 'data:image/gif;base64,R0lGODdhAQABAPAAAMPDwwAAACwAAAAAAQABAAACAkQBADs='
            random_enable: false
            random_link: ''
          children:
            - $formkit: attachment
              name: preload
              label: 预加载图
              placeholder: 请填写 预加载图片
              value: 'data:image/gif;base64,R0lGODdhAQABAPAAAMPDwwAAACwAAAAAAQABAAACAkQBADs='
              help: 预加载图片，默认 data:image/gif;base64,R0lGODdhAQABAPAAAMPDwwAAACwAAAAAAQABAAACAkQBADs=
              validation: required
            - $formkit: attachment
              name: err
              label: 加载失败图
              placeholder: 请填写 加载失败图片
              value: 'data:image/gif;base64,R0lGODdhAQABAPAAAMPDwwAAACwAAAAAAQABAAACAkQBADs='
              help: 加载失败图片，默认 data:image/gif;base64,R0lGODdhAQABAPAAAMPDwwAAACwAAAAAAQABAAACAkQBADs=
              validation: required
            - $formkit: radio
              name: random_enable
              label: 启用随机图片
              help: 是否启用随机图API（必须先配置 API），开启后将使用随机图填充没有设置封面的，未开启时使用主题内置的封面图
              value: false
              validation: required
              options:
                - label: 启用
                  value: true
                - label: 禁用
                  value: false
            - $formkit: text
              name: random_link
              label: 随机图片链接
              placeholder: 请正确填写 随机图片链接
              value: ''
              help: 自定义随机图API，用于填充没有设置封面的 ，免费 API 不会一直可用，请知悉
              validation: url
    #导航设置
    - group: nav
      label: 导航设置
      formSchema:
        - $formkit: radio
          name: fixed
          label: 滚动后始终固定导航
          help: 关闭时滚动超过导航高度后向下隐藏、向上显示（上游 nav.fixed 默认关闭）。开启后导航始终吸顶可见。
          value: false
          options:
            - label: 启用
              value: true
            - label: 禁用
              value: false
        - $formkit: attachment
          name: logo
          label: 导航 Logo
          placeholder: 可选，留空不显示
          value: ""
          help: 显示在站点标题左侧。留空不显示图片。
        - $formkit: radio
          name: display_title
          label: 显示站点标题
          help: 关闭后导航不显示站点名，可只保留 Logo。
          value: true
          options:
            - label: 启用
              value: true
            - label: 禁用
              value: false
        - $formkit: radio
          name: display_post_title
          label: 滚动后显示文章标题
          help: 仅文章页。开启且导航进入滚动固定态时，用文章标题替换站点名。
          value: true
          options:
            - label: 启用
              value: true
            - label: 禁用
              value: false
        - $formkit: group
          name: font_color
          label: 导航栏默认字体颜色
          help: 支持rgba颜色值和十六进制颜色值
          value:
            light: rgba(238, 238, 238, 1)
            dark: rgba(255, 255, 255, 0.7)
          children:
            - $formkit: text
              name: light
              label: 浅色
              value: ""
              help: 默认值：rgba(238, 238, 238, 1)
              validation: required
            - $formkit: text
              name: dark
              label: 暗色
              value: ""
              help: 默认值：rgba(255, 255, 255, 0.7)
              validation: required
        - $formkit: group
          name: active_font_color
          label: 导航栏滚动悬浮字体颜色
          help: 支持rgba颜色值和十六进制颜色值
          value:
            light: rgb(76, 73, 72)
            dark: rgba(255, 255, 255, 0.7)
          children:
            - $formkit: text
              name: light
              label: 浅色
              value: ""
              help: 默认值：rgb(76, 73, 72)
              validation: required
            - $formkit: text
              name: dark
              label: 暗色
              value: ""
              help: 默认值：rgba(255, 255, 255, 0.7)
              validation: required
        - $formkit: group
          name: active_hover_font_color
          label: 导航栏滚动悬浮鼠标移入字体颜色
          help: 支持rgba颜色值和十六进制颜色值（默认主题色）
          value:
            light: var(--theme)
            dark: var(--theme)
          children:
            - $formkit: text
              name: light
              label: 浅色
              value: ""
              help: 默认值：var(--theme)
              validation: required
            - $formkit: text
              name: dark
              label: 暗色
              value: ""
              help: 默认值：var(--theme)
              validation: required
        - $formkit: group
          name: active_background_color
          label: 导航栏滚动悬浮背景颜色
          help: 支持rgba颜色值和十六进制颜色值
          value:
            light: rgba(255, 255, 255, .8)
            dark: rgba(18, 18, 18, .8)
          children:
            - $formkit: text
              name: light
              label: 浅色
              value: ""
              help: 默认值：rgba(255, 255, 255, .8)
              validation: required
            - $formkit: text
              name: dark
              label: 暗色
              value: ""
              help: 默认值：rgba(18, 18, 18, .8)
              validation: required
        - $formkit: group
          name: active_shadow
          label: 导航栏滚动悬浮阴影
          help: 支持rgba颜色值和十六进制颜色值
          value:
            light: 0 5px 6px -5px rgba(133, 133, 133, .6)
            dark: 0 5px 6px -5px rgba(133, 133, 133, 0)
          children:
            - $formkit: text
              name: light
              label: 浅色
              value: ""
              help: 默认值：0 5px 6px -5px rgba(133, 133, 133, .6)
              validation: required
            - $formkit: text
              name: dark
              label: 暗色
              value: ""
              help: 默认值：0 5px 6px -5px rgba(133, 133, 133, 0)
              validation: required
        - $formkit: group
          name: dropdown_background_color
          label: 导航栏二级下拉背景颜色
          help: 支持rgba颜色值和十六进制颜色值
          value:
            light: rgba(255, 255, 255)
            dark: rgba(18, 18, 18)
          children:
            - $formkit: text
              name: light
              label: 浅色
              value: ""
              help: 默认值：rgba(255, 255, 255)
              validation: required
            - $formkit: text
              name: dark
              label: 暗色
              value: ""
              help: 默认值：rgba(18, 18, 18)
              validation: required
        - $formkit: group
          name: dropdown_font_color
          label: 导航栏二级下拉字体颜色
          help: 支持rgba颜色值和十六进制颜色值
          value:
            light: rgba(76, 73, 72, 1)
            dark: rgba(255, 255, 255, 0.7)
          children:
            - $formkit: text
              name: light
              label: 浅色
              value: ""
              help: 默认值：rgba(76, 73, 72, 1)
              validation: required
            - $formkit: text
              name: dark
              label: 暗色
              value: ""
              help: 默认值：rgba(255, 255, 255, 0.7)
              validation: required
        - $formkit: group
          name: dropdown_hover_font_color
          label: 导航栏hover二级下拉字体颜色
          help: 支持rgba颜色值和十六进制颜色值
          value:
            light: rgb(244 244 244)
            dark: rgb(54 50 50)
          children:
            - $formkit: text
              name: light
              label: 浅色
              value: ""
              help: 默认值：rgb(244 244 244)
              validation: required
            - $formkit: text
              name: dark
              label: 暗色
              value: ""
              help: 默认值：rgb(54 50 50)
              validation: required
    #侧边栏设置
    - group: aside
      label: 侧边栏设置
      formSchema:
        - $formkit: radio
          name: enable
          label: 启用侧边栏（全局）
          help: 是否启用侧边栏，关闭后所有页面都没有侧边栏（优先级高于页面元数据）
          value: true
          options:
            - label: 启用
              value: true
            - label: 禁用
              value: false
        - $formkit: radio
          name: position
          label: 侧边栏位置
          help: 侧边栏展示位置，左边或右边
          value: aside-right
          options:
            - label: 左边
              value: aside-left
            - label: 右边
              value: aside-right
        - $formkit: group
          name: button
          label: 侧边栏按钮
          value:
            name: '上游 Halo 移植项目'
            link: 'https://github.com/dhjddcn/halo-theme-butterfly'
          children:
            - $formkit: text
              name: name
              label: 名称
              placeholder: 请填写 按钮名称
              help: 支持html代码片段
              value: ""
              validation: required
            - $formkit: text
              name: link
              label: 链接
              placeholder: 请填写 按钮链接
              value: ""
              validation: required
        - $formkit: repeater
          name: social
          label: 社交账号
          value:
            - name: 'Github'
              icon: '<i class="fa-brands fa-github"></i>'
              link: 'https://github.com/dhjddcn'
          children:
            - $formkit: text
              name: name
              label: 名称
              placeholder: 请填写 账号名称
              value: ""
              validation: required
            - $formkit: text
              name: icon
              label: 图标
              placeholder: 请填写 图标
              value: ""
              validation: required
            - $formkit: text
              name: link
              label: 链接
              placeholder: 请填写 链接
              value: ""
              validation: required
        - $formkit: textarea
          rows: 5
          name: notice
          label: 侧边栏公告
          placeholder: 请填写 侧边栏公告内容
          value: '好博客，一定要 分享出去 呀~'
          help: 侧边栏公告内容, 支持 html 代码片段
        - $formkit: group
          name: card_recent_post
          label: 最近文章
          help: 对应上游 aside.card_recent_post。不含 sort_order、card_archives、card_newest_comments。
          value:
            enable: true
            limit: 5
            sort: date
          children:
            - $formkit: radio
              name: enable
              label: 显示最近文章卡片
              help: 对应上游 aside.card_recent_post.enable（默认开启）。关闭后侧栏不渲染该卡片。
              value: true
              options:
                - label: 启用
                  value: true
                - label: 禁用
                  value: false
            - $formkit: number
              name: limit
              label: 显示数量
              help: 对应上游 aside.card_recent_post.limit（默认 5）。上游 0 表示全部；Halo 最多取 20 篇（填 0 或大于 20 时按 20）。
              value: 5
              min: 0
              max: 20
            - $formkit: radio
              name: sort
              label: 排序字段
              help: 对应上游 aside.card_recent_post.sort。date 用 publishTime，updated 用 lastModifyTime。不含 sort_order。
              value: date
              options:
                - label: 发布时间
                  value: date
                - label: 更新时间
                  value: updated
        - $formkit: radio
          name: enable_category
          label: 启用侧边栏分类
          help: 是否启用侧边栏分类（只随机展示 5 个分类，不支持二级分类）
          value: true
          options:
            - label: 启用
              value: true
            - label: 禁用
              value: false
        - $formkit: radio
          name: enable_tags
          label: 启用侧边栏标签
          help: 是否启用侧边栏标签（只随机展示 25 个标签）
          value: true
          options:
            - label: 启用
              value: true
            - label: 禁用
              value: false
        - $formkit: radio
          name: enable_custom
          label: 启用侧边栏自定义模块
          help: 是否启用自定义模块
          value: false
          options:
            - label: 启用
              value: true
            - label: 禁用
              value: false
        - $formkit: radio
          name: enable_webInfo
          label: 启用侧边栏网站资讯
          help: 是否启用侧边栏网站资讯
          value: true
          options:
            - label: 启用
              value: true
            - label: 禁用
              value: false
    #卡片设置
    - group: card
      label: 卡片设置
      formSchema:
        - $formkit: text
          name: radius
          label: 卡片圆角
          placeholder: 请填写 卡片圆角
          value: 15px
          help: 卡片圆角，像素或百分比，默认值： 15px
          validation: required
        - $formkit: text
          name: shadow
          label: 卡片阴影
          placeholder: 请填写 卡片阴影
          value: 0 3px 8px 6px rgba(7,17,27,0.05)
          help: 卡片阴影，默认值： 0 3px 8px 6px rgba(7,17,27,0.05)
          validation: required
    #首页设置
    - group: index
      label: 首页设置
      formSchema:
        - $formkit: radio
          name: enable_above
          label: 启用第一屏
          help: 启用首页第一屏
          value: true
          options:
            - label: 启用
              value: true
            - label: 禁用
              value: false
        - $formkit: attachment
          name: above_background
          label: 第一屏背景图
          placeholder: 请填写 第一屏背景图
          value: '/themes/halo-butterfly-next/assets/images/above.svg'
          help: 如果全局背景图设置为图片链接，则此处背景图将不生效
          validation: required
        - $formkit: text
          name: top_img_height
          label: 首页第一屏高度
          placeholder: 例如 100vh、60vh、500px
          value: ""
          help: 留空为全屏 100vh，对应上游 index_top_img_height。
        - $formkit: text
          name: site_info_top
          label: 首页标题垂直位置
          placeholder: 例如 43%、50%、20%
          value: ""
          help: 留空为垂直居中。对应上游 index_site_info_top。
        - $formkit: radio
          name: enable_subtitle
          label: 启用首页字幕
          help: 关闭后不显示字幕，也不请求随机文案。默认开启以保留旧版本行为。
          value: true
          options:
            - label: 启用
              value: true
            - label: 禁用
              value: false
        - $formkit: radio
          name: subtitle_effect
          label: 启用字幕打字效果
          help: 关闭后静态显示第一条文案；随机来源开启时显示返回文案，失败回退到自定义第一条。
          value: true
          options:
            - label: 启用
              value: true
            - label: 禁用
              value: false
        - $formkit: textarea
          rows: 5
          name: typewriter_custom_text
          label: 首页字幕文案
          placeholder: 请填写 首页字幕文案
          help: 多条文案用 |&| 分隔；关闭打字效果时显示第一条。留空不显示提示文字；随机来源失败时回退到此处文案。
          value: '欢迎使用Butterfly主题，一个简洁、优雅的主题~'
        - $formkit: radio
          name: enable_typewriter_random_text
          label: 启用随机打字机文案
          help: 是否启用随文案API（必须先配置 API），启用后将显示随机API文案，禁用时显示打字机文案
          value: false
          options:
            - label: 启用
              value: true
            - label: 禁用
              value: false
        - $formkit: text
          name: typewriter_random_api
          label: 随机文案链接（api）
          placeholder: 请正确填写 随机文案链接（api）
          value: ''
          help: 自定义随机文案API(推荐使用一言,返回格式设置为TEXT格式，json需要配置取值格式)，免费 API 不会一直可用，请知悉
        - $formkit: text
          name: typewriter_api_value_format
          label: 随机文案api取值格式
          value: ''
          help: 如果使用的随机文案API返回格式不是TEXT格式，Json请自定义取值格式，如：data.content
        - $formkit: radio
          name: post_layout
          label: 文章布局方式
          help: 文章布局方式 提供（列表、平铺）两种，仅首页生效
          value: list
          options:
            - label: 列表
              value: list
            - label: 平铺
              value: tile
        - $formkit: group
          name: index_post_content
          label: 首页列表摘要
          help: 对应上游 Butterfly index_post_content。method：false 不显示；1 仅手动摘要；2 优先手动摘要否则截断正文；3 截断正文（默认）。length 仅 method 为 2 或 3 时生效，默认 500。不做逐页覆盖。
          value:
            method: "3"
            length: 500
          children:
            - $formkit: radio
              name: method
              label: 摘要方式
              help: 对应上游 Butterfly index_post_content.method。false 不显示摘要；1 仅手动摘要（Halo spec.excerpt.raw）；2 有手动摘要则用之，否则截断正文；3 始终截断正文（默认）。
              value: "3"
              options:
                - label: 不显示
                  value: "false"
                - label: 仅手动摘要
                  value: "1"
                - label: 优先手动摘要，否则截断正文
                  value: "2"
                - label: 截断正文
                  value: "3"
            - $formkit: number
              name: length
              label: 截断长度
              help: 对应上游 Butterfly index_post_content.length。仅 method 为 2 或 3 时生效。对齐 hexo-util truncate（省略号计入长度），默认 500。
              value: 500
              min: 0
        - $formkit: group
          name: post_meta
          label: 首页列表元信息
          help: 对应上游 Butterfly post_meta.page。控制首页/分类/标签列表卡片上的日期、分类与标签。date_format 与文章页 post.post_meta.date_format 独立。
          value:
            date_type: created
            date_format: date
            categories: true
            tags: true
            label: true
          children:
            - $formkit: radio
              name: date_type
              label: 日期显示
              help: 对应上游 post_meta.page.date_type。created 只发布日（默认），updated 只更新日，both 两者。
              value: created
              options:
                - label: 仅发布日
                  value: created
                - label: 仅更新日
                  value: updated
                - label: 发布日与更新日
                  value: both
            - $formkit: radio
              name: date_format
              label: 日期格式
              help: 对应上游 Butterfly post_meta.page.date_format。date 为 yyyy-MM-dd 绝对日期（默认），relative 为相对时间（x 分钟前 / x 小时前 / x 天前）。与文章页 post.post_meta.date_format 独立。
              value: date
              options:
                - label: 绝对日期
                  value: date
                - label: 相对时间
                  value: relative
            - $formkit: radio
              name: categories
              label: 显示分类
              help: 对应上游 post_meta.page.categories。关闭后即使有分类也不渲染。
              value: true
              options:
                - label: 显示
                  value: true
                - label: 隐藏
                  value: false
            - $formkit: radio
              name: tags
              label: 显示标签
              help: 对应上游 post_meta.page.tags。关闭后即使有标签也不渲染。
              value: true
              options:
                - label: 显示
                  value: true
                - label: 隐藏
                  value: false
            - $formkit: radio
              name: label
              label: 显示日期前缀
              help: 对应上游 post_meta.page.label。关闭后不显示「发布于」「更新于」等前缀。
              value: true
              options:
                - label: 显示
                  value: true
                - label: 隐藏
                  value: false
    #文章封面（首页列表）
    - group: cover
      label: 文章封面
      formSchema:
        - $formkit: radio
          name: index_enable
          label: 首页列表显示封面
          help: 对应上游 Butterfly cover.index_enable（默认开启）。关闭后首页 list/tile 不渲染封面。当前分类/标签页共用 list 模板，亦跟随此开关（对齐上游 indexPostUI；归档封面由 cover.archives_enable 控制，本项不含）。
          value: true
          options:
            - label: 启用
              value: true
            - label: 禁用
              value: false
        - $formkit: attachment
          name: default_cover
          label: 默认封面
          placeholder: 可选，文章未设置封面时使用
          value: ""
          help: 对应上游 cover.default_cover。留空对齐上游 null。上游可为 URL 数组并由 random_cover.js 去重随机；Halo 此项为单张附件/URL。优先级：文章封面 > 本默认封面 > loading.img.random_enable。
        - $formkit: radio
          name: aside_enable
          label: 侧栏最近文章显示封面
          help: 对应上游 Butterfly cover.aside_enable（默认开启）。只作用于侧栏最近文章卡片的缩略图；关闭后该卡片以 no-cover 展示且不输出缩略图。不做归档封面（cover.archives_enable）。
          value: true
          options:
            - label: 启用
              value: true
            - label: 禁用
              value: false
        - $formkit: radio
          name: archives_enable
          label: 归档时间轴显示封面
          help: 对应上游 Butterfly cover.archives_enable（默认开启）。只作用于归档页年-月时间轴条目的封面；关闭后不渲染封面并以 no-cover 展示。不做首页 list/tile 或侧栏最近文章封面。
          value: true
          options:
            - label: 启用
              value: true
            - label: 禁用
              value: false
    #文章设置
    - group: post
      label: 文章设置
      formSchema:
        - $formkit: radio
          name: enable_above
          label: 启用第一屏
          help: 启用首页第一屏
          value: true
          options:
            - label: 启用
              value: true
            - label: 禁用
              value: false
        - $formkit: group
          name: post_meta
          label: 文章页元信息
          help: 对应上游 Butterfly post_meta.post。date_format 与首页列表 index.post_meta.date_format 独立。
          value:
            position: left
            date_type: both
            date_format: date
            categories: true
            tags: true
            label: true
          children:
            - $formkit: radio
              name: position
              label: 元信息对齐
              help: 对应上游 post_meta.post.position，可选 left / center。默认 left。
              value: left
              options:
                - label: 左对齐
                  value: left
                - label: 居中
                  value: center
            - $formkit: radio
              name: date_type
              label: 日期显示
              help: 对应上游 post_meta.post.date_type。created 只发布日，updated 只更新日，both 两者。
              value: both
              options:
                - label: 发布日与更新日
                  value: both
                - label: 仅发布日
                  value: created
                - label: 仅更新日
                  value: updated
            - $formkit: radio
              name: date_format
              label: 日期格式
              help: 对应上游 Butterfly post_meta.post.date_format。date 为 yyyy-MM-dd 绝对日期（默认），relative 为相对时间（x 分钟前 / x 小时前 / x 天前）。与列表 index.post_meta.date_format 独立。
              value: date
              options:
                - label: 绝对日期
                  value: date
                - label: 相对时间
                  value: relative
            - $formkit: radio
              name: categories
              label: 显示分类
              help: 对应上游 post_meta.post.categories。关闭后即使有分类也不渲染。
              value: true
              options:
                - label: 显示
                  value: true
                - label: 隐藏
                  value: false
            - $formkit: radio
              name: tags
              label: 显示标签
              help: 对应上游 post_meta.post.tags。关闭后即使有标签也不渲染。
              value: true
              options:
                - label: 显示
                  value: true
                - label: 隐藏
                  value: false
            - $formkit: radio
              name: label
              label: 显示日期前缀
              help: 对应上游 post_meta.post.label。关闭后不显示「发布于」「更新于」等前缀。
              value: true
              options:
                - label: 显示
                  value: true
                - label: 隐藏
                  value: false
        - $formkit: radio
          name: post_pagination
          label: 文章上下篇
          help: 对应上游 Butterfly post_pagination（默认 1）。false 不渲染。1 / 2 对齐 layout/includes/pagination.pug：值为 2 时不调换 Hexo page.prev 与 page.next，否则对调。Halo postFinder.cursor.previous 为较早发布（对应 Hexo page.next），next 为较晚发布（对应 Hexo page.prev）。默认 1 时左侧上一篇为较早、右侧下一篇为较晚。标题与链接文本转义。不做 related_post、逐页覆盖。
          value: "1"
          options:
            - label: 关闭
              value: "false"
            - label: 1（默认）：上一篇较早、下一篇较新
              value: "1"
            - label: 2：上一篇较新、下一篇较早
              value: "2"
        - $formkit: group
          name: noticeOutdate
          label: 文章过期提醒
          help: 对应上游 Butterfly noticeOutdate（_config.yml / outdate-notice.pug / main.js addPostOutdateNotice，5.7.0 f223b188）。默认关闭。enable 关闭不渲染；天数 Math.floor((now - 更新时间) / 86400000) ≥ limit_day 才显示；更新时间取 status.lastModifyTime，无则 spec.publishTime。position top 在正文前、bottom 在正文后。style simple / flat（该 SHA 默认 flat）。文案前后缀与天数用 th:text 拼接。仅文章页；不做 related_post、wordcount、逐页覆盖。
          value:
            enable: false
            style: flat
            limit_day: 365
            position: top
            message_prev: It has been
            message_next: days since the last update, the content of the article may be outdated.
          children:
            - $formkit: radio
              name: enable
              label: 启用过期提醒
              help: 对应上游 noticeOutdate.enable（默认 false）。关闭不渲染提醒。
              value: false
              options:
                - label: 启用
                  value: true
                - label: 禁用
                  value: false
            - $formkit: radio
              name: style
              label: 样式
              help: 对应上游 noticeOutdate.style。simple 为纯色条；flat 为左侧色条加警告图标。该 SHA 默认 flat。
              value: flat
              options:
                - label: simple
                  value: simple
                - label: flat（默认）
                  value: flat
            - $formkit: number
              name: limit_day
              label: 超限天数
              help: 对应上游 noticeOutdate.limit_day（默认 365）。对齐 btf.diffDate：Math.floor((now - 更新时间) / 86400000) ≥ 本值才显示。
              value: 365
              min: 0
            - $formkit: radio
              name: position
              label: 位置
              help: 对应上游 noticeOutdate.position（默认 top）。top 插在正文前，bottom 插在正文后。
              value: top
              options:
                - label: 顶部（正文前）
                  value: top
                - label: 底部（正文后）
                  value: bottom
            - $formkit: text
              name: message_prev
              label: 文案前缀
              help: 对应上游 noticeOutdate.message_prev。与天数、后缀用空格拼接，可见文本 th:text。
              value: It has been
            - $formkit: text
              name: message_next
              label: 文案后缀
              help: 对应上游 noticeOutdate.message_next。可见文本 th:text，不做 HTML。
              value: days since the last update, the content of the article may be outdated.
        - $formkit: group
          name: related_post
          label: 相关文章
          help: 对应上游 Butterfly related_post（_config.yml / related_post.js / post.pug，5.7.0 f223b188）。默认 enable true、limit 6、date_type created。enable 关闭不渲染。无标签不渲染。按当前文章标签 listByTag 收集候选，客户端去重截断到 limit。date_type created 显示发布时间，其余显示更新时间。仅文章页，插在上下篇之后、评论之前。标题 th:text。不做 footer、reward、逐页覆盖。
          value:
            enable: true
            limit: 6
            date_type: created
          children:
            - $formkit: radio
              name: enable
              label: 启用相关文章
              help: 对应上游 related_post.enable（默认 true）。关闭不渲染相关文章。
              value: true
              options:
                - label: 启用
                  value: true
                - label: 禁用
                  value: false
            - $formkit: number
              name: limit
              label: 显示数量
              help: 对应上游 related_post.limit（默认 6）。对齐 helper 的 limit || 6，非正数回退 6。
              value: 6
              min: 1
            - $formkit: radio
              name: date_type
              label: 日期类型
              help: 对应上游 related_post.date_type（created / updated，默认 created）。created 显示发布时间，其余显示更新时间。
              value: created
              options:
                - label: created（发布）
                  value: created
                - label: updated（更新）
                  value: updated
    #文章目录（对齐上游 toc.number / expand / style_simple / scroll_percent）
    - group: toc
      label: 文章目录
      formSchema:
        - $formkit: radio
          name: number
          label: 目录序号
          help: 对应上游 Butterfly toc.number（_config.yml / card_post_toc.pug list_number，5.7.0 f223b188）。默认开启。关闭后目录项不带 1. / 1.1. 序号。不做 toc.post / toc.page、逐页 toc_number。
          value: true
          options:
            - label: 显示
              value: true
            - label: 隐藏
              value: false
        - $formkit: radio
          name: expand
          label: 默认展开
          help: 对应上游 toc.expand（默认关闭）。开启后目录加 is-expand、子级全部展开；关闭时仅当前项父级展开。不做逐页 toc_expand。
          value: false
          options:
            - label: 展开
              value: true
            - label: 折叠（默认）
              value: false
        - $formkit: radio
          name: style_simple
          label: 简洁侧栏
          help: 对应上游 toc.style_simple（默认关闭，仅文章页）。开启后文章侧栏只保留目录，不渲染最近文章等其它卡片。不做 related_post。
          value: false
          options:
            - label: 仅目录
              value: true
            - label: 目录与其它卡片（默认）
              value: false
        - $formkit: radio
          name: scroll_percent
          label: 滚动百分比
          help: 对应上游 toc.scroll_percent（默认开启）。开启后目录标题显示阅读进度百分比；关闭不渲染、不更新。不做 rightside_scroll_percent。
          value: true
          options:
            - label: 显示
              value: true
            - label: 隐藏
              value: false
    #归档设置
    - group: archives
      label: 归档设置
      formSchema:
        - $formkit: radio
          name: enable_above
          label: 启用第一屏
          help: 启用首页第一屏
          value: true
          options:
            - label: 启用
              value: true
            - label: 禁用
              value: false
        - $formkit: attachment
          name: above_background
          label: 第一屏背景图
          placeholder: 请填写 第一屏背景图
          value: '/themes/halo-butterfly-next/assets/images/above.svg'
          help: 如果全局背景图设置为图片链接，则此处背景图将不生效
          validation: required
    #标签设置
    - group: tags
      label: 标签设置
      formSchema:
        - $formkit: radio
          name: enable_above
          label: 启用第一屏
          help: 启用首页第一屏
          value: true
          options:
            - label: 启用
              value: true
            - label: 禁用
              value: false
        - $formkit: attachment
          name: above_background
          label: 第一屏背景图
          placeholder: 请填写 第一屏背景图
          value: '/themes/halo-butterfly-next/assets/images/above.svg'
          help: 如果全局背景图设置为图片链接，则此处背景图将不生效
          validation: required
    #分类设置
    - group: categories
      label: 分类设置
      formSchema:
        - $formkit: radio
          name: enable_above
          label: 启用第一屏
          help: 启用首页第一屏
          value: true
          options:
            - label: 启用
              value: true
            - label: 禁用
              value: false
        - $formkit: attachment
          name: above_background
          label: 第一屏背景图
          placeholder: 请填写 第一屏背景图
          value: '/themes/halo-butterfly-next/assets/images/above.svg'
          help: 如果全局背景图设置为图片链接，则此处背景图将不生效
          validation: required
    #渲染设置
    - group: render
      label: 渲染设置
      formSchema:
        - $formkit: radio
          name: enable_h_icon
          label: 启用标题图标（全局）
          help: 启用h1~h6标题左边图标（元数据可配置）
          value: true
          options:
            - label: 启用
              value: true
            - label: 禁用
              value: false
        - $formkit: radio
          name: enable_code
          id: enable_code
          key: enable_code
          label: 启用代码块
          help: 如果安装其他代码块插件，请关闭此功能！！！
          value: true
          options:
            - label: 启用
              value: true
            - label: 禁用
              value: false
        - $formkit: radio
          name: enable_code_title
          if: $get(enable_code).value
          label: 启用代码标题
          help: 对应上游 code_blocks.language。关闭后不显示语言标题。
          value: true
          options:
            - label: 启用
              value: true
            - label: 禁用
              value: false
        - $formkit: radio
          name: enable_code_hr
          if: $get(enable_code).value
          label: 启用代码标题分割线
          help: 启用代码标题和内容之间的分割线，不展示时会更加简洁
          value: true
          options:
            - label: 启用
              value: true
            - label: 禁用
              value: false
        - $formkit: radio
          name: enable_code_line
          if: $get(enable_code).value
          label: 启用代码行号
          help: 启用代码块行号功能
          value: true
          options:
            - label: 启用
              value: true
            - label: 禁用
              value: false
        - $formkit: radio
          name: enable_code_copy
          if: $get(enable_code).value
          label: 启用代码复制
          help: 对应上游 code_blocks.copy。关闭后不显示复制按钮。
          value: true
          options:
            - label: 启用
              value: true
            - label: 禁用
              value: false
        - $formkit: radio
          name: enable_code_expander
          if: $get(enable_code).value
          label: 代码块默认折叠
          help: 对应上游 code_blocks.shrink（false / true / none）。false：有折叠按钮且初始展开；true：有按钮且初始折叠（closed）；none：不显示折叠按钮。默认 false，与上游一致。旧版布尔 true（有按钮、初始展开）运行时映射为 false；旧版布尔 false（无按钮）映射为 none，已有站点不会因升级变成初始折叠。
          value: "false"
          options:
            - label: 初始展开（上游 false）
              value: "false"
            - label: 初始折叠（上游 true）
              value: "true"
            - label: 不显示按钮（上游 none）
              value: "none"
        - $formkit: radio
          name: enable_code_mac_style
          if: $get(enable_code).value
          label: 启用 mac 风格圆点
          help: 对应上游 code_blocks.macStyle。默认关闭，与上游一致；开启后显示窗口圆点。
          value: false
          options:
            - label: 启用
              value: true
            - label: 禁用
              value: false
        - $formkit: radio
          name: code_height_limit
          if: $get(enable_code).value
          label: 代码块高度限制
          help: 对应上游 code_blocks.height_limit。默认不限制；200/400 为像素上限。
          value: false
          options:
            - label: 不限制
              value: false
            - label: 200px
              value: 200
            - label: 400px
              value: 400
        - $formkit: radio
          name: enable_code_word_wrap
          if: $get(enable_code).value
          label: 启用代码块自动换行
          help: 对应上游 code_blocks.word_wrap。默认关闭；关闭时横向滚动，开启时长行换行。
          value: false
          options:
            - label: 启用
              value: true
            - label: 禁用
              value: false
        - $formkit: radio
          name: enable_code_fullpage
          if: $get(enable_code).value
          label: 启用代码块全屏
          help: 对应上游 code_blocks.fullpage。默认关闭；开启后工具栏显示全屏按钮。
          value: false
          options:
            - label: 启用
              value: true
            - label: 禁用
              value: false
        - $formkit: select
          name: code_theme_light
          if: $get(enable_code).value
          label: 代码块主题（浅色）随着系统主题变化
          value: one-light
          options:
            - value: "one-dark"
              label: "one-dark"
            - value: "one-light"
              label: "one-light"
            - value: "a11y-dark"
              label: "a11y-dark"
            - value: "atom-dark"
              label: "atom-dark"
            - value: "base16-ateliersulphurpool.light"
              label: "base16-ateliersulphurpool.light"
            - value: "cb"
              label: "cb"
            - value: "coldark-cold"
              label: "coldark-cold"
            - value: "coldark-dark"
              label: "coldark-dark"
            - value: "coy-without-shadows"
              label: "coy-without-shadows"
            - value: "darcula"
              label: "darcula"
            - value: "dracula"
              label: "dracula"
            - value: "duotone-dark"
              label: "duotone-dark"
            - value: "duotone-earth"
              label: "duotone-earth"
            - value: "duotone-forest"
              label: "duotone-forest"
            - value: "duotone-light"
              label: "duotone-light"
            - value: "duotone-sea"
              label: "duotone-sea"
            - value: "duotone-space"
              label: "duotone-space"
            - value: "ghcolors"
              label: "ghcolors"
            - value: "gruvbox-dark"
              label: "gruvbox-dark"
            - value: "gruvbox-light"
              label: "gruvbox-light"
            - value: "holi-theme"
              label: "holi-theme"
            - value: "hopscotch"
              label: "hopscotch"
            - value: "lucario"
              label: "lucario"
            - value: "material-dark"
              label: "material-dark"
            - value: "material-light"
              label: "material-light"
            - value: "material-oceanic"
              label: "material-oceanic"
            - value: "night-owl"
              label: "night-owl"
            - value: "nord"
              label: "nord"
