            link: 'https://github.com/dhjddcn/halo-theme-butterfly'
          children:
            - $formkit: text
              name: name
              label: 名称
              placeholder: 请填写 按钮名称
              help: 支持html代码片段
              value: ""
              validation: required
            - $formkit: text
              name: link
              label: 链接
              placeholder: 请填写 按钮链接
              value: ""
              validation: required
