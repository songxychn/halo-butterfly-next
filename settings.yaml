                  value: created
                - label: 仅更新日
                  value: updated
                - label: 发布日与更新日
                  value: both
            - $formkit: radio
              name: date_format
              label: 日期格式
              help: 对应上游 Butterfly post_meta.page.date_format。date 为 yyyy-MM-dd 绝对日期（默认），relative 为相对时间（x 分钟前 / x 小时前 / x 天前）。与文章页 post.post_meta.date_format 独立。
              value: date
              options:
                - label: 绝对日期
                  value: date
                - label: 相对时间
                  value: relative
            - $formkit: radio
              name: categories
              label: 显示分类
              help: 对应上游 post_meta.page.categories。关闭后即使有分类也不渲染。
              value: true
              options:
                - label: 显示
                  value: true
                - label: 隐藏
                  value: false
            - $formkit: radio
              name: tags
              label: 显示标签
              help: 对应上游 post_meta.page.tags（默认关闭）。关闭后即使有标签也不渲染。
              value: false
              options:
                - label: 显示
