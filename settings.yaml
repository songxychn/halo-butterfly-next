                - label: 左对齐
                  value: left
                - label: 居中
                  value: center
            - $formkit: radio
              name: date_type
              label: 日期显示
              help: 对应上游 post_meta.post.date_type。created 只发布日，updated 只更新日，both 两者。
              value: both
              options:
                - label: 发布日与更新日
                  value: both
                - label: 仅发布日
                  value: created
                - label: 仅更新日
                  value: updated
