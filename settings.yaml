              name: style
              label: 样式
              help: 对应上游 noticeOutdate.style。simple 为纯色条；flat 为左侧色条加警告图标。该 SHA 默认 flat。
              value: flat
              options:
                - label: simple
                  value: simple
                - label: flat（默认）
                  value: flat
            - $formkit: number
              name: limit_day
              label: 超限天数
              help: 对应上游 noticeOutdate.limit_day（默认 365）。对齐 btf.diffDate：Math.floor((now - 更新时间) / 86400000) ≥ 本值才显示。
              value: 365
              min: 0
            - $formkit: radio
              name: position
              label: 位置
              help: 对应上游 noticeOutdate.position（默认 top）。top 插在正文前，bottom 插在正文后。
              value: top
              options:
                - label: 顶部（正文前）
                  value: top
                - label: 底部（正文后）
                  value: bottom
            - $formkit: text
              name: message_prev
              label: 文案前缀
              help: 对应上游 noticeOutdate.message_prev。与天数、后缀用空格拼接，可见文本 th:text。
              value: It has been
            - $formkit: text
              name: message_next
              label: 文案后缀
              help: 对应上游 noticeOutdate.message_next。可见文本 th:text，不做 HTML。
              value: days since the last update, the content of the article may be outdated.
        - $formkit: group
          name: related_post
          label: 相关文章
          help: 对应上游 Butterfly related_post（_config.yml / related_post.js / post.pug，5.7.0 f223b188）。默认 enable true、limit 6、date_type created。enable 关闭不渲染。无标签不渲染。按共同标签数量优先推荐，同等相关度随机展示；排除当前文章及重复项，再截断到 limit。date_type created 显示发布时间，其余显示更新时间。仅文章页，插在上下篇之后、评论之前。标题 th:text。不做 footer、reward、逐页覆盖。
          value:
            enable: true
            limit: 6
            date_type: created
          children:
            - $formkit: radio
              name: enable
              label: 启用相关文章
              help: 对应上游 related_post.enable（默认 true）。关闭不渲染相关文章。
              value: true
              options:
                - label: 启用
                  value: true
                - label: 禁用
                  value: false
            - $formkit: number
              name: limit
              label: 显示数量
              help: 对应上游 related_post.limit（默认 6）。对齐 helper 的 limit || 6，非正数回退 6。
              value: 6
              min: 1
            - $formkit: radio
              name: date_type
              label: 日期类型
              help: 对应上游 related_post.date_type（created / updated，默认 created）。created 显示发布时间，其余显示更新时间。
              value: created
              options:
                - label: created（发布）
                  value: created
                - label: updated（更新）
                  value: updated
        - $formkit: group
          name: post_copyright
          label: 文章版权
          help: 对应上游 Butterfly post_copyright（_config.yml / layout/includes/post/post-copyright.pug，5.7.0 f223b188）。默认 enable true、decode false、author_href 空、license CC BY-NC-SA 4.0、license_url 知识共享 4.0 链接。仅显式关闭 enable 才不渲染。空 author_href 回退站点 URL。可见文本 th:text，无新增 th:utext。仅文章页。可在单篇元数据中覆盖版权开关。
          value:
            enable: true
            decode: false
            author_href: ""
            license: CC BY-NC-SA 4.0
            license_url: https://creativecommons.org/licenses/by-nc-sa/4.0/
          children:
            - $formkit: radio
              name: enable
              label: 显示版权块
              help: 默认开启；单篇元数据可覆盖此开关。
              value: true
              options:
                - label: 显示
                  value: true
                - label: 隐藏
                  value: false
            - $formkit: radio
              name: decode
              label: 解码文章链接
              help: 对应上游 post_copyright.decode（默认 false）。仅显式 true 才对 permalink 做 decodeURI。可见文本走 text，不用 html。
              value: false
              options:
                - label: 解码
                  value: true
                - label: 原样
                  value: false
            - $formkit: text
              name: author_href
              label: 作者链接
              help: 对应上游 post_copyright.author_href（默认空，回退站点 URL）。可见文本 th:href，不做 HTML。
              value: ""
            - $formkit: text
              name: license
              label: 许可协议名称
              help: 对应上游 post_copyright.license（默认 CC BY-NC-SA 4.0）。空时回退该默认。可见文本 th:text。
              value: CC BY-NC-SA 4.0
            - $formkit: text
              name: license_url
              label: 许可协议链接
              help: 对应上游 post_copyright.license_url。空时回退 https://creativecommons.org/licenses/by-nc-sa/4.0/ 。可见文本 th:href。
              value: https://creativecommons.org/licenses/by-nc-sa/4.0/
        - $formkit: group
          name: reward
          label: 打赏
          help: 对应上游 Butterfly reward（_config.yml / layout/includes/post/reward.pug，5.7.0 f223b188）。默认 enable false、text 空、QR_code 空。仅显式开启且至少有一张二维码才渲染。空 text 显示「打赏」。可见文本 th:text / th:alt，无新增 th:utext。仅文章页，插在版权块之后、上下篇之前。不做 footer、related_post helper、逐页覆盖。
          value:
            enable: false
            text: ""
            QR_code: []
          children:
            - $formkit: radio
              name: enable
              label: 启用打赏
              help: 对应上游 reward.enable（默认 false）。关闭不渲染。开启仍须至少一个图片非空的有效二维码；只有空项时不显示按钮。
              value: false
              options:
                - label: 启用
                  value: true
                - label: 禁用
                  value: false
            - $formkit: text
              name: text
              label: 按钮文案
              help: 对应上游 reward.text（默认空，回退 i18n donate）。空时显示「打赏」。可见文本 th:text，不做 HTML。
              value: ""
            - $formkit: repeater
              name: QR_code
              label: 二维码
              help: 对应上游 reward.QR_code（img / link / text）。img 为空的项不输出。点击链接空则用图片地址。默认空列表。
              value: []
              children:
                - $formkit: attachment
                  name: img
                  label: 图片
                  help: 对应 QR_code[].img。
                  value: ""
                - $formkit: text
                  name: link
                  label: 点击链接
                  help: 对应 QR_code[].link。空则用 img。
                  value: ""
                - $formkit: text
                  name: text
                  label: 说明
                  help: 对应 QR_code[].text。可见文本 th:text / th:alt。
                  value: ""
    - group: comments
      label: 评论
      formSchema:
        - $formkit: checkbox
          name: lazyload
          label: 评论懒加载
          value: false
          help: 开启后接近评论区时自动加载，点击评论跳转立即加载。延迟组件初始化及评论数据请求；官方插件预加载的 JS/CSS 仍保留。
        - $formkit: checkbox
          name: text
          label: 显示评论说明和状态提示
          value: true
          help: 对应 DEC-01 保留的 comments.text；所有文案按纯文本显示，留空不显示。
        - $formkit: textarea
          name: notice
          label: 评论区说明
          value: ""
          placeholder: 例如：评论审核后显示，请文明交流。
        - $formkit: textarea
          name: closed_notice
          label: 评论关闭时提示
          value: ""
          help: 全局评论关闭或该文章/单页禁止评论时显示；留空延续原来的隐藏行为。
        - $formkit: textarea
          name: unavailable_notice
          label: 评论组件不可用时提示
          value: ""
          help: 官方评论组件未安装、停用或版本不足时显示；留空不显示。
        - $formkit: checkbox
          name: jump
          label: 显示跳到评论入口
          value: true
          help: 仅在当前文章或单页实际挂载评论时显示，可通过右侧按钮排序的 comment 标识调整位置。
        - $formkit: checkbox
          name: count
          label: 显示文章评论数
          value: false
          help: 使用 Halo 评论统计；需官方评论组件 3.3.2 或更新版本，且文章允许评论。
        - $formkit: checkbox
          name: card_post_count
          label: 显示列表卡片评论数
          value: false
          help: 默认关闭。首页、分类和标签列表使用 Halo 评论统计，不请求第三方计数服务。
    - group: wordcount
      label: 字数统计
      formSchema:
        - $formkit: radio
          name: enable
          label: 启用字数与阅读时长
          help: 统计中文字符和其他语言单词；阅读时长按中文 350 字/分钟、其他语言 160 词/分钟估算。关闭时不显示字数与时长。
          value: false
          options:
            - label: 启用
              value: true
            - label: 禁用
              value: false
        - $formkit: radio
          name: post_wordcount
          label: 显示字数总计
          help: 对应上游 wordcount.post_wordcount（默认 true）。仅 wordcount.enable 开启时生效。
          value: true
          options:
            - label: 显示
              value: true
            - label: 隐藏
              value: false
        - $formkit: radio
          name: min2read
          label: 显示阅读时长
          help: 对应上游 wordcount.min2read（默认 true）。仅 wordcount.enable 开启时生效。
          value: true
          options:
            - label: 显示
              value: true
            - label: 隐藏
              value: false
        - $formkit: checkbox
          name: total_wordcount
          label: 显示全站字数
          value: false
          help: 网站信息卡片进入视区后读取公开已发布文章，使用同一字数算法；当前标签页缓存 5 分钟。大型站点请求较多，可保持关闭。
    - group: copy
      label: 正文复制
      formSchema:
        - $formkit: checkbox
          name: enable
          label: 允许复制正文
          value: true
          help: 关闭后阻止文章正文的普通选择复制；代码工具栏与表单保持原有行为。
        - $formkit: group
          name: copyright
          label: 复制时附带版权
          children:
            - $formkit: checkbox
              name: enable
              label: 追加作者、链接与许可
              value: false
            - $formkit: number
              name: limit_count
              label: 追加版权的字符阈值
              value: 150
              min: 0
              help: 选中文字的字符数超过此值才追加。0 表示复制非空正文时追加；短选区保持原始复制。
    - group: share
      label: 文章分享
      formSchema:
        - $formkit: select
          name: use
          label: 分享方式
          value: ''
          options:
            - label: 关闭
              value: ''
            - label: 系统分享与复制链接
              value: native
            - label: Share.js
              value: sharejs
            - label: AddToAny
              value: addtoany
          help: Share.js 随主题分发；AddToAny 开启时加载其在线服务。各方式均提供手动复制链接回退。
        - $formkit: group
          name: sharejs
          label: Share.js 平台
          children:
            - $formkit: text
              name: sites
              label: 平台列表
              value: facebook,x,wechat,weibo,qq
              help: 以英文逗号分隔，支持 facebook、x、twitter、wechat、weibo、qq、qzone、linkedin；空列表不显示平台按钮。
        - $formkit: group
          name: addtoany
          label: AddToAny 平台
          children:
            - $formkit: text
              name: item
              label: 平台列表
              value: facebook,x,wechat,sina_weibo,facebook_messenger,email,copy_link
              help: 使用 AddToAny 服务标识，以英文逗号分隔；空列表不加载服务。
    - group: busuanzi
      label: 访问统计
      formSchema:
        - $formkit: select
          name: provider
          label: 统计来源
          value: halo
          options:
            - label: Halo 原生阅读量
              value: halo
            - label: 不蒜子 PV / UV
              value: busuanzi
          help: Halo 提供文章及文章累计阅读量；独立访客数仅在选择不蒜子时显示。启用不蒜子后向其在线服务发送访问请求，两种来源的统计口径不同。
        - $formkit: checkbox
          name: site_pv
          label: 显示累计访问量
          value: false
        - $formkit: checkbox
          name: site_uv
          label: 显示独立访客数
          value: false
          help: 仅不蒜子来源支持，在网站信息卡片中显示。
        - $formkit: radio
          name: page_pv
          label: 显示文章阅读量
          help: 在文章元信息显示阅读量，使用本组选择的统计来源。
          value: false
          options:
            - label: 显示
              value: true
            - label: 隐藏
              value: false
    #文章目录（对齐上游 toc.number / expand / style_simple / scroll_percent）
    - group: toc
      label: 文章目录
      formSchema:
        - $formkit: radio
          name: post
          label: 文章目录
          help: 文章默认显示目录。可在单篇文章的元数据中覆盖；没有标题时显示空目录提示。
          value: true
          options:
            - label: 显示
              value: true
            - label: 隐藏
              value: false
        - $formkit: radio
          name: page
          label: 自定义页面目录
          help: 自定义页面默认不显示目录。可在单页元数据中单独开启。
          value: false
          options:
            - label: 显示
              value: true
            - label: 隐藏
              value: false
        - $formkit: radio
          name: number
          label: 目录序号
          help: 开启后目录项显示 1. / 1.1. 等序号。文章和自定义页面均可在元数据中覆盖。
          value: true
          options:
            - label: 显示
              value: true
            - label: 隐藏
              value: false
        - $formkit: radio
          name: expand
          label: 默认展开
          help: 开启后展开全部目录层级；关闭时仅展开当前章节。可在单篇元数据中覆盖。
          value: false
          options:
            - label: 展开
              value: true
            - label: 折叠（默认）
              value: false
        - $formkit: radio
          name: style_simple
          label: 简洁侧栏
          help: 开启后文章侧栏只保留目录。自定义页面默认保留其它卡片，也可在单页元数据中单独启用简洁侧栏。
          value: false
          options:
            - label: 仅目录
              value: true
            - label: 目录与其它卡片（默认）
              value: false
        - $formkit: radio
          name: scroll_percent
          label: 滚动百分比
          help: 对应上游 toc.scroll_percent（默认开启）。开启后目录标题显示阅读进度百分比；关闭不渲染、不更新。右下角回到顶部百分比见 rightside.scroll_percent。
          value: true
          options:
            - label: 显示
              value: true
            - label: 隐藏
              value: false
    - group: anchor
      label: 章节定位
      formSchema:
        - $formkit: radio
          name: auto_update
          label: 滚动时更新章节链接
          help: 阅读到不同章节时更新网址中的锚点，方便复制链接。不会为每次滚动增加浏览器历史记录。
          value: false
          options:
            - label: 开启
              value: true
            - label: 关闭
              value: false
        - $formkit: radio
          name: click_to_scroll
          label: 点击标题定位章节
          help: 为正文标题提供章节链接入口，支持键盘操作与直接打开章节链接。
          value: false
          options:
            - label: 开启
              value: true
            - label: 关闭
              value: false
    #归档设置
    - group: archives
      label: 归档设置
      formSchema:
        - $formkit: radio
          name: enable_above
          label: 启用第一屏
          help: 启用首页第一屏
          value: true
          options:
            - label: 启用
              value: true
            - label: 禁用
              value: false
        - $formkit: attachment
          name: above_background
          label: 第一屏背景图
          placeholder: 请填写 第一屏背景图
          value: '/themes/halo-butterfly-next/assets/images/above.svg'
          help: 留空使用默认顶图；分类/标签详情优先使用各自原生封面
    #标签设置
    - group: tags
      label: 标签设置
      formSchema:
        - $formkit: radio
          name: enable_above
          label: 启用第一屏
          help: 启用首页第一屏
          value: true
          options:
            - label: 启用
              value: true
            - label: 禁用
              value: false
        - $formkit: attachment
          name: above_background
          label: 第一屏背景图
          placeholder: 请填写 第一屏背景图
          value: '/themes/halo-butterfly-next/assets/images/above.svg'
          help: 留空使用默认顶图；分类/标签详情优先使用各自原生封面
    #分类设置
    - group: categories
      label: 分类设置
      formSchema:
        - $formkit: radio
          name: enable_above
          label: 启用第一屏
          help: 启用首页第一屏
          value: true
          options:
            - label: 启用
              value: true
            - label: 禁用
              value: false
        - $formkit: attachment
          name: above_background
          label: 第一屏背景图
          placeholder: 请填写 第一屏背景图
          value: '/themes/halo-butterfly-next/assets/images/above.svg'
          help: 留空使用默认顶图；分类/标签详情优先使用各自原生封面
    #渲染设置
    - group: math
      label: 数学公式
      formSchema:
        - $formkit: checkbox
          name: enable
          label: 显示公式
          value: true
          help: 配合 Halo KaTeX 插件使用。关闭时有 TeX 源码的公式显示为源码；文章/单页的 katex 元数据优先。此开关不控制插件全站资源加载。默认编辑器请关闭插件的前台渲染，避免重复渲染。
        - $formkit: checkbox
          name: copy_tex
          label: 复制 TeX
          value: true
          help: 为带 TeX 源码的公式提供复制按钮；完整选中单个公式复制时输出 TeX，部分选中沿用浏览器行为。
        - $formkit: checkbox
          name: hide_scrollbar
          label: 隐藏长公式滚动条
          value: false
          help: 长公式仍可横向滚动；溢出容器支持键盘聚焦和方向键。
    - group: render
      label: 渲染设置
      formSchema:
        - $formkit: radio
          name: enable_h_icon
          label: 启用标题图标（全局）
          help: 启用h1~h6标题左边图标（元数据可配置）
          value: true
          options:
            - label: 启用
              value: true
            - label: 禁用
              value: false
        - $formkit: radio
          name: enable_code
          id: enable_code
          key: enable_code
          label: 启用代码块
          help: 如果安装其他代码块插件，请关闭此功能！！！
          value: true
          options:
            - label: 启用
              value: true
            - label: 禁用
              value: false
        - $formkit: radio
          name: enable_code_title
          if: $get(enable_code).value
          label: 启用代码标题
          help: 对应上游 code_blocks.language。关闭后不显示语言标题。
          value: true
          options:
            - label: 启用
              value: true
            - label: 禁用
              value: false
        - $formkit: radio
          name: enable_code_hr
          if: $get(enable_code).value
          label: 启用代码标题分割线
          help: 启用代码标题和内容之间的分割线，不展示时会更加简洁
          value: true
          options:
            - label: 启用
              value: true
            - label: 禁用
              value: false
        - $formkit: radio
          name: enable_code_line
          if: $get(enable_code).value
          label: 启用代码行号
          help: 启用代码块行号功能
          value: true
          options:
            - label: 启用
              value: true
            - label: 禁用
              value: false
        - $formkit: radio
          name: enable_code_copy
          if: $get(enable_code).value
          label: 启用代码复制
          help: 对应上游 code_blocks.copy。关闭后不显示复制按钮。
          value: true
          options:
            - label: 启用
              value: true
            - label: 禁用
              value: false
        - $formkit: radio
          name: enable_code_expander
          if: $get(enable_code).value
          label: 代码块默认折叠
          help: 对应上游 code_blocks.shrink（false / true / none）。false：有折叠按钮且初始展开；true：有按钮且初始折叠（closed）；none：不显示折叠按钮。默认 false，与上游一致。旧版布尔 true（有按钮、初始展开）运行时映射为 false；旧版布尔 false（无按钮）映射为 none，已有站点不会因升级变成初始折叠。
