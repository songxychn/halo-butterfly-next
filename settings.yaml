    #遮罩（对齐上游 mask.footer；本刀不含 mask.header）
    - group: mask
      label: 遮罩
      formSchema:
        - $formkit: radio
          name: footer
          label: 页脚背景遮罩
          help: 对应上游 Butterfly mask.footer（_config.yml / source/css/_layout/footer.styl，5.7.0 f223b188）。默认 true。仅当 footer_img 非空时给页脚加 :before 遮罩。仅显式 false 关闭。页头见 mask.header。
          value: true
          options:
            - label: 开启
              value: true
            - label: 关闭
              value: false
        - $formkit: radio
          name: header
          label: 页头第一屏遮罩
          help: 对应上游 Butterfly mask.header（_config.yml / source/css/_layout/head.styl，5.7.0 f223b188）。默认 true。仅显式 false 关闭。有第一屏（.above）时给页头加 :before 遮罩，对齐 :not(.not-top-img)。无第一屏（header.dp）不加。不做 aside.hide / aside.mobile。
          value: true
          options:
            - label: 开启
              value: true
            - label: 关闭
              value: false
    #页脚（对齐上游 footer.owner / copyright / custom_text）
    - group: rightside
      label: 右下角按钮
      formSchema:
        - $formkit: group
          name: item_order
          label: 按钮排序与分组
          children:
            - $formkit: checkbox
              name: enable
              label: 自定义按钮排列
              value: false
            - $formkit: text
              name: hide
              label: 展开后显示的按钮
              value: "readmode,translate,darkmode,hideAside"
              help: "按顺序填写英文标识，以逗号分隔：readmode 阅读模式、translate 繁简转换、darkmode 深色模式、hideAside 侧栏、toc 手机目录。留空使用默认分组。"
            - $formkit: text
              name: show
              label: 常驻按钮
              value: "toc,chat,comment"
              help: "使用相同标识。仅显示已启用且当前页面可用的功能；comment 对应跳到评论，chat 暂未接入会被忽略。重复项以展开组优先；未列出的按钮隐藏，返回顶部始终保留。留空使用默认分组。"
        - $formkit: checkbox
          name: config_animation
          label: 齿轮旋转动画
          value: true
          help: 系统启用减少动态效果时停止旋转。
        - $formkit: radio
          name: scroll_percent
          label: 回到顶部阅读百分比
          help: "对应上游 Butterfly rightside_scroll_percent（_config.yml / layout/includes/rightside.pug #go-up / source/js/main.js，5.7.0 f223b188）。默认 false。仅显式 true 时在回到顶部按钮显示阅读百分比（小于 95%）。关闭不渲染 .scroll-percent。距底偏移见 rightside.bottom。阅读模式见 rightside.readmode。按钮排序见右下角按钮排列设置。禁止复用作者卡片 aside.button。"
          value: false
          options:
            - label: 显示
              value: true
            - label: 隐藏
              value: false
        - $formkit: text
          name: bottom
          label: 距底偏移
          placeholder: 例如 40px、80px、10%
          value: ""
          help: "对应上游 Butterfly rightside_bottom（_config.yml / source/css/var.styl $rightside-bottom / source/css/_layout/rightside.styl #rightside，5.7.0 f223b188）。默认空，等价 40px。非空写入 CSS 变量 --rightside-bottom（须带单位）。阅读模式见 rightside.readmode。按钮排序见本组排列设置。禁止复用作者卡片 aside.button。"
        - $formkit: radio
          name: readmode
          label: 阅读模式
          help: "对应上游 Butterfly readmode（_config.yml / layout/includes/rightside.pug #readmode / source/js/main.js，5.7.0 f223b188）。默认 true。仅显式 false 不渲染阅读模式按钮。仅文章页。点击给 body 加 .read-mode，退出按钮 .exit-readmode。禁止复用作者卡片 aside.button。繁简见 translate.enable。按钮排序见右下角按钮排列设置。"
          value: true
          options:
            - label: 开启
              value: true
            - label: 关闭
              value: false
    - group: translate
      label: 繁简转换
      formSchema:
        - $formkit: radio
          name: enable
          label: 繁简转换按钮
          help: 开启后提供繁简转换按钮；代码、脚本、表单输入与 translate=no 的内容保持原文。
          value: false
          options:
            - label: 开启
              value: true
            - label: 关闭
              value: false
        - $formkit: text
          name: default
          label: 按钮文案
          help: "对应上游 Butterfly translate.default（默认 繁）。显示在 #translateLink 上。enable 关闭时不渲染该按钮。空值回退为 繁。禁止复用作者卡片 aside.button。"
          value: "繁"
        - $formkit: select
          name: defaultEncoding
          label: 正文原始编码
          value: 2
          options:
            - label: 简体中文
              value: 2
            - label: 繁体中文
              value: 1
        - $formkit: number
          name: translateDelay
          label: 恢复已保存转换的延迟（毫秒）
          value: 0
          min: 0
          max: 60000
        - $formkit: text
          name: msgToTraditionalChinese
          label: 转为繁体的按钮文案
          value: 繁
        - $formkit: text
          name: msgToSimplifiedChinese
          label: 转为简体的按钮文案
          value: 簡
    - group: darkmode
      label: 深色模式
      formSchema:
        - $formkit: radio
          name: enable
          label: 深色模式
          help: "对应上游 Butterfly darkmode.enable（_config.yml / layout/includes/rightside.pug #darkmode / source/js/main.js，5.7.0 f223b188）。默认 true。仅显式 false 时不提供右下角切换按钮。按钮开关见 darkmode.button。自动切换见 autoChangeMode。禁止复用作者卡片 aside.button。提示位置与配色见“消息提示”。"
          value: true
          options:
            - label: 开启
              value: true
            - label: 关闭
              value: false
        - $formkit: radio
          name: button
          label: 右下角切换按钮
          help: "对应上游 Butterfly darkmode.button。默认 true。须 darkmode.enable 同时开启才渲染 #darkmode。仅显式 false 不渲染。禁止复用作者卡片 aside.button。按钮排序见右下角按钮排列设置。"
          value: true
          options:
            - label: 显示
              value: true
            - label: 隐藏
              value: false
        - $formkit: select
          name: autoChangeMode
          label: 自动切换
          help: "对应上游 Butterfly darkmode.autoChangeMode（默认 false）。false 仅恢复已存主题；1 跟随 prefers-color-scheme（无系统偏好时回退小时窗口）；2 按小时。style.mode 的 light/dark 仍强制。禁止复用作者卡片 aside.button。提示位置与配色见“消息提示”。"
          value: false
          options:
            - label: 关闭（false）
              value: false
            - label: 跟随系统（1）
              value: 1
            - label: 按小时（2）
              value: 2
        - $formkit: text
          name: start
          label: 夜间开始小时
          help: "对应上游 Butterfly darkmode.start。空值回退 6。0 与 24 有效。仅 autoChangeMode 为 1（无系统偏好时）或 2 使用。禁止复用作者卡片 aside.button。"
          value: ""
        - $formkit: text
          name: end
          label: 夜间结束小时
          help: "对应上游 Butterfly darkmode.end。空值回退 18。0 与 24 有效。仅 autoChangeMode 为 1（无系统偏好时）或 2 使用。禁止复用作者卡片 aside.button。"
          value: ""
    - group: footer
      label: 页脚
      formSchema:
        - $formkit: group
          name: owner
          label: 站点所有权
          help: 对应上游 Butterfly footer.owner（_config.yml / layout/includes/footer.pug，5.7.0 f223b188）。默认 enable true、since 2025。关闭不渲染 © 行。since 与当前年不同时显示 since - current，否则只显示当前年。作者用站点名称。本刀含 footer.nav（扁平 title/url）与 footer_img。不做嵌套列 html。遮罩见 mask.footer。
          value:
            enable: true
            since: 2025
          children:
            - $formkit: radio
              name: enable
              label: 显示所有权行
              help: 对应上游 footer.owner.enable（默认 true）。关闭不渲染 © 所有权行。
              value: true
              options:
                - label: 显示
                  value: true
                - label: 隐藏
                  value: false
            - $formkit: number
              name: since
              label: 起始年
              help: 对应上游 footer.owner.since（默认 2025）。与当前年相同或为空时只显示当前年。
              value: 2025
        - $formkit: group
          name: copyright
          label: 框架与主题
          help: 对应上游 Butterfly footer.copyright（_config.yml / footer.pug）。默认 enable true、version true。关闭不渲染 Powered by 行。version 关闭不显示主题版本号。Halo 替代 Hexo。
          value:
            enable: true
            version: true
          children:
            - $formkit: radio
              name: enable
              label: 显示框架与主题
              help: 对应上游 footer.copyright.enable（默认 true）。关闭不渲染框架/主题行。
              value: true
              options:
                - label: 显示
                  value: true
                - label: 隐藏
                  value: false
            - $formkit: radio
              name: version
              label: 显示版本号
              help: 对应上游 footer.copyright.version（默认 true）。开启时在主题名后显示 theme.spec.version。
              value: true
              options:
                - label: 显示
                  value: true
                - label: 隐藏
                  value: false
        - $formkit: repeater
          name: nav
          label: 页脚导航
          help: 对应上游 Butterfly footer.nav（_config.yml / layout/includes/footer.pug，5.7.0 f223b188）。默认空。空列表不渲染。本刀为 title + url 扁平链接，不做嵌套列、width、html 子项。可见文本 th:text / th:href，无新增 th:utext。
          value: []
          children:
            - $formkit: text
              name: title
              label: 名称
              help: 对应 nav 项 title。空则该项不输出。可见文本 th:text。
              value: ""
            - $formkit: text
              name: url
              label: 链接
              help: 对应 nav 项 url。空则该项不输出。可见文本 th:href。
              value: ""
        - $formkit: textarea
          name: custom_text
          label: 自定义文案
          help: 对应上游 footer.custom_text（默认空）。有内容才渲染。可见文本 th:text，不做 HTML。
          value: ""
        - $formkit: attachment
          name: footer_img
          label: 页脚背景
          help: 对应上游 Butterfly footer_img（_config.yml 顶层，5.7.0 f223b188）。默认 false。Halo 放在页脚组，空字符串视为 false，不套背景。非空为附件/URL，写入 background-image（th:style，无 th:utext）。不做 true=复用页头 top_img、颜色值与 background 简写。遮罩见 mask.footer。
          value: ""
    - group: error404
