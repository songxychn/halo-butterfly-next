    #渲染设置
    - group: render
      label: 渲染设置
      formSchema:
        - $formkit: radio
          name: enable_h_icon
          label: 启用标题图标（全局）
          help: 启用h1~h6标题左边图标（元数据可配置）
          value: true
          options:
