          value: "1"
          options:
            - label: 关闭
              value: "false"
            - label: 1（默认）：上一篇较早、下一篇较新
              value: "1"
            - label: 2：上一篇较新、下一篇较早
              value: "2"
        - $formkit: group
          name: noticeOutdate
          label: 文章过期提醒
          help: 对应上游 Butterfly noticeOutdate（_config.yml / outdate-notice.pug / main.js addPostOutdateNotice，5.7.0 f223b188）。默认关闭。enable 关闭不渲染；天数 Math.floor((now - 更新时间) / 86400000) ≥ limit_day 才显示；更新时间取 status.lastModifyTime，无则 spec.publishTime。position top 在正文前、bottom 在正文后。style simple / flat（该 SHA 默认 flat）。文案前后缀与天数用 th:text 拼接。仅文章页；单篇元数据中的过期提醒开关优先于全局开关。
          value:
            enable: false
            style: flat
            limit_day: 365
            position: top
            message_prev: It has been
