apiVersion: v1alpha1
kind: Setting
metadata:
  name: halo-butterfly-next-setting
spec:
  forms:
    - group: base
      label: 基本设置
      formSchema:
        - $formkit: checkbox
          name: enable_seo
          label: 输出主题分享元数据与规范链接
          value: true
          help: 输出 Open Graph 及文章、自定义页面、首页第一页的 canonical。使用其他 SEO 插件时可关闭；描述和关键词由 Halo 提供。
        - $formkit: text
          name: metadata_name
          label: 作者用户名
          placeholder: 请填写作者的唯一标识（用户名）
          value: ""
          help: 可选。填写 Halo 用户名显示个人资料；留空或用户不存在时使用站点信息。
        - $formkit: text
          name: icp
          label: ICP 备案号
          placeholder: 请填写 ICP 备案号信息
          help: ICP 备案信息将展示在页脚中，不填不展示（示例：蜀ICP备xx号）
        - $formkit: text
          name: police
          label: 公网安备号
          placeholder: 请填写公网安备号信息
          help: 公网安备信息将展示在页脚中，不填不展示（示例：京公xxx号）
        - $formkit: date
          name: site_birthday
          label: 建站时间
          placeholder: 示例 2022-01-01 00:00
          help: 自定义博客的起始时间/安装时间，作为计算博客运行时间的参照值，不选择不显示
    #主题设置
    - group: style
      label: 主题设置
      formSchema:
        - $formkit: select
          name: mode
          label: 主题模式
          value: 'user'
          placeholder: 请填写主题颜色
          help: "设置博客的主题模式（自动/用户/浅色/深色），默认用户。右下角 #darkmode 显隐见 darkmode.enable / darkmode.button。light/dark 仍强制。自动切换策略见 darkmode.autoChangeMode；小时窗口见 start / end。"
          options:
            - value: 'auto'
              label: 自动模式
            - value: 'user'
              label: 用户模式
            - value: 'light'
              label: 浅色模式
            - value: 'dark'
              label: 深色模式
        - $formkit: select
          name: font_family
          label: 主题字体
          value: 'null'
          help: 当前预览版使用系统字体。旧版附带字体不再分发。
          options:
            - value: 'null'
              label: "系统字体"
        - $formkit: text
          name: body_background
          label: 全局背景（浅色）
          placeholder: 请填写 全局背景
          value: '#f7f9fe'
          help: 颜色值 默认值：#f7f9fe
          validation: required
    #加载设置
    - group: loading
      label: 加载设置
      formSchema:
        - $formkit: radio
          name: type
          label: 页面加载（Loading）
          help: 内置多种加载样式
          value: 'circle'
          options:
            - label: '转圈'
              value: 'circle'
            - label: '沙漏'
              value: 'hourglass'
            - label: '交叉线'
              value: 'cross_line'
            - label: '小圆点'
              value: 'dot'
          validation: required
        - $formkit: group
          label: 图片加载
          name: img
          value:
            preload: 'data:image/gif;base64,R0lGODdhAQABAPAAAMPDwwAAACwAAAAAAQABAAACAkQBADs='
            err: 'data:image/gif;base64,R0lGODdhAQABAPAAAMPDwwAAACwAAAAAAQABAAACAkQBADs='
            random_enable: false
            random_link: ''
          children:
            - $formkit: attachment
              name: preload
              label: 预加载图
              placeholder: 请填写 预加载图片
              value: 'data:image/gif;base64,R0lGODdhAQABAPAAAMPDwwAAACwAAAAAAQABAAACAkQBADs='
              help: 预加载图片，默认 data:image/gif;base64,R0lGODdhAQABAPAAAMPDwwAAACwAAAAAAQABAAACAkQBADs=
              validation: required
            - $formkit: attachment
              name: err
              label: 加载失败图
              placeholder: 请填写 加载失败图片
              value: 'data:image/gif;base64,R0lGODdhAQABAPAAAMPDwwAAACwAAAAAAQABAAACAkQBADs='
              help: 加载失败图片，默认 data:image/gif;base64,R0lGODdhAQABAPAAAMPDwwAAACwAAAAAAQABAAACAkQBADs=
              validation: required
            - $formkit: radio
              name: random_enable
              label: 启用随机图片
              help: 是否启用随机图API（必须先配置 API），开启后将使用随机图填充没有设置封面的，未开启时使用主题内置的封面图
              value: false
              validation: required
              options:
                - label: 启用
                  value: true
                - label: 禁用
                  value: false
            - $formkit: text
              name: random_link
              label: 随机图片链接
              placeholder: 请正确填写 随机图片链接
              value: ''
              help: 自定义随机图API，用于填充没有设置封面的 ，免费 API 不会一直可用，请知悉
              validation: url
    #导航设置
    - group: nav
      label: 导航设置
      formSchema:
        - $formkit: radio
          name: fixed
          label: 滚动后始终固定导航
          help: 关闭时滚动超过导航高度后向下隐藏、向上显示（上游 nav.fixed 默认关闭）。开启后导航始终吸顶可见。
          value: false
          options:
            - label: 启用
              value: true
            - label: 禁用
              value: false
        - $formkit: attachment
          name: logo
          label: 导航 Logo
          placeholder: 可选，留空不显示
          value: ""
          help: 显示在站点标题左侧。留空不显示图片。
        - $formkit: radio
          name: display_title
          label: 显示站点标题
          help: 关闭后导航不显示站点名，可只保留 Logo。
          value: true
          options:
            - label: 启用
              value: true
            - label: 禁用
              value: false
        - $formkit: radio
          name: display_post_title
          label: 滚动后显示文章标题
          help: 仅文章页。开启且导航进入滚动固定态时，用文章标题替换站点名。
          value: true
          options:
            - label: 启用
              value: true
            - label: 禁用
              value: false
        - $formkit: group
          name: font_color
          label: 导航栏默认字体颜色
          help: 支持rgba颜色值和十六进制颜色值
          value:
            light: rgba(238, 238, 238, 1)
            dark: rgba(255, 255, 255, 0.7)
          children:
            - $formkit: text
              name: light
              label: 浅色
              value: ""
              help: 默认值：rgba(238, 238, 238, 1)
              validation: required
            - $formkit: text
              name: dark
              label: 暗色
              value: ""
              help: 默认值：rgba(255, 255, 255, 0.7)
              validation: required
        - $formkit: group
          name: active_font_color
          label: 导航栏滚动悬浮字体颜色
          help: 支持rgba颜色值和十六进制颜色值
          value:
            light: rgb(76, 73, 72)
            dark: rgba(255, 255, 255, 0.7)
          children:
            - $formkit: text
              name: light
              label: 浅色
              value: ""
              help: 默认值：rgb(76, 73, 72)
              validation: required
            - $formkit: text
              name: dark
              label: 暗色
              value: ""
              help: 默认值：rgba(255, 255, 255, 0.7)
              validation: required
        - $formkit: group
          name: active_hover_font_color
          label: 导航栏滚动悬浮鼠标移入字体颜色
          help: 支持rgba颜色值和十六进制颜色值（默认主题色）
          value:
            light: var(--theme)
            dark: var(--theme)
          children:
            - $formkit: text
              name: light
              label: 浅色
              value: ""
              help: 默认值：var(--theme)
              validation: required
            - $formkit: text
              name: dark
              label: 暗色
              value: ""
              help: 默认值：var(--theme)
              validation: required
        - $formkit: group
          name: active_background_color
          label: 导航栏滚动悬浮背景颜色
          help: 支持rgba颜色值和十六进制颜色值
          value:
            light: rgba(255, 255, 255, .8)
            dark: rgba(18, 18, 18, .8)
          children:
            - $formkit: text
              name: light
              label: 浅色
              value: ""
              help: 默认值：rgba(255, 255, 255, .8)
              validation: required
            - $formkit: text
              name: dark
              label: 暗色
              value: ""
              help: 默认值：rgba(18, 18, 18, .8)
              validation: required
        - $formkit: group
          name: active_shadow
          label: 导航栏滚动悬浮阴影
          help: 支持rgba颜色值和十六进制颜色值
          value:
            light: 0 5px 6px -5px rgba(133, 133, 133, .6)
            dark: 0 5px 6px -5px rgba(133, 133, 133, 0)
          children:
            - $formkit: text
              name: light
              label: 浅色
              value: ""
              help: 默认值：0 5px 6px -5px rgba(133, 133, 133, .6)
              validation: required
            - $formkit: text
              name: dark
              label: 暗色
              value: ""
              help: 默认值：0 5px 6px -5px rgba(133, 133, 133, 0)
              validation: required
        - $formkit: group
          name: dropdown_background_color
          label: 导航栏二级下拉背景颜色
          help: 支持rgba颜色值和十六进制颜色值
          value:
            light: rgba(255, 255, 255)
            dark: rgba(18, 18, 18)
          children:
            - $formkit: text
              name: light
              label: 浅色
              value: ""
              help: 默认值：rgba(255, 255, 255)
              validation: required
            - $formkit: text
              name: dark
              label: 暗色
              value: ""
              help: 默认值：rgba(18, 18, 18)
              validation: required
        - $formkit: group
          name: dropdown_font_color
          label: 导航栏二级下拉字体颜色
          help: 支持rgba颜色值和十六进制颜色值
          value:
            light: rgba(76, 73, 72, 1)
            dark: rgba(255, 255, 255, 0.7)
          children:
            - $formkit: text
              name: light
              label: 浅色
              value: ""
              help: 默认值：rgba(76, 73, 72, 1)
              validation: required
            - $formkit: text
              name: dark
              label: 暗色
              value: ""
              help: 默认值：rgba(255, 255, 255, 0.7)
              validation: required
        - $formkit: group
          name: dropdown_hover_font_color
          label: 导航栏hover二级下拉字体颜色
          help: 支持rgba颜色值和十六进制颜色值
          value:
            light: rgb(244 244 244)
            dark: rgb(54 50 50)
          children:
            - $formkit: text
              name: light
              label: 浅色
              value: ""
              help: 默认值：rgb(244 244 244)
              validation: required
            - $formkit: text
              name: dark
              label: 暗色
              value: ""
              help: 默认值：rgb(54 50 50)
              validation: required
    #侧边栏设置
    - group: aside
      label: 侧边栏设置
      formSchema:
        - $formkit: radio
          name: enable
          label: 启用侧边栏（全局）
          help: 是否启用侧边栏，关闭后所有页面都没有侧边栏（优先级高于页面元数据）
          value: true
          options:
            - label: 启用
              value: true
            - label: 禁用
              value: false
        - $formkit: radio
          name: hide
          label: 初始隐藏侧栏
          help: 对应上游 Butterfly aside.hide（_config.yml / source/css/_layout/aside.styl，5.7.0 f223b188）。默认 false。仅显式 true 才给 html 加 hide-aside：桌面宽度（min-width 900px）隐藏 .aside、主栏约 80%。必须用 aside.hide，禁止复用作者卡片 aside.button。不做右下角隐藏开关。移动端见 aside.mobile。
          value: false
          options:
            - label: 显示
              value: false
            - label: 隐藏
              value: true
        - $formkit: radio
          name: mobile
          label: 窄屏显示侧栏卡片
          help: "对应上游 Butterfly aside.mobile（_config.yml / source/css/_layout/aside.styl，5.7.0 f223b188）。默认 true。仅显式 false 时在 max-width 768px 隐藏侧栏卡片（目录 .aside-toc 除外，对齐 #card-toc）。必须用 aside.mobile，禁止复用作者卡片 aside.button。不做隐藏开关 / aside.hide。"
          value: true
          options:
            - label: 显示
              value: true
            - label: 隐藏
              value: false
        - $formkit: radio
          name: hide_button
          label: 右下角隐藏侧栏开关
          help: "对应上游 Butterfly aside.button（_config.yml / layout/includes/rightside.pug / source/js/main.js，5.7.0 f223b188）。默认 true。仅显式 false 时不渲染 #hide-aside-btn。必须用 aside.hide_button，禁止复用作者卡片 aside.button。不改 aside.hide / aside.mobile。不做完整 rightside。"
          value: true
          options:
            - label: 显示
              value: true
            - label: 隐藏
              value: false
        - $formkit: radio
          name: position
          label: 侧边栏位置
          help: 侧边栏展示位置，左边或右边
          value: aside-right
          options:
            - label: 左边
              value: aside-left
            - label: 右边
              value: aside-right
        - $formkit: group
          name: button
          label: 侧边栏按钮
          value:
            name: '上游 Halo 移植项目'
            link: 'https://github.com/dhjddcn/halo-theme-butterfly'
          children:
            - $formkit: text
              name: name
              label: 名称
              placeholder: 请填写 按钮名称
              help: 支持html代码片段
              value: ""
              validation: required
            - $formkit: text
              name: link
              label: 链接
              placeholder: 请填写 按钮链接
              value: ""
              validation: required
        - $formkit: repeater
          name: social
          label: 社交账号
          value:
            - name: 'Github'
              icon: '<i class="fa-brands fa-github"></i>'
              link: 'https://github.com/dhjddcn'
          children:
            - $formkit: text
              name: name
              label: 名称
              placeholder: 请填写 账号名称
              value: ""
              validation: required
            - $formkit: text
              name: icon
              label: 图标
              placeholder: 请填写 图标
              value: ""
              validation: required
            - $formkit: text
              name: link
              label: 链接
              placeholder: 请填写 链接
              value: ""
              validation: required
        - $formkit: textarea
          rows: 5
          name: notice
          label: 侧边栏公告
          placeholder: 请填写 侧边栏公告内容
          value: '好博客，一定要 分享出去 呀~'
          help: 侧边栏公告内容, 支持 html 代码片段
        - $formkit: group
          name: card_recent_post
          label: 最近文章
          help: 最近文章卡片。数量和排序在服务端生效；卡片顺序在浏览器增强后生效。
          value:
            enable: true
            limit: 5
            sort: date
          children:
            - $formkit: radio
              name: enable
              label: 显示最近文章卡片
              help: 对应上游 aside.card_recent_post.enable（默认开启）。关闭后侧栏不渲染该卡片。
              value: true
              options:
                - label: 启用
                  value: true
                - label: 禁用
                  value: false
            - $formkit: number
              name: limit
              label: 显示数量
              help: 对应上游 aside.card_recent_post.limit（默认 5）。上游 0 表示全部；Halo 最多取 20 篇（填 0 或大于 20 时按 20）。
              value: 5
              min: 0
              max: 20
            - $formkit: radio
              name: sort
              label: 排序字段
              help: 对应上游 aside.card_recent_post.sort。date 用 publishTime，updated 用 lastModifyTime。
              value: date
              options:
                - label: 发布时间
                  value: date
                - label: 更新时间
                  value: updated
            - $formkit: number
              name: sort_order
              label: 卡片顺序
              value: 20
              help: "数值越小越靠前；相同数值保持原顺序。"
              min: 0
        - $formkit: radio
          name: enable_category
          label: 启用侧边栏分类
          help: 是否显示分类卡片；数量和层级展开在分类选项中设置。
          value: true
          options:
            - label: 启用
              value: true
            - label: 禁用
              value: false
        - $formkit: radio
          name: enable_tags
          label: 启用侧边栏标签
          help: 是否显示标签卡片；数量和排序在标签选项中设置。
          value: true
          options:
            - label: 启用
              value: true
            - label: 禁用
              value: false
        - $formkit: radio
          name: enable_archives
          label: 启用侧边栏归档
          help: 归档卡片默认开启；保留原配置键，年月、格式和排序在归档选项中设置。
          value: true
          options:
            - label: 启用
              value: true
            - label: 禁用
              value: false
        - $formkit: radio
          name: enable_custom
          label: 启用侧边栏自定义模块
          help: 是否启用自定义模块
          value: false
          options:
            - label: 启用
              value: true
            - label: 禁用
              value: false
        - $formkit: radio
          name: enable_webInfo
          label: 启用侧边栏网站信息
          help: 是否启用侧边栏网站信息
          value: true
          options:
            - label: 启用
              value: true
            - label: 禁用
              value: false
        - $formkit: group
          name: display
          label: 按页面显示侧栏
          children:
            - $formkit: radio
              name: archive
              label: 归档页
              value: true
              options:
                - label: 启用
                  value: true
                - label: 禁用
                  value: false
            - $formkit: radio
              name: tag
              label: 标签列表及标签文章页
              value: true
              options:
                - label: 启用
                  value: true
                - label: 禁用
                  value: false
            - $formkit: radio
              name: category
              label: 分类列表及分类文章页
              value: true
              options:
                - label: 启用
                  value: true
                - label: 禁用
                  value: false
        - $formkit: group
          name: card_author
          label: 作者卡片
          children:
            - $formkit: radio
              name: enable
              label: 显示作者卡片
              value: true
              options:
                - label: 启用
                  value: true
                - label: 禁用
                  value: false
            - $formkit: number
              name: sort_order
              label: 卡片顺序
              value: 0
              min: 0
        - $formkit: group
          name: card_announcement
          label: 公告卡片
          children:
            - $formkit: radio
              name: enable
              label: 显示公告卡片
              value: true
              options:
                - label: 启用
                  value: true
                - label: 禁用
                  value: false
            - $formkit: number
              name: sort_order
              label: 卡片顺序
              value: 10
              min: 0
        - $formkit: group
          name: card_categories
          label: 分类选项
          help: "支持 Halo 分类层级；浏览器脚本启用后按名称排序及展开，关闭脚本仍显示受数量限制的分类链接。"
          children:
            - $formkit: number
              name: limit
              label: 分类数量
              value: 5
              help: "0 显示全部；按名称排序后按深度优先计数，包含子分类。"
              min: 0
            - $formkit: select
              name: expand
              label: 子分类展开方式
              value: none
              options:
                - label: 始终展示
                  value: none
                - label: 默认展开
                  value: 'true'
                - label: 默认收起
                  value: 'false'
            - $formkit: number
              name: sort_order
              label: 卡片顺序
              value: 30
              min: 0
        - $formkit: group
          name: card_tags
          label: 标签选项
          help: "排序在完整标签集合上进行，再应用数量限制；关闭脚本时采用 Halo 原顺序。"
          children:
            - $formkit: number
              name: limit
              label: 标签数量
              value: 25
              help: "0 显示全部，只展示有公开文章的标签。"
              min: 0
            - $formkit: select
              name: orderby
              label: 排序字段
              value: random
              options:
                - label: 随机
                  value: random
                - label: 名称
                  value: name
                - label: 文章数
                  value: length
            - $formkit: select
              name: order
              label: 排序方向
              value: 1
              options:
                - label: 升序
                  value: 1
                - label: 降序
                  value: -1
            - $formkit: number
              name: sort_order
              label: 卡片顺序
              value: 40
              min: 0
        - $formkit: group
          name: card_archives
          label: 归档选项
          help: "浏览器脚本控制升降序及日期格式；关闭脚本仍按时间倒序并限制行数。计数读取全部公开文章，大型站点需关注服务端成本。"
          children:
            - $formkit: select
              name: type
              label: 归档粒度
              value: monthly
              options:
                - label: 按月
                  value: monthly
                - label: 按年
                  value: yearly
            - $formkit: text
              name: format
              label: 日期格式
              value: ''
              help: "留空：月归档 YYYY年MM月，年归档 YYYY年。支持 YYYY、YY、MMMM、MMM、MM、M 和 [原样文本]，月份名称使用页面语言。"
            - $formkit: select
              name: order
              label: 排序方向
              value: -1
              options:
                - label: 升序
                  value: 1
                - label: 降序
                  value: -1
            - $formkit: number
              name: limit
              label: 归档行数
              value: 8
              help: "0 显示全部；按月份或年份计数，不是文章数量。"
              min: 0
            - $formkit: number
              name: sort_order
              label: 卡片顺序
              value: 50
              min: 0
        - $formkit: group
          name: card_webinfo
          label: 网站信息字段
          help: "运行时间沿用基础设置的站点建立时间；最后更新时间是 Halo 公开文章的最近发布或修改时间。"
          children:
            - $formkit: radio
              name: post_count
              label: 显示文章总数
              value: true
              options:
                - label: 启用
                  value: true
                - label: 禁用
                  value: false
            - $formkit: radio
              name: last_push_date
              label: 显示最后更新时间
              value: true
              options:
                - label: 启用
                  value: true
                - label: 禁用
                  value: false
            - $formkit: radio
              name: runtime
              label: 显示运行时间
              value: true
              options:
                - label: 启用
                  value: true
                - label: 禁用
                  value: false
            - $formkit: number
              name: sort_order
              label: 卡片顺序
              value: 60
              min: 0
    #卡片设置
    - group: card
      label: 卡片设置
      formSchema:
        - $formkit: text
          name: radius
          label: 卡片圆角
          placeholder: 请填写 卡片圆角
          value: 15px
          help: 卡片圆角，像素或百分比，默认值： 15px
          validation: required
        - $formkit: text
          name: shadow
          label: 卡片阴影
          placeholder: 请填写 卡片阴影
          value: 0 3px 8px 6px rgba(7,17,27,0.05)
          help: 卡片阴影，默认值： 0 3px 8px 6px rgba(7,17,27,0.05)
          validation: required
    #首页设置
    - group: index
      label: 首页设置
      formSchema:
        - $formkit: radio
          name: enable_above
          label: 启用第一屏
          help: 启用首页第一屏
          value: true
          options:
            - label: 启用
              value: true
            - label: 禁用
              value: false
        - $formkit: attachment
          name: above_background
          label: 第一屏背景图
          placeholder: 请填写 第一屏背景图
          value: '/themes/halo-butterfly-next/assets/images/above.svg'
          help: 如果全局背景图设置为图片链接，则此处背景图将不生效
          validation: required
        - $formkit: text
          name: top_img_height
          label: 首页第一屏高度
          placeholder: 例如 100vh、60vh、500px
          value: ""
          help: 留空为全屏 100vh，对应上游 index_top_img_height。
        - $formkit: text
          name: site_info_top
          label: 首页标题垂直位置
          placeholder: 例如 43%、50%、20%
          value: ""
          help: 留空为 43%，表示标题区域顶部距首屏顶部的位置，对应上游 index_site_info_top。
        - $formkit: radio
          name: enable_subtitle
          label: 启用首页字幕
          help: 关闭后不显示字幕，也不请求随机文案。默认开启以保留旧版本行为。
          value: true
          options:
            - label: 启用
              value: true
            - label: 禁用
              value: false
        - $formkit: radio
          name: subtitle_effect
          label: 启用字幕打字效果
          help: 关闭后静态显示第一条文案；随机来源开启时显示返回文案，失败回退到自定义第一条。
          value: true
          options:
            - label: 启用
              value: true
            - label: 禁用
              value: false
        - $formkit: textarea
          rows: 5
          name: typewriter_custom_text
          label: 首页字幕文案
          placeholder: 请填写 首页字幕文案
          help: 多条文案用 |&| 分隔；关闭打字效果时显示第一条。留空不显示提示文字；随机来源失败时回退到此处文案。
          value: '欢迎使用Butterfly主题，一个简洁、优雅的主题~'
        - $formkit: select
          name: subtitle_source
          label: 字幕来源
          value: custom
          help: 默认沿用旧版自定义 API 开关。内置来源不受旧随机开关控制，成功后先显示远端文案，再轮播本地文案；失败回退本地。第三方服务可能不可用。
          options:
            - label: 兼容旧版／自定义 API
              value: custom
            - label: 仅本地文案（上游 false）
              value: "0"
            - label: 一言 hitokoto.cn（上游 1）
              value: "1"
            - label: 一言 aa1.cn（上游 2）
              value: "2"
            - label: 今日诗词（上游 3）
              value: "3"
        - $formkit: textarea
          name: subtitle_typed_option
          label: 字幕打字机参数（JSON）
          rows: 5
          value: ""
          placeholder: '{"typeSpeed":150,"backDelay":1500,"loop":true}'
          help: 留空保留旧版速度 200ms；可用 typeSpeed、startDelay、backSpeed、backDelay、smartBackspace、shuffle、fadeOut、fadeOutClass、fadeOutDelay、loop、loopCount、showCursor、cursorChar、autoInsertCss、bindInputFocusEvents。loopCount 可设数字或字符串 Infinity。光标按纯文本处理；不支持覆盖文案、HTML模式、DOM目标或回调。无效 JSON 或字段忽略；静态模式不使用这些参数。
        - $formkit: radio
          name: enable_typewriter_random_text
          label: 启用随机打字机文案
          help: 仅“兼容旧版／自定义 API”来源使用此开关；启用后显示自定义 API 文案，禁用时显示本地文案。
          value: false
          options:
            - label: 启用
              value: true
            - label: 禁用
              value: false
        - $formkit: text
          name: typewriter_random_api
          label: 随机文案链接（api）
          placeholder: 请正确填写 随机文案链接（api）
          value: ''
          help: 自定义随机文案API(推荐使用一言,返回格式设置为TEXT格式，json需要配置取值格式)，免费 API 不会一直可用，请知悉
        - $formkit: text
          name: typewriter_api_value_format
          label: 随机文案api取值格式
          value: ''
          help: 如果使用的随机文案API返回格式不是TEXT格式，Json请自定义取值格式，如：data.content
        - $formkit: radio
          name: post_layout
          label: 文章布局方式
          help: 文章布局方式 提供（列表、平铺）两种，仅首页生效
          value: list
          options:
            - label: 列表
              value: list
            - label: 平铺
              value: tile
        - $formkit: group
          name: index_post_content
          label: 首页列表摘要
          help: 对应上游 Butterfly index_post_content。method：false 不显示；1 仅手动摘要；2 优先手动摘要否则截断正文；3 截断正文（默认）。length 仅 method 为 2 或 3 时生效，默认 500。不做逐页覆盖。
          value:
            method: "3"
            length: 500
          children:
            - $formkit: radio
              name: method
              label: 摘要方式
              help: 对应上游 Butterfly index_post_content.method。false 不显示摘要；1 仅手动摘要（Halo spec.excerpt.raw）；2 有手动摘要则用之，否则截断正文；3 始终截断正文（默认）。
              value: "3"
              options:
                - label: 不显示
                  value: "false"
                - label: 仅手动摘要
                  value: "1"
                - label: 优先手动摘要，否则截断正文
                  value: "2"
                - label: 截断正文
                  value: "3"
            - $formkit: number
              name: length
              label: 截断长度
              help: 对应上游 Butterfly index_post_content.length。仅 method 为 2 或 3 时生效。对齐 hexo-util truncate（省略号计入长度），默认 500。
              value: 500
              min: 0
        - $formkit: group
          name: post_meta
          label: 首页列表元信息
          help: 对应上游 Butterfly post_meta.page。控制首页/分类/标签列表卡片上的日期、分类与标签。tags 默认关闭对齐上游。date_format 与文章页 post.post_meta.date_format 独立。
          value:
            date_type: created
            date_format: date
            categories: true
            tags: false
            label: true
          children:
            - $formkit: radio
              name: date_type
              label: 日期显示
              help: 对应上游 post_meta.page.date_type。created 只发布日（默认），updated 只更新日，both 两者。
              value: created
              options:
                - label: 仅发布日
                  value: created
                - label: 仅更新日
                  value: updated
                - label: 发布日与更新日
                  value: both
            - $formkit: radio
              name: date_format
              label: 日期格式
              help: 对应上游 Butterfly post_meta.page.date_format。date 为 yyyy-MM-dd 绝对日期（默认），relative 为相对时间（x 分钟前 / x 小时前 / x 天前）。与文章页 post.post_meta.date_format 独立。
              value: date
              options:
                - label: 绝对日期
                  value: date
                - label: 相对时间
                  value: relative
            - $formkit: radio
              name: categories
              label: 显示分类
              help: 对应上游 post_meta.page.categories。关闭后即使有分类也不渲染。
              value: true
              options:
                - label: 显示
                  value: true
                - label: 隐藏
                  value: false
            - $formkit: radio
              name: tags
              label: 显示标签
              help: 对应上游 post_meta.page.tags（默认关闭）。关闭后即使有标签也不渲染。
              value: false
              options:
                - label: 显示
                  value: true
                - label: 隐藏
                  value: false
            - $formkit: radio
              name: label
              label: 显示日期前缀
              help: 对应上游 post_meta.page.label。关闭后不显示「发布于」「更新于」等前缀。
              value: true
              options:
                - label: 显示
                  value: true
                - label: 隐藏
                  value: false
    #文章封面（首页列表）
    - group: cover
      label: 文章封面
      formSchema:
        - $formkit: radio
          name: index_enable
          label: 首页列表显示封面
          help: 对应上游 Butterfly cover.index_enable（默认开启）。关闭后首页 list/tile 不渲染封面。当前分类/标签页共用 list 模板，亦跟随此开关（对齐上游 indexPostUI；归档封面由 cover.archives_enable 控制，本项不含）。
          value: true
          options:
            - label: 启用
              value: true
            - label: 禁用
              value: false
        - $formkit: attachment
          name: default_cover
          label: 默认封面
          placeholder: 可选，文章未设置封面时使用
          value: ""
          help: 对应上游 cover.default_cover。留空对齐上游 null。上游可为 URL 数组并由 random_cover.js 去重随机；Halo 此项为单张附件/URL。优先级：文章封面 > 本默认封面 > loading.img.random_enable。
        - $formkit: radio
          name: aside_enable
          label: 侧栏最近文章显示封面
          help: 对应上游 Butterfly cover.aside_enable（默认开启）。只作用于侧栏最近文章卡片的缩略图；关闭后该卡片以 no-cover 展示且不输出缩略图。不做归档封面（cover.archives_enable）。
          value: true
          options:
            - label: 启用
              value: true
            - label: 禁用
              value: false
        - $formkit: radio
          name: archives_enable
          label: 归档时间轴显示封面
          help: 对应上游 Butterfly cover.archives_enable（默认开启）。只作用于归档页年-月时间轴条目的封面；关闭后不渲染封面并以 no-cover 展示。不做首页 list/tile 或侧栏最近文章封面。
          value: true
          options:
            - label: 启用
              value: true
            - label: 禁用
              value: false
    #文章设置
    - group: post
      label: 文章设置
      formSchema:
        - $formkit: radio
          name: enable_above
          label: 启用第一屏
          help: 启用首页第一屏
          value: true
          options:
            - label: 启用
              value: true
            - label: 禁用
              value: false
        - $formkit: group
          name: post_meta
          label: 文章页元信息
          help: 对应上游 Butterfly post_meta.post。date_format 与首页列表 index.post_meta.date_format 独立。
          value:
            position: left
            date_type: both
            date_format: date
            categories: true
            tags: true
            label: true
          children:
            - $formkit: radio
              name: position
              label: 元信息对齐
              help: 对应上游 post_meta.post.position，可选 left / center。默认 left。
              value: left
              options:
                - label: 左对齐
                  value: left
                - label: 居中
                  value: center
            - $formkit: radio
              name: date_type
              label: 日期显示
              help: 对应上游 post_meta.post.date_type。created 只发布日，updated 只更新日，both 两者。
              value: both
              options:
                - label: 发布日与更新日
                  value: both
                - label: 仅发布日
                  value: created
                - label: 仅更新日
                  value: updated
            - $formkit: radio
              name: date_format
              label: 日期格式
              help: 对应上游 Butterfly post_meta.post.date_format。date 为 yyyy-MM-dd 绝对日期（默认），relative 为相对时间（x 分钟前 / x 小时前 / x 天前）。与列表 index.post_meta.date_format 独立。
              value: date
              options:
                - label: 绝对日期
                  value: date
                - label: 相对时间
                  value: relative
            - $formkit: radio
              name: categories
              label: 显示分类
              help: 对应上游 post_meta.post.categories。关闭后即使有分类也不渲染。
              value: true
              options:
                - label: 显示
                  value: true
                - label: 隐藏
                  value: false
            - $formkit: radio
              name: tags
              label: 显示标签
              help: 对应上游 post_meta.post.tags。关闭后即使有标签也不渲染。
              value: true
              options:
                - label: 显示
                  value: true
                - label: 隐藏
                  value: false
            - $formkit: radio
              name: label
              label: 显示日期前缀
              help: 对应上游 post_meta.post.label。关闭后不显示「发布于」「更新于」等前缀。
              value: true
              options:
                - label: 显示
                  value: true
                - label: 隐藏
                  value: false
        - $formkit: radio
          name: post_pagination
          label: 文章上下篇
          help: 对应上游 Butterfly post_pagination（默认 1）。false 不渲染。1 / 2 对齐 layout/includes/pagination.pug：值为 2 时不调换 Hexo page.prev 与 page.next，否则对调。Halo postFinder.cursor.previous 为较早发布（对应 Hexo page.next），next 为较晚发布（对应 Hexo page.prev）。默认 1 时左侧上一篇为较早、右侧下一篇为较晚。标题与链接文本转义。不做 related_post、逐页覆盖。
          value: "1"
          options:
            - label: 关闭
              value: "false"
            - label: 1（默认）：上一篇较早、下一篇较新
              value: "1"
            - label: 2：上一篇较新、下一篇较早
              value: "2"
        - $formkit: group
          name: noticeOutdate
          label: 文章过期提醒
          help: 对应上游 Butterfly noticeOutdate（_config.yml / outdate-notice.pug / main.js addPostOutdateNotice，5.7.0 f223b188）。默认关闭。enable 关闭不渲染；天数 Math.floor((now - 更新时间) / 86400000) ≥ limit_day 才显示；更新时间取 status.lastModifyTime，无则 spec.publishTime。position top 在正文前、bottom 在正文后。style simple / flat（该 SHA 默认 flat）。文案前后缀与天数用 th:text 拼接。仅文章页；不做 related_post、wordcount、逐页覆盖。
          value:
            enable: false
            style: flat
            limit_day: 365
            position: top
            message_prev: It has been
            message_next: days since the last update, the content of the article may be outdated.
          children:
            - $formkit: radio
              name: enable
              label: 启用过期提醒
              help: 对应上游 noticeOutdate.enable（默认 false）。关闭不渲染提醒。
              value: false
              options:
                - label: 启用
                  value: true
                - label: 禁用
                  value: false
            - $formkit: radio
              name: style
              label: 样式
              help: 对应上游 noticeOutdate.style。simple 为纯色条；flat 为左侧色条加警告图标。该 SHA 默认 flat。
              value: flat
              options:
                - label: simple
                  value: simple
                - label: flat（默认）
                  value: flat
            - $formkit: number
              name: limit_day
              label: 超限天数
              help: 对应上游 noticeOutdate.limit_day（默认 365）。对齐 btf.diffDate：Math.floor((now - 更新时间) / 86400000) ≥ 本值才显示。
              value: 365
              min: 0
            - $formkit: radio
              name: position
              label: 位置
              help: 对应上游 noticeOutdate.position（默认 top）。top 插在正文前，bottom 插在正文后。
              value: top
              options:
                - label: 顶部（正文前）
                  value: top
                - label: 底部（正文后）
                  value: bottom
            - $formkit: text
              name: message_prev
              label: 文案前缀
              help: 对应上游 noticeOutdate.message_prev。与天数、后缀用空格拼接，可见文本 th:text。
              value: It has been
            - $formkit: text
              name: message_next
              label: 文案后缀
              help: 对应上游 noticeOutdate.message_next。可见文本 th:text，不做 HTML。
              value: days since the last update, the content of the article may be outdated.
        - $formkit: group
          name: related_post
          label: 相关文章
          help: 对应上游 Butterfly related_post（_config.yml / related_post.js / post.pug，5.7.0 f223b188）。默认 enable true、limit 6、date_type created。enable 关闭不渲染。无标签不渲染。按当前文章标签 listByTag 收集候选，客户端去重截断到 limit。date_type created 显示发布时间，其余显示更新时间。仅文章页，插在上下篇之后、评论之前。标题 th:text。不做 footer、reward、逐页覆盖。
          value:
            enable: true
            limit: 6
            date_type: created
          children:
            - $formkit: radio
              name: enable
              label: 启用相关文章
              help: 对应上游 related_post.enable（默认 true）。关闭不渲染相关文章。
              value: true
              options:
                - label: 启用
                  value: true
                - label: 禁用
                  value: false
            - $formkit: number
              name: limit
              label: 显示数量
              help: 对应上游 related_post.limit（默认 6）。对齐 helper 的 limit || 6，非正数回退 6。
              value: 6
              min: 1
            - $formkit: radio
              name: date_type
              label: 日期类型
              help: 对应上游 related_post.date_type（created / updated，默认 created）。created 显示发布时间，其余显示更新时间。
              value: created
              options:
                - label: created（发布）
                  value: created
                - label: updated（更新）
                  value: updated
        - $formkit: group
          name: post_copyright
          label: 文章版权
          help: 对应上游 Butterfly post_copyright（_config.yml / layout/includes/post/post-copyright.pug，5.7.0 f223b188）。默认 enable true、decode false、author_href 空、license CC BY-NC-SA 4.0、license_url 知识共享 4.0 链接。仅显式关闭 enable 才不渲染。空 author_href 回退站点 URL。可见文本 th:text，无新增 th:utext。仅文章页。不做 footer.nav、footer_img、reward 交互、逐页覆盖。
          value:
            enable: true
            decode: false
            author_href: ""
            license: CC BY-NC-SA 4.0
            license_url: https://creativecommons.org/licenses/by-nc-sa/4.0/
          children:
            - $formkit: radio
              name: enable
              label: 显示版权块
              help: 对应上游 post_copyright.enable（默认 true）。仅显式 false 关闭。关闭不渲染版权块。
              value: true
              options:
                - label: 显示
                  value: true
                - label: 隐藏
                  value: false
            - $formkit: radio
              name: decode
              label: 解码文章链接
              help: 对应上游 post_copyright.decode（默认 false）。仅显式 true 才对 permalink 做 decodeURI。可见文本走 text，不用 html。
              value: false
              options:
                - label: 解码
                  value: true
                - label: 原样
                  value: false
            - $formkit: text
              name: author_href
              label: 作者链接
              help: 对应上游 post_copyright.author_href（默认空，回退站点 URL）。可见文本 th:href，不做 HTML。
              value: ""
            - $formkit: text
              name: license
              label: 许可协议名称
              help: 对应上游 post_copyright.license（默认 CC BY-NC-SA 4.0）。空时回退该默认。可见文本 th:text。
              value: CC BY-NC-SA 4.0
            - $formkit: text
              name: license_url
              label: 许可协议链接
              help: 对应上游 post_copyright.license_url。空时回退 https://creativecommons.org/licenses/by-nc-sa/4.0/ 。可见文本 th:href。
              value: https://creativecommons.org/licenses/by-nc-sa/4.0/
        - $formkit: group
          name: reward
          label: 打赏
          help: 对应上游 Butterfly reward（_config.yml / layout/includes/post/reward.pug，5.7.0 f223b188）。默认 enable false、text 空、QR_code 空。仅显式开启且至少有一张二维码才渲染。空 text 显示「打赏」。可见文本 th:text / th:alt，无新增 th:utext。仅文章页，插在版权块之后、上下篇之前。不做 footer、related_post helper、逐页覆盖。
          value:
            enable: false
            text: ""
            QR_code: []
          children:
            - $formkit: radio
              name: enable
              label: 启用打赏
              help: 对应上游 reward.enable（默认 false）。关闭不渲染。开启仍须 QR_code 非空（对齐 post.pug 的 enable && QR_code）。
              value: false
              options:
                - label: 启用
                  value: true
                - label: 禁用
                  value: false
            - $formkit: text
              name: text
              label: 按钮文案
              help: 对应上游 reward.text（默认空，回退 i18n donate）。空时显示「打赏」。可见文本 th:text，不做 HTML。
              value: ""
            - $formkit: repeater
              name: QR_code
              label: 二维码
              help: 对应上游 reward.QR_code（img / link / text）。img 为空的项不输出。点击链接空则用图片地址。默认空列表。
              value: []
              children:
                - $formkit: attachment
                  name: img
                  label: 图片
                  help: 对应 QR_code[].img。
                  value: ""
                - $formkit: text
                  name: link
                  label: 点击链接
                  help: 对应 QR_code[].link。空则用 img。
                  value: ""
                - $formkit: text
                  name: text
                  label: 说明
                  help: 对应 QR_code[].text。可见文本 th:text / th:alt。
                  value: ""
    - group: comments
      label: 评论
      formSchema:
        - $formkit: checkbox
          name: count
          label: 显示文章评论数
          value: false
          help: 使用 Halo 评论统计；需官方评论组件 3.3.2 或更新版本，且文章允许评论。
        - $formkit: checkbox
          name: card_post_count
          label: 显示列表卡片评论数
          value: false
          help: 默认关闭。首页、分类和标签列表使用 Halo 评论统计，不请求第三方计数服务。
    - group: wordcount
      label: 字数统计
      formSchema:
        - $formkit: radio
          name: enable
          label: 启用字数与阅读时长
          help: 对应上游 Butterfly wordcount.enable（依赖 hexo-wordcount，_config.yml 默认 false）。关闭时文章页不渲染字数总计与阅读时长。不做 total_wordcount、页脚字数。
          value: false
          options:
            - label: 启用
              value: true
            - label: 禁用
              value: false
        - $formkit: radio
          name: post_wordcount
          label: 显示字数总计
          help: 对应上游 wordcount.post_wordcount（默认 true）。仅 wordcount.enable 开启时生效。
          value: true
          options:
            - label: 显示
              value: true
            - label: 隐藏
              value: false
        - $formkit: radio
          name: min2read
          label: 显示阅读时长
          help: 对应上游 wordcount.min2read（默认 true）。仅 wordcount.enable 开启时生效。
          value: true
          options:
            - label: 显示
              value: true
            - label: 隐藏
              value: false
    - group: busuanzi
      label: 访问统计
      formSchema:
        - $formkit: radio
          name: page_pv
          label: 显示文章阅读量
          help: 对应上游 Butterfly busuanzi.page_pv。实验室对照关闭，本主题默认关闭以免文章页多出阅读量。不做 site_uv / site_pv（网站信息另票）。
          value: false
          options:
            - label: 显示
              value: true
            - label: 隐藏
              value: false
    #文章目录（对齐上游 toc.number / expand / style_simple / scroll_percent）
    - group: toc
      label: 文章目录
      formSchema:
        - $formkit: radio
          name: number
          label: 目录序号
          help: 对应上游 Butterfly toc.number（_config.yml / card_post_toc.pug list_number，5.7.0 f223b188）。默认开启。关闭后目录项不带 1. / 1.1. 序号。不做 toc.post / toc.page、逐页 toc_number。
          value: true
          options:
            - label: 显示
              value: true
            - label: 隐藏
              value: false
        - $formkit: radio
          name: expand
          label: 默认展开
          help: 对应上游 toc.expand（默认关闭）。开启后目录加 is-expand、子级全部展开；关闭时仅当前项父级展开。不做逐页 toc_expand。
          value: false
          options:
            - label: 展开
              value: true
            - label: 折叠（默认）
              value: false
        - $formkit: radio
          name: style_simple
          label: 简洁侧栏
          help: 对应上游 toc.style_simple（默认关闭，仅文章页）。开启后文章侧栏只保留目录，不渲染最近文章等其它卡片。不做 related_post。
          value: false
          options:
            - label: 仅目录
              value: true
            - label: 目录与其它卡片（默认）
              value: false
        - $formkit: radio
          name: scroll_percent
          label: 滚动百分比
          help: 对应上游 toc.scroll_percent（默认开启）。开启后目录标题显示阅读进度百分比；关闭不渲染、不更新。右下角回到顶部百分比见 rightside.scroll_percent。
          value: true
          options:
            - label: 显示
              value: true
            - label: 隐藏
              value: false
    #归档设置
