apiVersion: v1alpha1
kind: Setting
metadata:
  name: halo-butterfly-next-setting
spec:
  forms:
    - group: base
      label: 基本设置
      formSchema:
        - $formkit: checkbox
          name: enable_seo
          label: 输出主题分享元数据与规范链接
          value: true
          help: 输出核心页面及分页的 canonical、Open Graph、Twitter/Facebook 和可选结构化数据。由 SEO 插件接管时关闭；描述和关键词仍由 Halo 提供。
        - $formkit: text
          name: metadata_name
          label: 作者用户名
          placeholder: 请填写作者的唯一标识（用户名）
          value: ""
          help: 可选。填写 Halo 用户名显示个人资料；留空或用户不存在时使用站点信息。
        - $formkit: text
          name: icp
          label: ICP 备案号
          placeholder: 请填写 ICP 备案号信息
          help: ICP 备案信息将展示在页脚中，不填不展示（示例：蜀ICP备xx号）
        - $formkit: text
          name: police
          label: 公网安备号
          placeholder: 请填写公网安备号信息
          help: 公网安备信息将展示在页脚中，不填不展示（示例：京公xxx号）
        - $formkit: date
          name: site_birthday
          label: 建站时间
          placeholder: 示例 2022-01-01 00:00
          help: 自定义博客的起始时间/安装时间，作为计算博客运行时间的参照值，不选择不显示
    - group: seo
      label: SEO 与站点验证
      formSchema:
        - $formkit: repeater
          name: site_verification
          label: 站点验证
          value: []
          help: 多个验证标签按顺序输出，与主题 SEO 总开关独立。列表中相同 name 取最后一条；避免与 Halo 全局注入或插件重复配置。
          children:
            - $formkit: text
              name: name
              label: 验证标签名称
              value: ""
            - $formkit: text
              name: content
              label: 验证值
              value: ""
        - $formkit: select
          name: twitter_card
          label: Twitter 卡片类型
          value: summary_large_image
          options:
            - label: 大图摘要
              value: summary_large_image
            - label: 摘要
              value: summary
        - $formkit: attachment
          name: twitter_image
          label: Twitter 默认图片
          value: ""
          help: 留空复用 OG 图片。OG 图片优先原生文章/单页封面，然后使用作者头像或站点 Logo。
        - $formkit: text
          name: twitter_id
          label: Twitter 作者账号
          value: ""
          help: 可带 @，留空不输出 twitter:creator。
        - $formkit: text
          name: twitter_site
          label: Twitter 站点账号
          value: ""
        - $formkit: text
          name: google_plus
          label: Google+ 发布者链接（上游兼容字段）
          value: ""
          help: Google+ 已停止服务；仅在配置时输出原上游 link rel=publisher，不默认启用。
        - $formkit: text
          name: fb_admins
          label: Facebook 管理员 ID
          value: ""
        - $formkit: text
          name: fb_app_id
          label: Facebook 应用 ID
          value: ""
        - $formkit: checkbox
          name: structured_data
          label: 输出结构化数据
          value: false
          help: 同时受基本设置中的 SEO 总开关控制。输出文章 BlogPosting 与域名根首页第一页 WebSite；SEO 插件已输出时请关闭。
        - $formkit: repeater
          name: alternate_name
          label: 站点别名
          value: []
          children:
            - $formkit: text
              name: name
              label: 别名
              value: ""
    - group: inject
      label: 代码注入
      formSchema:
        - $formkit: repeater
          name: head
          label: head 末尾注入
          value: []
          help: 管理员 HTML/脚本按列表顺序原样输出，不处理模板表达式。随后 Halo 追加全局和内容 head、插件资源；不要重复添加已有 SEO 标签。
          children:
            - $formkit: textarea
              name: html
              label: HTML 代码
              value: ""
        - $formkit: repeater
          name: bottom
          label: body 末尾注入
          value: []
          help: 在主题脚本之后按列表顺序原样输出。Halo 全局页脚仍在站点页脚位置输出；注入只配置可信代码。
          children:
            - $formkit: textarea
              name: html
              label: HTML 代码
              value: ""

    #主题设置
    - group: style
      label: 主题设置
      formSchema:
        - $formkit: select
          name: mode
          label: 主题模式
          value: 'user'
          placeholder: 请填写主题颜色
          help: "设置博客的主题模式（自动/用户/浅色/深色），默认用户。右下角 #darkmode 显隐见 darkmode.enable / darkmode.button。light/dark 仍强制。自动切换策略见 darkmode.autoChangeMode；小时窗口见 start / end。"
          options:
            - value: 'auto'
              label: 自动模式
            - value: 'user'
              label: 用户模式
            - value: 'light'
              label: 浅色模式
            - value: 'dark'
              label: 深色模式
        - $formkit: select
          name: font_family
          label: 主题字体
          value: 'null'
          help: 当前预览版使用系统字体。旧版附带字体不再分发。
          options:
            - value: 'null'
              label: "系统字体"
        - $formkit: text
          name: body_background
          label: 全局背景（浅色）
          placeholder: 请填写 全局背景
          value: '#f7f9fe'
          help: 颜色值 默认值：#f7f9fe
          validation: required
    - group: appearance
      label: 外观
      formSchema:
        - $formkit: radio
          name: text_align_justify
          label: 正文两端对齐
          value: false
          options:
            - label: 启用
              value: true
            - label: 关闭
              value: false
        - $formkit: radio
          name: enter_transitions
          label: 页面入场动画
          value: false
          options:
            - label: 启用
              value: true
            - label: 关闭
              value: false
        - $formkit: radio
          name: avatar_effect
          label: 头像旋转
          value: true
          help: 关闭后作者卡片和移动导航的头像不旋转。默认保留旧版效果。
          options:
            - label: 启用
              value: true
            - label: 关闭
              value: false
        - $formkit: select
          name: category_ui
          label: 分类展示
          value: chart
          options:
            - value: chart
              label: 统计图（旧版）
            - value: list
              label: 分类列表
        - $formkit: select
          name: tag_ui
          label: 标签展示
          value: chart
          options:
            - value: chart
              label: 统计图和标签云（旧版）
            - value: cloud
              label: 标签云
        - $formkit: repeater
          name: tag_custom_colors
          label: 标签页自定义颜色
          value: []
          children:
            - $formkit: text
              name: light
              label: 浅色颜色
            - $formkit: text
              name: dark
              label: 深色颜色
              help: 留空复用浅色；请核对亮暗可读性。
        - $formkit: group
          name: beautify
          label: 正文美化
          children:
            - $formkit: radio
              name: enable
              label: 启用美化
              value: false
              options:
                - label: 启用
                  value: true
                - label: 关闭
                  value: false
            - $formkit: select
              name: field
              label: 作用范围
              value: post
              options:
                - value: post
                  label: 仅文章
                - value: site
                  label: 文章、单页和插件正文
            - $formkit: text
              name: title_prefix_icon
              label: 标题图标 Unicode
              value: \f0c1
            - $formkit: text
              name: title_prefix_icon_color
              label: 标题图标颜色
              value: ""
        - $formkit: group
          name: font
          label: 字体
          children:
            - $formkit: text
              name: global_font_size
              label: 全局字号
              value: ""
              help: 如 14px、1rem。留空使用默认。
            - $formkit: text
              name: code_font_size
              label: 代码字号
              value: ""
            - $formkit: text
              name: font_family
              label: 正文字体
              value: ""
              help: 填写字体族名称，不附带下载；留空使用系统字体。
            - $formkit: text
              name: code_font_family
              label: 代码字体
              value: ""
        - $formkit: group
          name: blog_title_font
          label: 站点标题字体
          children:
            - $formkit: text
              name: font_link
              label: 字体样式表 URL
              value: ""
              help: 可选 HTTPS 或站内 URL；仅显式填写时请求。
            - $formkit: text
              name: font_family
              label: 字体族
              value: ""
        - $formkit: group
          name: hr_icon
          label: 分割线图标
          children:
            - $formkit: radio
              name: enable
              label: 显示图标
              value: true
              options:
                - label: 启用
                  value: true
                - label: 关闭
                  value: false
            - $formkit: text
              name: icon
              label: 图标 Unicode
              value: \f2dc
            - $formkit: text
              name: icon_top
              label: 图标垂直位置
              value: -10px
        - $formkit: group
          name: theme_color
          label: 主题配色
          children:
            - $formkit: radio
              name: enable
              label: 启用自定义配色
              value: false
              options:
                - label: 启用
                  value: true
                - label: 关闭
                  value: false
            - $formkit: text
              name: main
              label: 主题主色
              value: ""
              help: 留空使用原配色，接受 CSS 颜色值。
            - $formkit: text
              name: paginator
              label: 分页当前页
              value: ""
              help: 留空使用原配色，接受 CSS 颜色值。
            - $formkit: text
              name: button_hover
              label: 按钮悬停
              value: ""
              help: 留空使用原配色，接受 CSS 颜色值。
            - $formkit: text
              name: text_selection
              label: 选中文字背景
              value: ""
              help: 留空使用原配色，接受 CSS 颜色值。
            - $formkit: text
              name: link_color
              label: 正文链接
              value: ""
              help: 留空使用原配色，接受 CSS 颜色值。
            - $formkit: text
              name: meta_color
              label: 文章元信息
              value: ""
              help: 留空使用原配色，接受 CSS 颜色值。
            - $formkit: text
              name: hr_color
              label: 分割线
              value: ""
              help: 留空使用原配色，接受 CSS 颜色值。
            - $formkit: text
              name: code_foreground
              label: 行内代码文字
              value: ""
              help: 留空使用原配色，接受 CSS 颜色值。
            - $formkit: text
              name: code_background
              label: 行内代码背景
              value: ""
              help: 留空使用原配色，接受 CSS 颜色值。
            - $formkit: text
              name: toc_color
              label: 目录选中项
              value: ""
              help: 留空使用原配色，接受 CSS 颜色值。
            - $formkit: text
              name: blockquote_padding_color
              label: 引用边框
              value: ""
              help: 留空使用原配色，接受 CSS 颜色值。
            - $formkit: text
              name: blockquote_background_color
              label: 引用背景
              value: ""
              help: 留空使用原配色，接受 CSS 颜色值。
            - $formkit: text
              name: scrollbar_color
              label: 滚动条
              value: ""
              help: 留空使用原配色，接受 CSS 颜色值。
            - $formkit: text
              name: meta_theme_color_light
              label: 浏览器主题色（浅色）
              value: ""
              help: 留空使用原配色，接受 CSS 颜色值。
            - $formkit: text
              name: meta_theme_color_dark
              label: 浏览器主题色（深色）
              value: ""
              help: 留空使用原配色，接受 CSS 颜色值。
    - group: effects
      label: 动画特效
      formSchema:
        - $formkit: static
          value: 特效默认关闭，按需加载。不响应密码输入；系统要求减少动态效果时全部停用。手机需要单独开启。
        - $formkit: group
          name: activate_power_mode
          label: 输入粒子
          children:
            - $formkit: radio
              name: enable
              label: 输入效果
              value: false
              options:
                - label: 启用
                  value: true
                - label: 关闭
                  value: false
            - $formkit: radio
              name: colorful
              label: 彩色粒子
              value: true
              options:
                - label: 启用
                  value: true
                - label: 关闭
                  value: false
            - $formkit: radio
              name: shake
              label: 输入框震动
              value: true
              options:
                - label: 启用
                  value: true
                - label: 关闭
                  value: false
            - $formkit: radio
              name: mobile
              label: 手机启用
              value: false
              options:
                - label: 启用
                  value: true
                - label: 关闭
                  value: false
        - $formkit: group
          name: canvas_ribbon
          label: 静态彩带
          children:
            - $formkit: radio
              name: enable
              label: 彩带背景
              value: false
              options:
                - label: 启用
                  value: true
                - label: 关闭
                  value: false
            - $formkit: number
              name: size
              label: 尺寸
              value: 150
              min: 20
              max: 500
            - $formkit: number
              name: alpha
              label: 透明度
              value: 0.6
              min: 0
              max: 1
            - $formkit: number
              name: zIndex
              label: 层级
              value: -1
              min: -1
              max: 10
            - $formkit: radio
              name: click_to_change
              label: 点击更换彩带
              value: false
              options:
                - label: 启用
                  value: true
                - label: 关闭
                  value: false
            - $formkit: radio
              name: mobile
              label: 手机启用
              value: false
              options:
                - label: 启用
                  value: true
                - label: 关闭
                  value: false
        - $formkit: group
          name: canvas_fluttering_ribbon
          label: 飘动彩带
          children:
            - $formkit: radio
              name: enable
              label: 飘动彩带
              value: false
              options:
                - label: 启用
                  value: true
                - label: 关闭
                  value: false
            - $formkit: radio
              name: mobile
              label: 手机启用
              value: false
              options:
                - label: 启用
                  value: true
                - label: 关闭
                  value: false
        - $formkit: group
          name: canvas_nest
          label: 连线背景
          children:
            - $formkit: radio
              name: enable
              label: 连线背景
              value: false
              options:
                - label: 启用
                  value: true
                - label: 关闭
                  value: false
            - $formkit: text
              name: color
              label: RGB 颜色
              value: 0,0,255
            - $formkit: number
              name: opacity
              label: 透明度
              value: 0.7
              min: 0
              max: 1
            - $formkit: number
              name: zIndex
              label: 层级
              value: -1
              min: -1
              max: 10
            - $formkit: number
              name: count
              label: 粒子数
              value: 99
              min: 1
              max: 150
            - $formkit: radio
              name: mobile
              label: 手机启用
              value: false
              options:
                - label: 启用
                  value: true
                - label: 关闭
                  value: false
        - $formkit: group
          name: fireworks
          label: 点击烟花
          children:
            - $formkit: radio
              name: enable
              label: 点击烟花
              value: false
              options:
                - label: 启用
                  value: true
                - label: 关闭
                  value: false
            - $formkit: number
              name: zIndex
              label: 层级
              value: 10
              min: -1
              max: 100
            - $formkit: radio
              name: mobile
              label: 手机启用
              value: false
              options:
                - label: 启用
                  value: true
                - label: 关闭
                  value: false
        - $formkit: group
          name: click_heart
          label: 点击爱心
          children:
            - $formkit: radio
              name: enable
              label: 点击爱心
              value: false
              options:
                - label: 启用
                  value: true
                - label: 关闭
                  value: false
            - $formkit: radio
              name: mobile
              label: 手机启用
              value: false
              options:
                - label: 启用
                  value: true
                - label: 关闭
                  value: false
        - $formkit: group
          name: clickShowText
          label: 点击文字
          children:
            - $formkit: radio
              name: enable
              label: 点击文字
              value: false
              options:
                - label: 启用
                  value: true
                - label: 关闭
                  value: false
            - $formkit: repeater
              name: text
              label: 文字列表
              value: []
              children:
                - $formkit: text
                  name: value
                  label: 文字
                  value: ""
            - $formkit: text
              name: fontSize
              label: 字号
              value: 15px
            - $formkit: radio
              name: random
              label: 随机文字
              value: false
              options:
                - label: 启用
                  value: true
                - label: 关闭
                  value: false
            - $formkit: radio
              name: mobile
              label: 手机启用
              value: false
              options:
                - label: 启用
                  value: true
                - label: 关闭
                  value: false
    #加载设置
    - group: image
      label: 图片
      formSchema:
        - $formkit: radio
          name: disable_top_img
          label: 全局关闭顶图
          value: false
          help: 关闭所有主题页面的页头顶图区域；标题保留在内容区。优先于页面类型设置和单篇设置，不影响列表封面。
          options:
            - label: 保留顶图
              value: false
            - label: 全局关闭
              value: true
        - $formkit: attachment
          name: default_top_img
          label: 默认顶图
          value: ""
          help: 可选。文章和单页优先复用原生封面，无封面时使用此图；其他页面优先使用自己的背景或原生分类/标签封面。留空保留旧回退规则。顶图加载失败时也尝试此图，仍失败则显示纯色背景。

        - $formkit: attachment
          name: flink_error
          label: 友链失败图片
          value: ""
          help: 留空继续使用图片加载中的失败图；失败图也不可用时保留文字与链接。

    - group: loading
      label: 加载设置
      formSchema:
        - $formkit: checkbox
          name: enable
          label: 启用页面加载动画
          value: true
          help: 关闭后直接显示页面。旧配置未设置时保持开启；正文就绪后结束，不等待第三方资源。
        - $formkit: checkbox
          name: instantpage
          label: 预取站内内容链接
          value: false
          help: 鼠标经过或键盘聚焦列表、分页链接时提示浏览器预取。每页最多 8 个，省流量/慢速网络和带查询参数的链接跳过。
        - $formkit: radio
          name: type
          label: 页面加载（Loading）
          help: 内置多种加载样式
          value: 'circle'
          options:
            - label: '转圈'
              value: 'circle'
            - label: '沙漏'
              value: 'hourglass'
            - label: '交叉线'
              value: 'cross_line'
            - label: '小圆点'
              value: 'dot'
          validation: required
        - $formkit: group
          label: 图片加载
          name: img
          value:
            preload: 'data:image/gif;base64,R0lGODdhAQABAPAAAMPDwwAAACwAAAAAAQABAAACAkQBADs='
            err: 'data:image/gif;base64,R0lGODdhAQABAPAAAMPDwwAAACwAAAAAAQABAAACAkQBADs='
            random_enable: false
            random_link: ''
          children:
            - $formkit: attachment
              name: preload
              label: 预加载图
              placeholder: 请填写 预加载图片
              value: 'data:image/gif;base64,R0lGODdhAQABAPAAAMPDwwAAACwAAAAAAQABAAACAkQBADs='
              help: 预加载图片，默认 data:image/gif;base64,R0lGODdhAQABAPAAAMPDwwAAACwAAAAAAQABAAACAkQBADs=
              validation: required
            - $formkit: attachment
              name: err
              label: 加载失败图
              placeholder: 请填写 加载失败图片
              value: 'data:image/gif;base64,R0lGODdhAQABAPAAAMPDwwAAACwAAAAAAQABAAACAkQBADs='
              help: 加载失败图片，默认 data:image/gif;base64,R0lGODdhAQABAPAAAMPDwwAAACwAAAAAAQABAAACAkQBADs=
              validation: required
            - $formkit: radio
              name: random_enable
              label: 启用随机图片
              help: 是否启用随机图API（必须先配置 API），开启后将使用随机图填充没有设置封面的，未开启时使用主题内置的封面图
              value: false
              validation: required
              options:
                - label: 启用
                  value: true
                - label: 禁用
                  value: false
            - $formkit: text
              name: random_link
              label: 随机图片链接
              placeholder: 请正确填写 随机图片链接
              value: ''
