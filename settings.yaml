          label: 代码块高度限制
          help: 对应上游 code_blocks.height_limit。默认不限制；200/400 为像素上限。
          value: false
          options:
            - label: 不限制
              value: false
            - label: 200px
              value: 200
            - label: 400px
              value: 400
        - $formkit: radio
          name: enable_code_word_wrap
          if: $get(enable_code).value
