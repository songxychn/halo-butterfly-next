              value: date
              options:
                - label: 绝对日期
                  value: date
                - label: 相对时间
                  value: relative
            - $formkit: radio
              name: categories
              label: 显示分类
              help: 对应上游 post_meta.post.categories。关闭后即使有分类也不渲染。
              value: true
              options:
                - label: 显示
                  value: true
                - label: 隐藏
                  value: false
