              value: true
            - label: 禁用
              value: false
        - $formkit: radio
          name: enable_code
          id: enable_code
          key: enable_code
          label: 启用代码块
          help: 如果安装其他代码块插件，请关闭此功能！！！
          value: true
          options:
            - label: 启用
              value: true
            - label: 禁用
              value: false
        - $formkit: radio
          name: enable_code_title
          if: $get(enable_code).value
          label: 启用代码标题
          help: 对应上游 code_blocks.language。关闭后不显示语言标题。
          value: true
          options:
            - label: 启用
              value: true
            - label: 禁用
              value: false
        - $formkit: radio
          name: enable_code_hr
          if: $get(enable_code).value
          label: 启用代码标题分割线
          help: 启用代码标题和内容之间的分割线，不展示时会更加简洁
          value: true
          options:
            - label: 启用
              value: true
            - label: 禁用
              value: false
        - $formkit: radio
          name: enable_code_line
          if: $get(enable_code).value
          label: 启用代码行号
          help: 启用代码块行号功能
          value: true
          options:
            - label: 启用
              value: true
            - label: 禁用
              value: false
        - $formkit: radio
          name: enable_code_copy
          if: $get(enable_code).value
          label: 启用代码复制
          help: 对应上游 code_blocks.copy。关闭后不显示复制按钮。
          value: true
          options:
            - label: 启用
              value: true
            - label: 禁用
              value: false
        - $formkit: radio
          name: enable_code_expander
          if: $get(enable_code).value
          label: 代码块默认折叠
          help: 对应上游 code_blocks.shrink（false / true / none）。false：有折叠按钮且初始展开；true：有按钮且初始折叠（closed）；none：不显示折叠按钮。默认 false，与上游一致。旧版布尔 true（有按钮、初始展开）运行时映射为 false；旧版布尔 false（无按钮）映射为 none，已有站点不会因升级变成初始折叠。
          value: "false"
          options:
            - label: 初始展开（上游 false）
              value: "false"
            - label: 初始折叠（上游 true）
              value: "true"
            - label: 不显示按钮（上游 none）
              value: "none"
        - $formkit: radio
          name: enable_code_mac_style
          if: $get(enable_code).value
          label: 启用 mac 风格圆点
          help: 对应上游 code_blocks.macStyle。默认关闭，与上游一致；开启后显示窗口圆点。
