<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="color-scheme" content="light dark">
  <title>暂时无法连接 · 请重试</title>
  <style>
    :root { color-scheme:light dark; font:18px/1.75 system-ui,sans-serif; color:#243247; background:#f7f9fe }
    * { box-sizing:border-box } body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px }
    main { width:min(100%,560px); padding:clamp(24px,6vw,48px); border:1px solid #cbd5e1; border-radius:24px; background:#fff }
    .symbol { font-size:2.5rem; color:#185d85 } h1 { font-size:1.65rem; line-height:1.4; margin:12px 0 }
    p { margin:16px 0 24px } button { font:inherit; font-weight:600; border:0; border-radius:12px; padding:10px 24px; color:white; background:#185d85; cursor:pointer }
    button:focus-visible { outline:3px solid #db7b00; outline-offset:4px } small { display:block; margin-top:24px; font-size:.85rem; color:#536174 }
    @media(prefers-color-scheme:dark) { :root { color:#ecf1fa; background:#151b25 } main { background:#202a38; border-color:#526178 } small { color:#c2cdde } .symbol { color:#9bd8ff } }
  </style>
</head>
<body><main>
  <span class="symbol" aria-hidden="true">☁</span>
  <h1>暂时无法连接</h1>
  <p>请检查网络连接，然后重试。恢复连接后，将为你打开最新页面。</p>
  <button type="button" onclick="location.reload()">重新加载</button>
  <small>此应用暂不提供文章离线阅读。</small>
</main></body>
</html>
