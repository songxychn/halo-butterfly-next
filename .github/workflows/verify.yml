name: Verify theme
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      upload_artifact:
        description: '上传主题安装包（保留 7 天）'
        type: boolean
        required: false
        default: false
permissions:
  contents: read
concurrency:
  group: theme-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Checkout fixed Butterfly reference
        uses: actions/checkout@v4
        with:
          repository: jerryc127/hexo-theme-butterfly
          ref: f223b1888b42b2b336068e6c959ed90a3cd7c8f3
          path: .runtime/upstream-butterfly
          persist-credentials: false
      - name: Verify inventory against fixed upstream source
        run: bun run parity:check --upstream .runtime/upstream-butterfly
      - run: bun run verify
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/cache@v4
        with:
          path: .runtime/pwa-deps/halo-2.26.1.jar
          key: pwa-halo-2.26.1-7a1d6ea0800e8940
      - name: Build optional PWA plugin and verify reproducibility
        shell: bash
        run: |
          mkdir -p .runtime/pwa-deps
          if [ ! -f .runtime/pwa-deps/halo-2.26.1.jar ]; then
            curl --fail --location --retry 2 https://github.com/halo-dev/halo/releases/download/v2.26.1/halo-2.26.1.jar -o .runtime/pwa-deps/halo-2.26.1.jar
          fi
          bun run pwa:build .runtime/pwa-deps/halo-2.26.1.jar
          sha256sum dist/butterfly-pwa-0.1.0.jar > pwa.sha256
          bun run pwa:build .runtime/pwa-deps/halo-2.26.1.jar
          sha256sum --check pwa.sha256
      - name: Rebuild and compare archive
        shell: bash
        run: |
          sha256sum dist/*.zip > package.sha256
          bun run build
          sha256sum --check package.sha256
      - name: Upload requested preview package
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.upload_artifact }}
        uses: actions/upload-artifact@v4
        with:
          name: halo-butterfly-next-preview
          path: |
            dist/*.zip
            dist/butterfly-pwa-*.jar
          if-no-files-found: error
          retention-days: 7
