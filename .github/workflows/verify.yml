name: Verify theme
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: theme-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Checkout fixed Butterfly reference
        uses: actions/checkout@v4
        with:
          repository: jerryc127/hexo-theme-butterfly
          ref: f223b1888b42b2b336068e6c959ed90a3cd7c8f3
          path: .runtime/upstream-butterfly
          persist-credentials: false
      - name: Verify inventory against fixed upstream source
        run: pnpm parity:check --upstream .runtime/upstream-butterfly
      - run: pnpm verify
      - name: Rebuild and compare archive
        shell: bash
        run: |
          sha256sum dist/*.zip > package.sha256
          pnpm build
          sha256sum --check package.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: halo-butterfly-next-preview
          path: dist/*.zip
          if-no-files-found: error
