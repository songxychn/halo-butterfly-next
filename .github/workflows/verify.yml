name: Verify theme
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      upload_artifact:
        description: '上传主题安装包（保留 7 天）'
        type: boolean
        required: false
        default: false
permissions:
  contents: read
concurrency:
  group: theme-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run verify
      - name: Upload requested preview package
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.upload_artifact }}
        uses: actions/upload-artifact@v4
        with:
          name: halo-butterfly-next-preview
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 7
