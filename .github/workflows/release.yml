name: Release theme
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag to publish or retry'
        type: string
        required: true
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: release-theme
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run verify
      - name: Stage release assets
        run: python3 scripts/release/prepare.py "$TAG"
      - name: Publish GitHub Release
        run: python3 scripts/release/publish.py "$TAG"
  demo:
    needs: publish
    uses: ./.github/workflows/deploy-demo.yml
    permissions:
      contents: read
      packages: write
    with:
      tag: ${{ inputs.tag || github.ref_name }}
