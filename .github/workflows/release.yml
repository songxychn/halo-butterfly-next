name: Release theme
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag to publish or retry'
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: release-theme
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.identity.outputs.tag }}
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run verify
      - name: Reproduce archive
        run: |
          sha256sum dist/*.zip > /tmp/theme.sha256
          bun run build
          sha256sum -c /tmp/theme.sha256
      - name: Check acceptance and corresponding source
        run: python3 scripts/release/prepare.py "$TAG"
      - name: Publish and verify downloaded assets
        run: python3 scripts/release/publish.py "$TAG"
      - id: identity
        run: printf 'tag=%s\n' "$TAG" >> "$GITHUB_OUTPUT"
  demo:
    needs: publish
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/deploy-demo.yml
    with:
      tag: ${{ needs.publish.outputs.tag }}
