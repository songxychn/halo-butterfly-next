name: Linux Halo browser comparison
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact 40-character theme commit to build and test
        required: true
        type: string
  pull_request:
    paths:
      - .github/workflows/linux-halo-browser.yml
      - scripts/ci/linux-halo/**
permissions:
  contents: read
concurrency:
  group: linux-halo-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core:
    # Repository visibility does not affect eligibility; fork PRs remain excluded.
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      HALO_PORT: '18141'
      HEXO_PORT: '14141'
    steps:
      - name: Select ephemeral runner paths
        run: |
          printf 'LAB_RUNTIME=%s/linux-halo-lab\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'EVIDENCE_OUTPUT=%s/linux-halo-evidence\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: harness
          persist-credentials: false
      - name: Validate exact source identity
        id: source
        env:
          REQUESTED_SHA: ${{ inputs.source_sha || github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 - <<'PY'
          import os, re
          sha = os.environ['REQUESTED_SHA']
          if not re.fullmatch('[0-9a-f]{40}', sha):
              raise SystemExit('source_sha must be a full lowercase 40-hex commit SHA')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('sha=' + sha + '\n')
          PY
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.sha }}
          path: theme-source
          persist-credentials: false
      - name: Create exact short harness checkout for Chromium socket paths
        run: |
          python3 - <<'PYCODE'
          import os
          socket = os.environ['RUNNER_TEMP'] + '/h/.runtime/browser-matrix/tmp/org.chromium.Chromium.XXXXXX/SingletonSocket'
          if len(os.fsencode(socket)) >= 108:
              raise SystemExit('Chromium Unix socket path would exceed its 108-byte limit')
          print('Maximum planned Chromium socket path bytes:', len(os.fsencode(socket)))
          PYCODE
          test ! -e "$RUNNER_TEMP/h"
          harness_sha=$(git -C harness rev-parse HEAD)
          git clone --no-hardlinks --no-checkout harness "$RUNNER_TEMP/h"
          git -C "$RUNNER_TEMP/h" checkout --detach "$harness_sha"
          test "$(git -C "$RUNNER_TEMP/h" rev-parse HEAD)" = "$harness_sha"
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'
      - name: Select the exact source package manager
        id: theme-manager
        working-directory: theme-source
        run: |
          manager=$(node -p "JSON.parse(require('node:fs').readFileSync('package.json', 'utf8')).packageManager")
          case "$manager" in
            pnpm@11.19.0) test -f pnpm-lock.yaml ;;
            bun@1.4.0) test -f bun.lock ;;
            *) echo "Unsupported source package manager: $manager" >&2; exit 1 ;;
          esac
          printf 'manager=%s\n' "$manager" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@v4
        if: steps.theme-manager.outputs.manager == 'pnpm@11.19.0'
        with:
          version: '11.19.0'
          run_install: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build exact theme checkout
        working-directory: theme-source
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          THEME_PACKAGE_MANAGER: ${{ steps.theme-manager.outputs.manager }}
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          case "$THEME_PACKAGE_MANAGER" in
            pnpm@11.19.0)
              pnpm install --frozen-lockfile --ignore-scripts
              pnpm verify
              ;;
            bun@1.4.0)
              bun install --frozen-lockfile --ignore-scripts
              bun run verify
              ;;
            *) echo "Unsupported source package manager" >&2; exit 1 ;;
          esac
      - name: Make exact theme object available to the independent harness
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: git -C "$RUNNER_TEMP/h" fetch --no-tags "$GITHUB_WORKSPACE/theme-source" "$SOURCE_SHA"
      - name: Install fixed independent Playwright engines
        working-directory: ${{ runner.temp }}/h
        run: node scripts/browser/install.mjs
      - name: Install Ubuntu dependencies using the pinned Playwright CLI
        run: node "$RUNNER_TEMP/h/.runtime/browser-matrix/deps/node_modules/playwright/cli.js" install-deps chromium firefox webkit
      - name: Run real Halo and anonymous 120-page matrix
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: python3 "$RUNNER_TEMP/h/scripts/ci/linux-halo/run.py" --source theme-source --source-sha "$SOURCE_SHA"
      - name: Stop only this job's owned synthetic service
        if: always()
        run: |
          if test -f "$RUNNER_TEMP/h/scripts/ci/linux-halo/run.py"; then
            python3 "$RUNNER_TEMP/h/scripts/ci/linux-halo/run.py" --cleanup
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-halo-${{ steps.source.outputs.sha }}
          path: ${{ env.EVIDENCE_OUTPUT }}/
          if-no-files-found: warn
          retention-days: 14
