name: Linux Halo browser regression
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Commit SHA to build and test (defaults to current ref)
        required: false
        type: string
  pull_request:
    paths:
      - 'src/**'
      - 'settings.yaml'
      - 'annotation-setting.yaml'
      - 'scripts/build.mjs'
      - 'scripts/ci/linux-halo/**'
      - 'scripts/lab/**'
      - 'scripts/browser/**'
      - '.github/workflows/linux-halo-browser.yml'
permissions:
  contents: read
concurrency:
  group: linux-halo-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      HALO_PORT: '18141'
      HEXO_PORT: '14141'
    steps:
      - name: Select ephemeral runner paths
        run: |
          printf 'LAB_RUNTIME=%s/linux-halo-lab\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'EVIDENCE_OUTPUT=%s/linux-halo-evidence\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify and build theme
        run: |
          bun install --frozen-lockfile --ignore-scripts
          bun run verify
      - name: Install Playwright browsers
        run: |
          bun scripts/browser/install.mjs
          bun .runtime/browser-matrix/deps/node_modules/playwright/cli.js install-deps chromium firefox webkit
      - name: Run Halo browser regression
        run: python3 scripts/ci/linux-halo/run.py --source . --source-sha "$(git rev-parse HEAD)"
      - name: Stop lab service
        if: always()
        run: python3 scripts/ci/linux-halo/run.py --cleanup
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-halo-report
          path: ${{ env.EVIDENCE_OUTPUT }}/
          if-no-files-found: warn
          retention-days: 14
